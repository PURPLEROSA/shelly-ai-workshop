<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keys · what an agent can do with the tools you give it</title>
<!--
  Keys. A tool-permission panel that is a key rack: hand the agent a key and it swings across from your
  rail to the agent's, while the answer to the same request changes from words to deeds.

  job: toggle (three of them) · material: brass · gesture: click, Space · family: physics (a pendulum on a hop)
  The trick: each key has two numbers, how far it has travelled and how far it is swinging. The swing is a
  spring kicked by the travel's acceleration, so a key that sets off leans back and a key that lands rocks.
  Add ?lang=he for Hebrew. window.PIECE.scrub(p) hands over p × 3 keys, the last one caught mid-air.
-->
<style>
  /* stage: only for looking at this file by itself. compose.mjs leaves this block out. */
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #ebe4f3; color: #2b2630; overflow-x: hidden; padding-inline: 16px; box-sizing: border-box; container-type: inline-size;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Heebo, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
<style data-for="keys">
  /* Everything is sized in em and the em follows the container. Theme it from the page: --ink, --accent, --cap-1 to --cap-3, --display. */
  .keys { --ink: #2b2630; color: var(--ink); font-size: clamp(11.6px, (100cqi - 8px) / 30.5, 19px); inline-size: 30em; padding: 1em 0; }
  .keys p { margin: 0; }
  .keys .who { display: block; margin: 0 0 .5em; font: 500 max(12px, .72em)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  .keys .ask q, .keys .says .line { font: var(--display-weight, 500) 1.5em/1.22 var(--display, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Heebo, Arial, sans-serif); letter-spacing: -.01em; }
  .keys .ask q { quotes: none; }

  .keys .rack { position: relative; block-size: 12.6em; margin: 1.6em 0 1.2em; }
  .keys .rail { position: absolute; inset-block-start: 1.9em; inline-size: 12em; block-size: .22em; border-radius: .2em; background: var(--ink); opacity: .85; }
  .keys .rail.yours { inset-inline-start: 0; } .keys .rail.theirs { inset-inline-end: 0; }
  .keys .rail span { position: absolute; inset-block-end: .7em; inset-inline-start: 0; font-size: max(12px, .78em); white-space: nowrap; opacity: .65; }
  .keys .rail i { position: absolute; inset-block-start: 0; inline-size: .22em; block-size: .7em; border-radius: 0 0 .2em .2em; background: var(--ink); }

  /* A key hangs from the hole in its head and turns about it. */
  .keys .key { position: absolute; inset-block-start: 1.6em; inline-size: 4em; block-size: 10.4em; margin-inline-start: -2em; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
    transform-origin: 50% .94em; will-change: transform; -webkit-tap-highlight-color: transparent; }
  .keys .key svg { display: block; inline-size: 3.26em; block-size: 7.75em; margin: 0 auto; overflow: visible; filter: drop-shadow(0 .16em .22em rgb(50 35 20 / .32)); }
  .keys .key .name { display: block; margin-top: .5em; font-size: max(11px, .86em); font-weight: 600; text-align: center; white-space: nowrap; }
  .keys .key:focus-visible { outline: none; }
  .keys .key:focus-visible .name { outline: 2px solid var(--accent, #b93372); outline-offset: .25em; border-radius: .2em; }

  .keys .says { min-block-size: 5.6em; }
  .keys .says .lines { display: grid; }
  .keys .says .line { grid-area: 1 / 1; opacity: 0; }
  .keys .says mark { background: linear-gradient(transparent 58%, var(--mark, #f4b8ca) 58% 94%, transparent 94%); color: inherit; padding: 0 .12em; }
</style>
</head>
<body>
<!-- piece:start -->
<section class="keys" data-piece="keys">
  <p class="ask"><span class="who"></span><q></q></p>
  <div class="rack">
    <div class="rail yours"><span></span><i style="inset-inline-start:1.9em"></i><i style="inset-inline-start:5.9em"></i><i style="inset-inline-start:9.9em"></i></div>
    <div class="rail theirs"><span></span><i style="inset-inline-start:1.9em"></i><i style="inset-inline-start:5.9em"></i><i style="inset-inline-start:9.9em"></i></div>
  </div>
  <p class="says"><span class="who"></span><span class="lines" aria-live="polite"><span class="line"></span><span class="line"></span></span></p>
</section>
<!-- piece:end -->

<script>
/* kit:start — helpers a self-contained piece inlines. No dependencies. Source: component-director/scripts/kit.js */
const K = (() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  // Remap x from a..b to c..d, clamped. map(p, .2, .6) is "the part of p between 20% and 60%, as 0..1".
  const map = (x, a, b, c = 0, d = 1) => c + (d - c) * clamp((x - a) / (b - a || 1e-9));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const gauss = (d, sigma) => Math.exp(-(d * d) / (2 * sigma * sigma));
  // Seeded random: the same piece looks the same on every load and in every screenshot.
  const rand = (seed = 1) => () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);

  // A damped spring stepped at a fixed 1/120 s, so it feels the same at 60, 120 or 30 fps.
  // z is the damping ratio: 1 arrives without overshoot, 0.7 overshoots a hair, below 0.4 rings.
  function spring(x = 0, { k = 180, z = 1, eps = 5e-4 } = {}) {
    const s = {
      x, v: 0, to: x, k, z,
      step(dt) {
        const c = 2 * s.z * Math.sqrt(s.k);
        for (let t = Math.min(dt, 0.1); t > 1e-6; t -= 1 / 120) {
          const h = Math.min(t, 1 / 120);
          s.v += (-s.k * (s.x - s.to) - c * s.v) * h;
          s.x += s.v * h;
        }
        if (Math.abs(s.x - s.to) < eps && Math.abs(s.v) < eps * 20) { s.x = s.to; s.v = 0; return false; }
        return true;
      },
      snap(v = s.to) { s.x = s.to = v; s.v = 0; },
    };
    return s;
  }

  // One requestAnimationFrame loop per piece. tick(dt, t) returns false when nothing is moving and the
  // loop goes to sleep; call wake() from any input. It also sleeps while the piece is off screen or the
  // tab is hidden, and picks up where it left off.
  function loop(root, tick) {
    let raf = 0, last = 0, want = false, seen = true;
    const frame = (now) => {
      raf = 0;
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
      last = now;
      want = tick(dt, now / 1000) !== false;
      if (want && seen && !document.hidden) raf = requestAnimationFrame(frame); else last = 0;
    };
    const wake = () => { want = true; if (!raf && seen && !document.hidden) raf = requestAnimationFrame(frame); };
    const io = new IntersectionObserver(([e]) => { seen = e.isIntersecting; if (seen && want) wake(); }, { rootMargin: '64px' });
    io.observe(root);
    const vis = () => { if (!document.hidden && want) wake(); };
    document.addEventListener('visibilitychange', vis);
    return { wake, stop() { cancelAnimationFrame(raf); raf = 0; want = false; io.disconnect(); document.removeEventListener('visibilitychange', vis); } };
  }

  // Mouse, touch and pen through one path, with pointer capture and a release velocity in px/s measured
  // over the last 90 ms. Coordinates are local to el. Set touch-action in CSS on el (pan-y for a
  // horizontal drag) or the browser will scroll instead. Returns an unsubscribe function.
  function drag(el, on) {
    let id = null, hist = [], x0 = 0, y0 = 0;
    const pt = (e) => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height }; };
    const down = (e) => {
      if (id !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
      id = e.pointerId; el.setPointerCapture(id);
      const p = pt(e); x0 = p.x; y0 = p.y; hist = [{ ...p, t: e.timeStamp }];
      on.start?.({ ...p, e });
    };
    const move = (e) => {
      if (e.pointerId !== id) return;
      const p = pt(e); hist.push({ ...p, t: e.timeStamp });
      while (hist.length > 2 && e.timeStamp - hist[0].t > 90) hist.shift();
      on.move?.({ ...p, dx: p.x - x0, dy: p.y - y0, e });
    };
    const up = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      const p = pt(e), a = hist[0], b = hist[hist.length - 1], dt = (b.t - a.t) / 1000;
      const stale = e.timeStamp - b.t > 60;                  // held still before letting go: no throw
      const vx = dt > 0.005 && !stale ? (b.x - a.x) / dt : 0, vy = dt > 0.005 && !stale ? (b.y - a.y) / dt : 0;
      on.end?.({ ...p, dx: p.x - x0, dy: p.y - y0, vx, vy, e });
    };
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    return () => { el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
  }

  // Keep a canvas sharp: size its backing store to its CSS box times the device pixel ratio (capped at 2).
  function fit(canvas, onSize) {
    const ro = new ResizeObserver(() => {
      const r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(r.width * d)); canvas.height = Math.max(1, Math.round(r.height * d));
      onSize?.(r.width, r.height, d);
    });
    ro.observe(canvas);
    return () => ro.disconnect();
  }

  // Read a colour from a custom property as [r, g, b], so the page a piece sits in can theme it:
  // .host .piece { --hot: #b93372 }. Any CSS colour works; fallback is used when the property is not set.
  function rgb(el, name, fallback) {
    const t = document.createElement('i');
    t.style.color = fallback;
    t.style.color = getComputedStyle(el).getPropertyValue(name).trim() || fallback;
    el.append(t);
    const out = getComputedStyle(t).color.match(/[\d.]+/g).slice(0, 3).map(Number);
    t.remove();
    return out;
  }
  const hex = (c) => '#' + c.map((x) => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => a.map((x, i) => lerp(x, b[i], t));

  const rm = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => rm.matches;

  // Split text so each letter (or each word) can move alone, without breaking right-to-left text, line
  // wrapping or screen readers. A word and its punctuation stay on one line; every word keeps its own
  // direction, so a Latin word or "16:30" inside a Hebrew sentence is not reversed. The readable text
  // stays in the page for assistive tech. Never split Arabic or other joined scripts by letter: pass 'word'.
  function split(el, by = 'grapheme') {
    const text = el.textContent, lang = el.closest('[lang]')?.lang || undefined, S = 'Segmenter' in Intl;
    const letters = (s) => (S ? [...new Intl.Segmenter(lang, { granularity: 'grapheme' }).segment(s)].map((x) => x.segment) : [...s]);
    const words = (s) => (S ? [...new Intl.Segmenter(lang, { granularity: 'word' }).segment(s)].map((x) => ({ s: x.segment, word: !!x.isWordLike })) : [{ s, word: true }]);
    const rtl = /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/;
    const mk = (css, txt) => { const n = document.createElement('span'); if (css) n.style.cssText = css; if (txt) n.textContent = txt; return n; };
    const sr = mk('position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap', text);
    const box = mk();
    box.setAttribute('aria-hidden', 'true');
    const out = [];
    for (const chunk of text.split(/(\s+)/)) {
      if (!chunk) continue;
      if (/^\s+$/.test(chunk)) { box.append(document.createTextNode(chunk)); continue; }
      if (by === 'word') { const w = mk('display:inline-block;white-space:nowrap', chunk); out.push(w); box.append(w); continue; }
      // group: no line break inside. core: first word to last word, in its own direction. Punctuation before
      // and after the core follows the sentence, so the full stop after a Latin word lands on the correct side.
      const group = mk('white-space:nowrap'), parts = words(chunk);
      const first = parts.findIndex((x) => x.word), last = parts.length - 1 - [...parts].reverse().findIndex((x) => x.word);
      let core = null;
      parts.forEach(({ s, word }, k) => {
        const inCore = first >= 0 && k >= first && k <= last;
        if (inCore && !core) { core = mk(); core.dir = rtl.test(parts.slice(first, last + 1).map((x) => x.s).join('')) ? 'rtl' : 'ltr'; group.append(core); }
        let into = inCore ? core : group;
        if (word) { const w = mk('display:inline-block;white-space:nowrap'); w.dir = rtl.test(s) ? 'rtl' : 'ltr'; into.append(w); into = w; }
        for (const g of letters(s)) { const n = mk('display:inline-block', g); into.append(n); out.push(n); }
      });
      box.append(group);
    }
    el.textContent = '';
    el.append(sr, box);
    return out;
  }

  return { clamp, lerp, map, smooth, gauss, rand, rgb, hex, mix, spring, loop, drag, fit, reduced, onReduced: (f) => rm.addEventListener('change', f), split };
})();
/* kit:end */
</script>
<script>
/* stage: ?lang=he shows this demo in Hebrew, right to left. compose.mjs leaves this block out. */
if (new URLSearchParams(location.search).get('lang') === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; }
</script>
<script data-for="keys">
(() => {
  // Answers are indexed by which keys the agent holds: calendar = 1, mail = 2, contacts = 4.
  const COPY = {
    en: { you: 'You', agent: 'The agent', ask: 'Book me a meeting with Dana on Thursday.', yours: 'With you', theirs: 'With the agent', keys: ['Calendar', 'Mail', 'Contacts'],
      give: (k) => `${k}: give the agent this key`, take: (k) => `${k}: take this key back`,
      says: ['I can write you a lovely invitation. Booking it is beyond me.', 'Thursday at 10:00 is free. But who is Dana?', 'I can send an email. I am missing to whom, and when you are free.',
        'Thursday at 10:00 is free and I can send mail. I am missing Dana\'s address.', 'Found Dana Levi. I cannot see the calendar.', 'Booked in the calendar: Dana Levi, Thursday 10:00. No invite went out, I have no mail.',
        'I emailed Dana to ask what suits her. I cannot see the calendar.', '<mark>Done.</mark> Thursday 10:00, Dana has the invite, and it is in the calendar.'] },
    he: { you: 'אתם', agent: 'הסוכן', ask: 'תקבע לי פגישה עם דנה ביום חמישי.', yours: 'אצלכם', theirs: 'אצל הסוכן', keys: ['יומן', 'מייל', 'אנשי קשר'],
      give: (k) => `${k}: לתת לסוכן את המפתח`, take: (k) => `${k}: לקחת את המפתח בחזרה`,
      says: ['אפשר לנסח הזמנה יפה. לקבוע אותה, אני לא יכול.', 'יש פנוי בחמישי ב-10:00. אבל מי זאת דנה?', 'מייל אפשר לשלוח. חסר לי למי, ומתי פנוי ביומן.',
        'יש פנוי בחמישי ב-10:00, ומייל אפשר לשלוח. חסרה לי הכתובת של דנה.', 'מצאתי את דנה לוי. את היומן אני לא רואה.', 'קבעתי ביומן: דנה לוי, חמישי 10:00. זימון לא נשלח, אין לי מייל.',
        'שלחתי לדנה מייל לשאול מתי נוח לה. את היומן אני לא רואה.', '<mark>קבעתי.</mark> חמישי 10:00, דנה קיבלה זימון, וזה כבר ביומן.'] },
  };
  const lang = document.documentElement.lang.startsWith('he') ? 'he' : 'en';
  const T = COPY[lang];

  const root = document.querySelector('[data-piece="keys"]');
  const rack = root.querySelector('.rack'), lines = [...root.querySelectorAll('.line')];
  root.querySelector('.ask .who').textContent = T.you; root.querySelector('.ask q').textContent = T.ask; root.querySelector('.says .who').textContent = T.agent;
  root.querySelector('.rail.yours span').textContent = T.yours; root.querySelector('.rail.theirs span').textContent = T.theirs;
  const side = getComputedStyle(root).direction === 'rtl' ? -1 : 1;     // the agent's rail is toward the end of the line

  // Three keys with different bits, each with a coloured cap. Drawn once, hanging down from the hole in the head.
  const BITS = ['M17 44h7v3h-4v3h5v3h-8z', 'M17 42h5v4h3v3h-5v4h-3z', 'M17 43h8v3h-5v2h3v3h-3v2h-3z'];
  const CAPS = ['#f4b8ca', '#bfe6fb', '#d9c9f1'];
  const keySvg = (i) => `<svg viewBox="0 0 34 62" aria-hidden="true">
    <defs><linearGradient id="keys-brass-${i}" x1="0" x2="1"><stop offset="0" stop-color="#f6dc92"/><stop offset=".45" stop-color="#d2a84e"/><stop offset="1" stop-color="#94702a"/></linearGradient></defs>
    <rect x="13.4" y="18" width="5.2" height="38" rx="2" fill="url(#keys-brass-${i})"/><path d="${BITS[i]}" fill="url(#keys-brass-${i})"/>
    <circle cx="16" cy="11" r="10.5" fill="var(--cap-${i + 1}, ${CAPS[i]})"/><circle cx="16" cy="11" r="10.5" fill="none" stroke="#0002"/>
    <circle cx="16" cy="7.5" r="3.1" fill="var(--hole, #0003)"/><path d="M9 8a8 8 0 0 1 5-5" fill="none" stroke="#fff9" stroke-width="1.6" stroke-linecap="round"/></svg>`;

  const HOME = [2, 6, 10], AWAY = [20, 24, 28];             // em from the start edge: hook positions on the two rails
  const keys = T.keys.map((name, i) => {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'key'; el.setAttribute('role', 'switch'); el.setAttribute('aria-checked', 'false');
    el.innerHTML = keySvg(i) + '<span class="name"></span>';
    el.querySelector('.name').textContent = name;
    rack.append(el);
    return { el, i, name, given: false, travel: K.spring(0, { k: 70 + i * 9, z: 0.92 }), swing: K.spring(0, { k: 46, z: 0.3 }), was: 0 };
  });
  const show = lines.map(() => K.spring(0, { k: 150, z: 1 }));
  let shown = 0, mask = -1;

  function render() {
    for (const k of keys) {
      const t = K.clamp(k.travel.x), x = K.lerp(HOME[k.i], AWAY[k.i], K.smooth(t)), hop = Math.sin(Math.PI * t) * 2.1;
      k.el.style.insetInlineStart = x.toFixed(3) + 'em';
      k.el.style.transform = `translateY(${(-hop).toFixed(3)}em) rotate(${(side * K.clamp(k.swing.x, -40, 40)).toFixed(2)}deg)`;
      k.el.style.zIndex = t > 0.02 && t < 0.98 ? 5 : 1;
    }
    lines.forEach((el, i) => { const w = K.clamp(show[i].x); el.style.opacity = w.toFixed(3); el.style.filter = w < 0.995 && w > 0.005 ? `blur(${((1 - w) * 5).toFixed(2)}px)` : 'none'; el.style.visibility = w < 0.005 ? 'hidden' : 'visible'; });
  }
  const loop = K.loop(root, (dt) => {
    let moving = false;
    for (const k of keys) {
      moving = k.travel.step(dt) || moving;
      k.swing.v += (k.travel.v - k.was) * 25;                         // the travel's acceleration leaves the hanging end behind
      k.was = k.travel.v;
      moving = k.swing.step(dt) || moving;
    }
    for (const s of show) moving = s.step(dt) || moving;
    render();
    return moving;
  });

  function say(next, still) {
    if (next === mask) return;
    mask = next;
    shown = 1 - shown;
    lines[shown].innerHTML = T.says[mask];
    show[shown].to = 1; show[1 - shown].to = 0;
    if (still) show.forEach((s) => s.snap());
  }
  function update({ instant = false } = {}) {
    const still = instant || K.reduced();
    for (const k of keys) {
      k.travel.to = k.given ? 1 : 0;
      if (still) { k.travel.snap(); k.swing.snap(0); k.was = 0; }
      k.el.setAttribute('aria-checked', String(k.given));
      k.el.setAttribute('aria-label', (k.given ? T.take : T.give)(k.name));
    }
    say(keys.reduce((m, k) => m | (k.given ? 1 << k.i : 0), 0), still);
    if (still) render(); else loop.wake();
  }
  keys.forEach((k) => {
    k.el.addEventListener('click', () => { k.given = !k.given; update(); });
    k.el.addEventListener('pointerenter', (e) => { if (e.pointerType !== 'mouse' || K.reduced()) return; k.swing.v += 42; loop.wake(); });   // a nudge: it hangs, so it can swing
  });
  K.onReduced(() => update());

  (window.PIECES ||= {}).keys = window.PIECE = {
    name: 'keys',
    get value() { return keys.filter((k) => k.given).length / 3; },
    set: (p) => { const n = Math.round(K.clamp(p) * 3); keys.forEach((k) => { k.given = k.i < n; }); update(); },
    // scrub hands over p × 3 keys. A fraction leaves one key part of the way across, so every p is its own picture.
    scrub: (p) => {
      const q = K.clamp(p) * 3;
      keys.forEach((k) => { const t = K.clamp(q - k.i); k.given = t >= 0.5; k.travel.snap(t); k.swing.snap(0); k.was = 0; });
      say(keys.reduce((m, k) => m | (k.given ? 1 << k.i : 0), 0), true);
      keys.forEach((k) => k.el.setAttribute('aria-checked', String(k.given)));
      render();
    },
  };
  update({ instant: true });
})();
</script>
</body>
</html>
