<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spike · finished jobs on a desk spike</title>
<!--
  Spike. What the agent finished overnight, as paper slips on a desk spike seen from above. Reach for the
  pile and it fans open around the pin so every slip shows its top line; pick one and it lifts off the pin
  and lies flat to be read while the rest fold back.

  job: list · material: paper and brass · gesture: hover, click, arrow keys, Escape · family: ring (one pivot)
  The trick: every slip turns about the same point, the pin. One angle per slip gives both where it sits
  and how it leans; there is no per-slip positioning. Add ?lang=he for Hebrew. PIECE.scrub(p) sets the fan.
-->
<style>
  /* stage: only for looking at this file by itself. compose.mjs leaves this block out. */
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 40%, #ece6da, #dfd7c8); color: #2b2622; overflow-x: hidden; container-type: inline-size;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Heebo, Arial, sans-serif; -webkit-font-smoothing: antialiased; }

</style>
<style data-for="spike">
  /* Everything inside is sized in em, and the em follows the container, so the piece keeps its proportions.
     Theme it from the page: --ink (text), --focus (focus ring), --tint-1 to --tint-5 (paper). */
  .spike { --ink: #2b2622; color: var(--ink); font-size: clamp(12.5px, (100cqi - 32px) / 28.6, 19px); inline-size: 28em; padding: 1em 0; }
  .spike .eyebrow { margin: 0 0 .6em; font: 500 max(12px, .75em)/1 ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .55; }
  .spike .desk { position: relative; block-size: 27em; }
  .spike ul { list-style: none; margin: 0; padding: 0; }

  /* A slip. Its hole sits on the pin, and it turns about that point. */
  .spike .slip { --l: 0; position: absolute; inset-inline-start: 1.3em; inset-block-start: 10.5em; inline-size: 21.5em; block-size: 6em; padding: 0; border: 0; background: none;
    font: inherit; color: inherit; text-align: start; cursor: pointer; transform-origin: 1.9em 50%; will-change: transform; -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 calc(.12em + var(--l) * .9em) calc(.28em + var(--l) * 1.1em) rgb(60 42 28 / calc(.26 + var(--l) * .1))); }
  [dir="rtl"] .spike .slip { transform-origin: calc(100% - 1.9em) 50%; }
  .spike .paper { position: absolute; inset: 0; border-radius: .28em; background: var(--tint, #fbf8f1);
    -webkit-mask: radial-gradient(circle .34em at 1.9em 50%, #0000 96%, #000); mask: radial-gradient(circle .34em at 1.9em 50%, #0000 96%, #000); }
  [dir="rtl"] .spike .paper { -webkit-mask: radial-gradient(circle .34em at calc(100% - 1.9em) 50%, #0000 96%, #000); mask: radial-gradient(circle .34em at calc(100% - 1.9em) 50%, #0000 96%, #000); }
  .spike .slip:focus-visible { outline: none; }
  .spike .slip:focus-visible .paper { box-shadow: inset 0 0 0 .14em var(--focus, #b93372); }
  .spike .title, .spike .detail, .spike time { position: absolute; font-size: .9em; }
  .spike .title { inset-inline-start: 8.8em; inset-block-start: .5em; font-weight: 650; letter-spacing: -.005em; white-space: nowrap; }
  .spike time { inset-inline-end: .9em; inset-block-start: .56em; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; opacity: .55; }
  .spike .detail { inset-inline: 8.8em .9em; inset-block-start: 2.25em; line-height: 1.32; opacity: calc(var(--d, 1) * .72); }
  .spike .rule { position: absolute; inset-inline: 3.6em .9em; inset-block-end: .7em; block-size: 1px; background: currentColor; opacity: .09; }
  .spike .pin { position: absolute; inset-inline-start: 2.5em; inset-block-start: 12.8em; inline-size: 1.4em; block-size: 1.4em; border-radius: 50%; z-index: 20; pointer-events: none;
    background: radial-gradient(circle at 36% 30%, #fff6d8 0 10%, #d9b25c 34%, #8a6a2a 78%, #5f4718); box-shadow: .18em .3em .5em -.1em #3b2a1a99, 0 0 0 .05em #5f471880; }
  .spike .hint { margin: .2em 0 0; font-size: max(13px, .88em); opacity: .6; }
</style>
</head>
<body>
<!-- piece:start -->
<section class="spike" data-piece="spike">
  <p class="eyebrow"></p>
  <div class="desk" data-grab>
    <ul></ul>
    <span class="pin" aria-hidden="true"></span>
  </div>
  <p class="hint"></p>
</section>
<!-- piece:end -->

<script>
/* kit:start — helpers a self-contained piece inlines. No dependencies. Source: component-director/scripts/kit.js */
const K = (() => {
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  // Remap x from a..b to c..d, clamped. map(p, .2, .6) is "the part of p between 20% and 60%, as 0..1".
  const map = (x, a, b, c = 0, d = 1) => c + (d - c) * clamp((x - a) / (b - a || 1e-9));
  const smooth = (t) => { t = clamp(t); return t * t * (3 - 2 * t); };
  const gauss = (d, sigma) => Math.exp(-(d * d) / (2 * sigma * sigma));
  // Seeded random: the same piece looks the same on every load and in every screenshot.
  const rand = (seed = 1) => () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);

  // A damped spring stepped at a fixed 1/120 s, so it feels the same at 60, 120 or 30 fps.
  // z is the damping ratio: 1 arrives without overshoot, 0.7 overshoots a hair, below 0.4 rings.
  function spring(x = 0, { k = 180, z = 1, eps = 5e-4 } = {}) {
    const s = {
      x, v: 0, to: x, k, z,
      step(dt) {
        const c = 2 * s.z * Math.sqrt(s.k);
        for (let t = Math.min(dt, 0.1); t > 1e-6; t -= 1 / 120) {
          const h = Math.min(t, 1 / 120);
          s.v += (-s.k * (s.x - s.to) - c * s.v) * h;
          s.x += s.v * h;
        }
        if (Math.abs(s.x - s.to) < eps && Math.abs(s.v) < eps * 20) { s.x = s.to; s.v = 0; return false; }
        return true;
      },
      snap(v = s.to) { s.x = s.to = v; s.v = 0; },
    };
    return s;
  }

  // One requestAnimationFrame loop per piece. tick(dt, t) returns false when nothing is moving and the
  // loop goes to sleep; call wake() from any input. It also sleeps while the piece is off screen or the
  // tab is hidden, and picks up where it left off.
  function loop(root, tick) {
    let raf = 0, last = 0, want = false, seen = true;
    const frame = (now) => {
      raf = 0;
      const dt = last ? Math.min((now - last) / 1000, 0.05) : 1 / 60;
      last = now;
      want = tick(dt, now / 1000) !== false;
      if (want && seen && !document.hidden) raf = requestAnimationFrame(frame); else last = 0;
    };
    const wake = () => { want = true; if (!raf && seen && !document.hidden) raf = requestAnimationFrame(frame); };
    const io = new IntersectionObserver(([e]) => { seen = e.isIntersecting; if (seen && want) wake(); }, { rootMargin: '64px' });
    io.observe(root);
    const vis = () => { if (!document.hidden && want) wake(); };
    document.addEventListener('visibilitychange', vis);
    return { wake, stop() { cancelAnimationFrame(raf); raf = 0; want = false; io.disconnect(); document.removeEventListener('visibilitychange', vis); } };
  }

  // Mouse, touch and pen through one path, with pointer capture and a release velocity in px/s measured
  // over the last 90 ms. Coordinates are local to el. Set touch-action in CSS on el (pan-y for a
  // horizontal drag) or the browser will scroll instead. Returns an unsubscribe function.
  function drag(el, on) {
    let id = null, hist = [], x0 = 0, y0 = 0;
    const pt = (e) => { const r = el.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, w: r.width, h: r.height }; };
    const down = (e) => {
      if (id !== null || (e.pointerType === 'mouse' && e.button !== 0)) return;
      id = e.pointerId; el.setPointerCapture(id);
      const p = pt(e); x0 = p.x; y0 = p.y; hist = [{ ...p, t: e.timeStamp }];
      on.start?.({ ...p, e });
    };
    const move = (e) => {
      if (e.pointerId !== id) return;
      const p = pt(e); hist.push({ ...p, t: e.timeStamp });
      while (hist.length > 2 && e.timeStamp - hist[0].t > 90) hist.shift();
      on.move?.({ ...p, dx: p.x - x0, dy: p.y - y0, e });
    };
    const up = (e) => {
      if (e.pointerId !== id) return;
      id = null;
      const p = pt(e), a = hist[0], b = hist[hist.length - 1], dt = (b.t - a.t) / 1000;
      const stale = e.timeStamp - b.t > 60;                  // held still before letting go: no throw
      const vx = dt > 0.005 && !stale ? (b.x - a.x) / dt : 0, vy = dt > 0.005 && !stale ? (b.y - a.y) / dt : 0;
      on.end?.({ ...p, dx: p.x - x0, dy: p.y - y0, vx, vy, e });
    };
    el.addEventListener('pointerdown', down); el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    return () => { el.removeEventListener('pointerdown', down); el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); };
  }

  // Keep a canvas sharp: size its backing store to its CSS box times the device pixel ratio (capped at 2).
  function fit(canvas, onSize) {
    const ro = new ResizeObserver(() => {
      const r = canvas.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(r.width * d)); canvas.height = Math.max(1, Math.round(r.height * d));
      onSize?.(r.width, r.height, d);
    });
    ro.observe(canvas);
    return () => ro.disconnect();
  }

  // Read a colour from a custom property as [r, g, b], so the page a piece sits in can theme it:
  // .host .piece { --hot: #b93372 }. Any CSS colour works; fallback is used when the property is not set.
  function rgb(el, name, fallback) {
    const t = document.createElement('i');
    t.style.color = fallback;
    t.style.color = getComputedStyle(el).getPropertyValue(name).trim() || fallback;
    el.append(t);
    const out = getComputedStyle(t).color.match(/[\d.]+/g).slice(0, 3).map(Number);
    t.remove();
    return out;
  }
  const hex = (c) => '#' + c.map((x) => Math.round(clamp(x, 0, 255)).toString(16).padStart(2, '0')).join('');
  const mix = (a, b, t) => a.map((x, i) => lerp(x, b[i], t));

  const rm = window.matchMedia('(prefers-reduced-motion: reduce)');
  const reduced = () => rm.matches;

  // Split text so each letter (or each word) can move alone, without breaking right-to-left text, line
  // wrapping or screen readers. A word and its punctuation stay on one line; every word keeps its own
  // direction, so a Latin word or "16:30" inside a Hebrew sentence is not reversed. The readable text
  // stays in the page for assistive tech. Never split Arabic or other joined scripts by letter: pass 'word'.
  function split(el, by = 'grapheme') {
    const text = el.textContent, lang = el.closest('[lang]')?.lang || undefined, S = 'Segmenter' in Intl;
    const letters = (s) => (S ? [...new Intl.Segmenter(lang, { granularity: 'grapheme' }).segment(s)].map((x) => x.segment) : [...s]);
    const words = (s) => (S ? [...new Intl.Segmenter(lang, { granularity: 'word' }).segment(s)].map((x) => ({ s: x.segment, word: !!x.isWordLike })) : [{ s, word: true }]);
    const rtl = /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFF]/;
    const mk = (css, txt) => { const n = document.createElement('span'); if (css) n.style.cssText = css; if (txt) n.textContent = txt; return n; };
    const sr = mk('position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap', text);
    const box = mk();
    box.setAttribute('aria-hidden', 'true');
    const out = [];
    for (const chunk of text.split(/(\s+)/)) {
      if (!chunk) continue;
      if (/^\s+$/.test(chunk)) { box.append(document.createTextNode(chunk)); continue; }
      if (by === 'word') { const w = mk('display:inline-block;white-space:nowrap', chunk); out.push(w); box.append(w); continue; }
      // group: no line break inside. core: first word to last word, in its own direction. Punctuation before
      // and after the core follows the sentence, so the full stop after a Latin word lands on the correct side.
      const group = mk('white-space:nowrap'), parts = words(chunk);
      const first = parts.findIndex((x) => x.word), last = parts.length - 1 - [...parts].reverse().findIndex((x) => x.word);
      let core = null;
      parts.forEach(({ s, word }, k) => {
        const inCore = first >= 0 && k >= first && k <= last;
        if (inCore && !core) { core = mk(); core.dir = rtl.test(parts.slice(first, last + 1).map((x) => x.s).join('')) ? 'rtl' : 'ltr'; group.append(core); }
        let into = inCore ? core : group;
        if (word) { const w = mk('display:inline-block;white-space:nowrap'); w.dir = rtl.test(s) ? 'rtl' : 'ltr'; into.append(w); into = w; }
        for (const g of letters(s)) { const n = mk('display:inline-block', g); into.append(n); out.push(n); }
      });
      box.append(group);
    }
    el.textContent = '';
    el.append(sr, box);
    return out;
  }

  return { clamp, lerp, map, smooth, gauss, rand, rgb, hex, mix, spring, loop, drag, fit, reduced, onReduced: (f) => rm.addEventListener('change', f), split };
})();
/* kit:end */
</script>
<script>
/* stage: ?lang=he shows this demo in Hebrew, right to left. compose.mjs leaves this block out. */
if (new URLSearchParams(location.search).get('lang') === 'he') { document.documentElement.lang = 'he'; document.documentElement.dir = 'rtl'; }
</script>
<script data-for="spike">
(() => {
  const COPY = {
    en: { eyebrow: 'While you slept', hint: 'Five jobs done. Open the pile, pick a slip.',
      slips: [['07:58', 'Answered three leads', 'In your voice. Waiting for your yes.'], ['08:02', 'Drafted three posts', 'On what is trending in your field today.'],
        ['08:05', 'Booked Dana, Thursday', 'At 10:00. The invite has gone out.'], ['08:11', 'Filed two invoices', 'Matched to payments. One is late.'],
        ['08:20', 'Newsletter is ready', 'Draft four, the short one. Send at 10?']] },
    he: { eyebrow: 'בזמן שישנתם', hint: 'חמש משימות בוצעו. פתחו את הערימה ובחרו פתק.',
      slips: [['07:58', 'נענו שלושה לידים', 'בקול שלכם. מחכה לאישור.'], ['08:02', 'שלוש טיוטות לפוסטים', 'לפי מה שחם היום בתחום.'],
        ['08:05', 'נקבעה פגישה עם דנה', 'חמישי, 10:00. הזימון נשלח.'], ['08:11', 'תויקו שתי חשבוניות', 'הותאמו לתשלומים. אחת באיחור.'],
        ['08:20', 'הניוזלטר מוכן', 'טיוטה רביעית, הקצרה. לשלוח ב-10?']] },
  };
  const lang = document.documentElement.lang.startsWith('he') ? 'he' : 'en';
  const T = COPY[lang];

  const root = document.querySelector('[data-piece="spike"]');
  const desk = root.querySelector('.desk'), list = root.querySelector('ul');
  root.querySelector('.eyebrow').textContent = T.eyebrow;
  root.querySelector('.hint').textContent = T.hint;
  const side = getComputedStyle(root).direction === 'rtl' ? -1 : 1;     // slips reach away from the pin, whichever way the page reads

  const TINTS = ['#fbf8f1', '#eef6fb', '#fbeef2', '#f3eefa', '#fdf9ee'], SPREAD = 34, rnd = K.rand(23);
  const slips = T.slips.map(([time, title, detail], i) => {
    const li = document.createElement('li'), el = document.createElement('button');
    el.type = 'button'; el.className = 'slip'; el.setAttribute('aria-expanded', 'false');
    el.innerHTML = '<span class="paper"></span><span class="title"></span><time></time><span class="detail"></span><span class="rule"></span>';
    el.querySelector('.paper').style.setProperty('--tint', `var(--tint-${(i % TINTS.length) + 1}, ${TINTS[i % TINTS.length]})`);
    el.querySelector('.title').textContent = title; el.querySelector('time').textContent = time; el.querySelector('.detail').textContent = detail;
    li.append(el); list.append(li);
    const mess = (rnd() * 2 - 1) * 8 + (i - 2) * 1.2;                  // how it lies in the pile
    return { el, i, mess, fanned: K.lerp(-SPREAD, SPREAD, i / (T.slips.length - 1)),
      open: K.spring(0, { k: 105 + i * 24, z: 0.8 }),                 // each slip follows the fan at its own pace
      out: K.spring(0, { k: 240, z: 0.75 }), lift: K.spring(0, { k: 150, z: 0.76 }) };
  });

  let inside = false, focused = false, touched = false, hover = -1, picked = -1;

  // Draw every slip from its three numbers: how far the fan is open, how far it is nudged out, how far lifted.
  function render() {
    for (const s of slips) {
      const angle = K.lerp(K.lerp(s.mess, s.fanned, s.open.x), 0, K.clamp(s.lift.x));
      const along = s.out.x * 0.9 + s.lift.x * 2.3, scale = 1 + s.lift.x * 0.06;
      s.el.style.transform = `rotate(${(side * angle).toFixed(3)}deg) translateX(${(side * along).toFixed(3)}em) scale(${scale.toFixed(4)})`;
      s.el.style.setProperty('--l', K.clamp(s.lift.x).toFixed(3));
      s.el.style.setProperty('--d', (s.i === slips.length - 1 ? 1 : K.clamp(s.lift.x)).toFixed(3));   // only the top slip and a lifted one show their second line
      s.el.style.zIndex = s.lift.x > 0.02 ? 10 : s.i;
    }
  }
  const loop = K.loop(root, (dt) => {
    let moving = false;
    for (const s of slips) { moving = s.open.step(dt) || moving; moving = s.out.step(dt) || moving; moving = s.lift.step(dt) || moving; }
    render();
    return moving;
  });

  function update({ instant = false } = {}) {
    const open = (inside || focused || touched) && picked < 0 ? 1 : 0, still = instant || K.reduced();
    for (const s of slips) {
      s.open.to = open; s.out.to = open && s.i === hover ? 1 : 0; s.lift.to = s.i === picked ? 1 : 0;
      if (still) { s.open.snap(); s.out.snap(); s.lift.snap(); }
      s.el.setAttribute('aria-expanded', String(s.i === picked));
    }
    if (still) render(); else loop.wake();
  }

  slips.forEach((s) => {
    s.el.addEventListener('pointerenter', (e) => { if (e.pointerType === 'touch') return; inside = true; hover = s.i; update(); });
    s.el.addEventListener('pointerleave', () => { if (hover === s.i) { hover = -1; update(); } });
    s.el.addEventListener('click', (e) => {
      const byTouch = e.pointerType === 'touch', wasOpen = s.open.to > 0.5 || picked >= 0;
      if (byTouch && !wasOpen) { touched = true; update(); return; }       // on touch the first tap opens the pile
      picked = picked === s.i ? -1 : s.i;
      if (byTouch) touched = picked < 0;
      update();
    });
    s.el.addEventListener('focus', () => { focused = s.el.matches(':focus-visible'); update(); });
    s.el.addEventListener('keydown', (e) => {
      const step = { ArrowDown: 1, ArrowUp: -1, ArrowRight: side, ArrowLeft: -side }[e.key];
      if (step) { slips[(s.i + step + slips.length) % slips.length].el.focus(); e.preventDefault(); }
      else if (e.key === 'Escape') { picked = -1; update(); }
    });
  });
  desk.addEventListener('pointerleave', () => { inside = false; hover = -1; update(); });
  root.addEventListener('focusout', (e) => { if (!root.contains(e.relatedTarget)) { focused = false; update(); } });
  document.addEventListener('pointerdown', (e) => { if (!desk.contains(e.target) || e.target === desk) { picked = -1; touched = false; update(); } });
  K.onReduced(() => update());

  (window.PIECES ||= {}).spike = window.PIECE = {
    name: 'spike',
    get value() { return slips[0].open.to; },
    set: (p) => { picked = -1; hover = -1; touched = p > 0.5; inside = focused = false; update(); },
    scrub: (p) => { picked = -1; hover = -1; inside = focused = touched = false; for (const s of slips) { s.open.snap(K.clamp(p)); s.out.snap(0); s.lift.snap(0); } render(); },
    pick: (i) => { picked = i; update(); },
  };
  update({ instant: true });
})();
</script>
</body>
</html>
