<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משפט הרעיון</title>

<style>
/* layout: a full-bleed living particle field; the trial transcript runs in one quiet column on the start side */
@font-face{font-family:Bamberger;src:url('assets/bamberger-black.otf') format('opentype');font-display:block;font-weight:900}
@font-face{font-family:HeeboL;src:url('assets/heebo.ttf') format('truetype');font-display:swap}
@font-face{font-family:AntonL;src:url('assets/anton.ttf') format('truetype');font-display:swap}
:root{
  color-scheme:dark;
  --bg:#07060a; --fg:#f3ede4; --dim:rgba(243,237,228,.64); --faint:rgba(243,237,228,.18);
  --glass:rgba(14,12,18,.6); --accent:#ffb86b; --accent2:#ff6fae;
  --display:Bamberger,AntonL,HeeboL,system-ui,sans-serif;
  --text:HeeboL,Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--text);font-size:16px;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#gl{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#top{position:fixed;inset:0 0 auto 0;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));pointer-events:none}
#mark{font-family:var(--display);font-size:20px;display:flex;align-items:baseline;gap:8px}
#mark small{font-family:var(--text);font-size:12.5px;color:var(--dim)}
#tools{display:flex;gap:8px;pointer-events:auto;direction:ltr}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--faint);background:var(--glass);color:var(--fg);
  display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s}
.ib:hover{border-color:var(--accent)}
.ib svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib[aria-pressed="false"]{color:var(--dim)}

#chat{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:0;bottom:var(--kb,0px);width:min(440px,100%);display:flex;flex-direction:column;gap:12px;z-index:1;
  padding-block:0 calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  background:linear-gradient(to left,rgba(7,6,10,.86) 55%,rgba(7,6,10,0))}
#nums{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
#lp{font-family:var(--display);font-size:clamp(60px,9vw,92px);line-height:.82;color:var(--accent);font-variant-numeric:tabular-nums;
  text-shadow:0 0 40px color-mix(in srgb,var(--accent) 45%,transparent)}
#lpl{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
#lpl b{font-family:var(--display);font-size:20px;font-weight:900}
#lpl span{font-size:13px;color:var(--dim);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;color:var(--fg);background:var(--glass);border:1px solid var(--faint);border-radius:999px;padding:6px 14px;cursor:pointer;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,color .2s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}
#log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;touch-action:pan-y;overscroll-behavior:contain;
  user-select:text;-webkit-user-select:text;padding-block:26px 4px;scrollbar-width:thin;
  -webkit-mask-image:linear-gradient(to bottom,transparent,#000 30px);mask-image:linear-gradient(to bottom,transparent,#000 30px)}
.m{max-width:100%;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}
.m.her{font-size:16.5px}
.m.me{align-self:flex-end;background:var(--glass);border:1px solid var(--faint);border-radius:16px 16px 16px 4px;padding:8px 14px;font-size:15px;color:var(--dim);max-width:85%}
.m.note{font-size:13px;color:var(--dim)}
.m.wait{color:var(--dim)}
@media (prefers-reduced-motion:no-preference){.m{animation:mi .5s both}@keyframes mi{from{opacity:0;transform:translateY(6px)}}
  .m.wait{animation:mi .5s both,br 1.6s ease-in-out infinite}@keyframes br{50%{opacity:.35}}}
#f{display:flex;gap:8px}
#msg{flex:1;min-width:0;height:50px;border-radius:14px;border:1px solid var(--faint);background:var(--glass);color:var(--fg);
  font-family:var(--text);font-size:17px;padding:0 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  user-select:text;-webkit-user-select:text;caret-color:var(--accent)}
#msg::placeholder{color:var(--dim)}
#msg:focus{border-color:var(--accent);outline:none}
#msg:disabled{opacity:.5}
#send{height:50px;border-radius:14px;border:0;padding:0 18px;font-family:var(--text);font-size:15px;cursor:pointer;white-space:nowrap;
  color:#120c08;background:linear-gradient(120deg,var(--accent),var(--accent2))}
#foot{margin:0;font-size:12px;color:var(--dim);line-height:1.5}

#sheet{position:fixed;inset:0;background:rgba(5,4,8,.88);display:grid;place-items:center;z-index:5;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#sheet .box{display:flex;flex-direction:column;gap:12px;align-items:center;max-height:100%}
#poster{max-width:100%;max-height:calc(100vh - 150px);border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);-webkit-touch-callout:default}
#sheet p{margin:0;color:var(--dim);font-size:13px;text-align:center}
#sheet .acts{display:flex;gap:8px}
.tb{font-family:var(--text);font-size:14px;height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--faint);background:var(--glass);color:var(--fg);cursor:pointer}
.tb.pri{border:0;color:#120c08;background:linear-gradient(120deg,var(--accent),var(--accent2))}
#nogl{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--dim);z-index:9}
@media (max-width:700px){
  #chat{top:auto;height:54%;width:100%;gap:10px;padding-right:max(16px,env(safe-area-inset-right,0px));
    background:linear-gradient(to top,rgba(7,6,10,.94) 70%,rgba(7,6,10,0))}
  #mark small{display:none}
  #lp{font-size:54px} #lpl b{font-size:17px}
  #foot{display:none}
}
:root{--pros:#ff8f7d;--def:#7fc6ff;--wit:#c8a6ff;--judge:#ffd07a}
#case{display:flex;flex-direction:column;gap:6px}
#ctitle{margin:0;font-family:var(--display);font-weight:900;font-size:clamp(26px,3.4vw,38px);line-height:1.05;color:var(--accent);text-wrap:balance}
#charge{margin:0;font-size:14px;color:var(--dim);line-height:1.5}
#steps{list-style:none;margin:4px 0 0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
#steps li{font-size:12.5px;padding:3px 11px;border-radius:999px;border:1px solid var(--faint);color:var(--dim)}

.m .who{display:block;font-family:var(--display);font-size:14px;letter-spacing:.02em;margin-bottom:2px}

.m .tx{font-size:16px}
.m.r-you{align-self:flex-end;background:var(--glass);border:1px solid var(--faint);border-radius:16px 16px 16px 4px;padding:8px 14px;max-width:88%}
.m.r-you .who{font-family:var(--text);font-size:12px;color:var(--dim)} .m.r-you .tx{font-size:15px}
.m.dir{font-size:13px;color:var(--dim);text-align:center;letter-spacing:.04em}
.verdict{border:1px solid var(--judge);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;background:rgba(14,12,18,.72)}
.verdict h2{margin:0;font-family:var(--display);font-size:30px;line-height:1;color:var(--judge)}
.verdict p{margin:0;font-size:15.5px;line-height:1.65}
.verdict dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;font-size:14.5px}
.verdict dt{color:var(--dim);white-space:nowrap} .verdict dd{margin:0}
.verdict ol{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.verdict .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){#ctitle{font-size:24px}#charge{font-size:13px}}
</style>
</head>
<body>
<div id="stage"><canvas id="gl" aria-label="שדה חלקיקים חי שמשנה צבע וצורה לפי מי שמדבר באולם"></canvas></div>

</header>

<aside id="chat" aria-label="פרוטוקול המשפט">

</aside>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const cv=$('gl');

const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── language: gematria, scales, lexicon ───────── */
const HV={'א':1,'ב':2,'ג':3,'ד':4,'ה':5,'ו':6,'ז':7,'ח':8,'ט':9,'י':10,'כ':20,'ך':20,'ל':30,'מ':40,'ם':40,'נ':50,'ן':50,'ס':60,'ע':70,'פ':80,'ף':80,'צ':90,'ץ':90,'ק':100,'ר':200,'ש':300,'ת':400};

const letterVal=ch=>HV[ch]|| (/[a-z]/i.test(ch)? ch.toLowerCase().charCodeAt(0)-96 : 0);

const gematria=s=>[...s].reduce((a,c)=>a+letterVal(c),0);
const clean=s=>[...s.replace(/[^א-תA-Za-z0-9. ]/g,'')].slice(0,26).join('').replace(/^\s+/,'').replace(/\s{2,}/g,' ');

const LEX=[...new Set(`אהבה אחד אור חושך שלום אמת חלום לב נשמה רוח אש מים אדמה שמים ים כוכב ירח שמש עולם זמן חיים מוות אדם חוה אם אב בן בת ילד ילדה בית דרך מסע סוד קסם נס פלא יופי חכמה בינה דעת כתר חסד גבורה תפארת נצח הוד יסוד מלכות אמונה תקווה שמחה עצב פחד אומץ כוח חופש דרור צדק משפט רחמים חן טוב רע יין לחם דבש חלב מלח זהב כסף ברזל אבן עץ פרח שושנה ורד גן יער הר נהר גשם ענן רעם ברק שלג סערה שקט דממה קול שיר מילה אות ספר סיפור שפה שם מספר צבע אדום כחול ירוק צהוב לבן שחור סגול ורוד כתום צורה קו נקודה עיגול משולש ריבוע מרחב חלל אין יש אני אתה את הוא היא אנחנו שלי שלך יחד לבד חבר אח אחות משפחה עם ארץ עיר ירושלים ישראל גליל נגב מדבר אילת חיפה ציון מלך מלכה נסיך נביא כהן משיח מלאך שטן נחש אריה זאב צבי יונה נשר דג פרפר דבורה חתול כלב סוס גמל ציפור עין יד רגל פה אוזן ראש גוף דם עור עצם דמעה צחוק בכי חיוך נשיקה חיבוק מגע ריקוד מחול משחק עבודה יצירה אמנות אמן ציור פיסול מוזיקה ניגון תוף כינור חליל מדע טבע קוד מכונה רשת מחשב מסך פיקסל נתון מידע מלאכותית סוכן סדנה רעיון מחשבה שאלה תשובה ספק ודאות סיכוי מזל גורל בחירה רצון תשוקה געגוע זיכרון שכחה עבר הווה עתיד עכשיו רגע שנה חודש שבוע יום לילה בוקר ערב שבת חג פסח סוכות חנוכה פורים תורה מצווה תפילה ברכה קדוש טהור אלוהים שכינה בריאה בראשית תוהו בוהו אבק עפר אפר להבה ניצוץ זוהר נוגה קרן צל מראה חלון דלת מפתח שער גשר קיר גג מגדל סולם מדרגה כיסא שולחן מיטה כוס ענב תאנה רימון זית תמר חיטה שדה כרם זרע שורש ענף עלה פרי קוץ אביב קיץ סתיו חורף מלחמה ניצחון תבוסה גיבור אויב חרב מגן חץ קשת עושר עוני מתנה חוב שוק מחיר ערך אמא אבא סבא סבתא תינוק נער זקן אישה איש גבר כלה חתן חתונה לידה הריון השראה דמיון פליאה תודה סליחה בדידות שייכות ריפוי כאב אושר שלווה תנועה נשימה לחישה צעקה הד גל חוף אי סירה מפרש עוגן מצפן מפה אופק זריחה שקיעה דמדומים טל ערפל קרח אבוקה נר פנס כוכבים שביט גלקסיה מאדים נוגה צדק חלב שביל אינסוף אפס מאה אלף שבע שלוש עשר חי`.split(/\s+/).filter(Boolean))];
const BYVAL=new Map(); for(const w of LEX){const v=gematria(w); (BYVAL.get(v)||BYVAL.set(v,[]).get(v)).push(w);}

/* ───────── seeded randomness ───────── */
function rng32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const gauss=R=>{let u=0,v=0;while(!u)u=R();v=R();return Math.sqrt(-2*Math.log(u))*Math.cos(6.28318*v)};

/* ───────── world generators: a number becomes a form ───────── */
function genWorld(value,N,out){
  const R=rng32(Math.imul(value|0,2654435761)^0x9e3779b9);
  const fam=value%5, P=(i,x,y,z,w)=>{out[i*4]=x;out[i*4+1]=y;out[i*4+2]=z;out[i*4+3]=w};

  const tube=(i,curve,t,rad,strands,turns)=>{
    const e=1e-3,c=curve(t),d=curve(t+e);let tx=d[0]-c[0],ty=d[1]-c[1],tz=d[2]-c[2];const tl=Math.hypot(tx,ty,tz)||1;tx/=tl;ty/=tl;tz/=tl;
    let nx=c[0],ny=c[1],nz=c[2]+.31;const dt=nx*tx+ny*ty+nz*tz;nx-=dt*tx;ny-=dt*ty;nz-=dt*tz;const nl=Math.hypot(nx,ny,nz)||1;nx/=nl;ny/=nl;nz/=nl;
    const bx=ty*nz-tz*ny,by=tz*nx-tx*nz,bz=tx*ny-ty*nx;
    const s=Math.floor(R()*strands), ph=t*turns+s/strands*6.2832, core=R()<.72;

  };

    for(let tries=0;tries<60&&!ok;tries++){
      const r=()=>(R()<.5?-1:1)*(.7+R()*2.1); a=r();b=r();c=r();d=r();e=.7+R()*1.1;
      let x=.1,y=.1,z=.1;const seen=new Set();
      for(let i=0;i<4200;i++){const X=Math.sin(a*y)-z*Math.cos(b*x),Y=z*Math.sin(c*x)-Math.cos(d*y),Z=e*Math.sin(x);x=X;y=Y;z=Z;
        if(i>200)seen.add(((x*5+16)|0)+(((y*5+16)|0)<<6)+(((z*5+16)|0)<<12));}

    }
    if(!ok){a=2.24;b=.43;c=-.65;d=-2.43;e=1;}

    const wt=dir('השופטת כותבת את פסק הדין…','m r-judge wait');ctl=new AbortController();
    let v;try{v=await sample.json(brief()+`\n\nהתפקיד שלך עכשיו: את השופטת. שקלי את כל הפרוטוקול, ובמיוחד את תשובות בעלי הרעיון בחקירה: תשובה מתחמקת או ריקה פועלת לרעתם, תשובה קונקרטית פועלת לטובתם. היי החלטית ומעשית.
החזירי אך ורק אובייקט JSON אחד בעברית, בצורה:
{"verdict":"זכאי" או "זכאי בתנאים" או "אשם","headline":"משפט אחד: ההכרעה","reasoning":"שלושה עד ארבעה משפטים של נימוק","strongest":"הטיעון החזק ביותר בעד הרעיון, משפט אחד","weakest":"החולשה המסוכנת ביותר, משפט אחד","conditions":["פעולה קונקרטית לשבוע הקרוב, עד 18 מילים","...","..."],"dissent":"משפט אחד שהצד המפסיד עדיין היה אומר"}
״אשם״ פירושו שהרעיון במתכונתו הנוכחית לא צריך לצאת לדרך. conditions הן בדיוק שלוש פעולות שמותאמות לרעיון הזה.`,{cache:false,signal:ctl.signal})}finally{wt.remove()}
    if(g!==gen)return;verdict(v);
  }catch(e){if(g!==gen)return;const c=e&&e.code;lock(true);
    if(c==='cancelled')return;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)){sample=null;noJudge();return}
    dir(c==='rate_limited'?'יש עומס כרגע. אפשר לנסות שוב בעוד רגע.':c==='refused'?'בית המשפט לא דן בתיק הזה. אפשר להביא רעיון אחר.':c==='session_expired'?'צריך להתחבר מחדש ל־Claude כדי להמשיך.':'הדיון נקטע באמצע.','m note');
    chips([['לפתוח את המשפט מחדש','r'],['תיק חדש','n']],v=>{if(v==='n'){reset();return}record=[];log.textContent='';trial()})}
}
function verdict(v){
  const vd=['זכאי','זכאי בתנאים','אשם'].includes(v.verdict)?v.verdict:'זכאי בתנאים',conds=(v.conditions||[]).slice(0,3).map(strip);
  setHue(vd==='זכאי'?140:vd==='אשם'?2:44);showWord(vd);gavel();phase(4);
  const el=document.createElement('div');el.className='m verdict';
  const add=(tag,txt,parent)=>{const n=document.createElement(tag);n.textContent=txt;(parent||el).appendChild(n);return n};
  add('span','פסק דין').className='who';el.firstChild.style.color='var(--judge)';
  add('h2',vd);add('p',strip(v.headline||''));add('p',strip(v.reasoning||''));
  const dl=add('dl','');add('dt','הכי חזק',dl);add('dd',strip(v.strongest||''),dl);add('dt','הכי מסוכן',dl);add('dd',strip(v.weakest||''),dl);add('dt','דעת מיעוט',dl);add('dd',strip(v.dissent||''),dl);
  add('p','לעשות השבוע:').style.color='var(--dim)';const ol=add('ol','');conds.forEach(c=>add('li',c,ol));
  verdictText=[`משפט הרעיון: ${C.title}`,`הרעיון: ${C.idea}`,'',`פסק דין: ${vd}`,strip(v.headline||''),'',strip(v.reasoning||''),'',`הכי חזק: ${strip(v.strongest||'')}`,`הכי מסוכן: ${strip(v.weakest||'')}`,`דעת מיעוט: ${strip(v.dissent||'')}`,'','לעשות השבוע:',...conds.map((c,i)=>`${i+1}. ${c}`)].join('\n');
  const acts=add('div','');acts.className='acts';const st=document.createElement('span');st.className='note';st.setAttribute('role','status');
  const cp=add('button','להעתיק',acts);cp.type='button';cp.className='chip';cp.onclick=()=>{try{navigator.clipboard.writeText(verdictText).then(()=>{st.textContent='הועתק.'},()=>{st.textContent='ההעתקה חסומה כאן.'})}catch(e){st.textContent='ההעתקה חסומה כאן.'}};
  if(saver){const dn=add('button','לשמור כקובץ',acts);dn.type='button';dn.className='chip';dn.onclick=async()=>{try{await saver.save({filename:'psak-din.txt',data:verdictText});st.textContent='נשמר.'}catch(e){st.textContent=e&&e.code==='declined'?'השמירה בוטלה.':'השמירה לא זמינה כאן.'}}}
  acts.appendChild(st);log.appendChild(el);log.scrollTop=log.scrollHeight;
  record.push({who:'השופטת',text:verdictText});
  if(voiceOn&&tts){tts.speak(`${vd}. ${strip(v.headline||'')}`.slice(0,1900),{voice:'rounded'}).catch(()=>{})}
  step='appeal';lock(false);ph('ערעור: לשאול את השופטת');chips([['תיק חדש','n']],()=>reset());
}
async function appeal(text){
  const g=gen;line('you',text);judgeTurns.push({role:'user',content:text});lock(true);setHue(44);
  const t=line('judge','…');t.parentNode.classList.add('wait');ctl=new AbortController();
  try{const r=await sample([{role:'user',content:brief()+'\n\nהתפקיד שלך עכשיו: את השופטת, אחרי מתן פסק הדין. בעלי הרעיון מערערים או שואלים. עני בעד 90 מילים, ישירה ומעשית. אם הובאה ראיה חדשה ומשכנעת, מותר לך לשנות תנאי או להקל, ולומר זאת במפורש. אם לא, עמדי על שלך והסבירי מה היה משנה את דעתך.'},...judgeTurns.slice(-9)],
      {cache:false,signal:ctl.signal,effort:'low',onText:({text})=>{if(g!==gen)return;t.parentNode.classList.remove('wait');t.textContent=strip(text);pulse=Math.min(1,pulse+.1);log.scrollTop=log.scrollHeight}});
    if(g!==gen)return;t.parentNode.classList.remove('wait');t.textContent=strip(r.text);judgeTurns.push({role:'assistant',content:r.text});
    if(voiceOn&&tts)tts.speak(strip(r.text).slice(0,1900),{voice:'rounded'}).catch(()=>{})}
  catch(e){if(g!==gen)return;t.parentNode.remove();judgeTurns.pop();if(!e||e.code!=='cancelled')dir('השופטת לא זמינה כרגע. אפשר לנסות שוב.','m note')}
  finally{if(g===gen){lock(false);if(!small)msg.focus()}}
}

/* recorded example, shown only where no Claude is available */
const DEMO=[['dir','— משפט לדוגמה, מוקלט מראש: ״סדנת AI שבועית לסבים ולסבתות במתנ״ס״ —'],
['pros','כבוד השופטת, הרעיון הזה נשמע מתוק, וזו בדיוק הבעיה. מי ביקש אותו? הנכדים, לא הסבים. מי שלא פותח לבד את הווטסאפ לא יבוא פעמיים לסדנה על בינה מלאכותית. ואחרי המפגש הראשון, כשההתלהבות תרד, מי יישאר? בעלי הרעיון מספרים לעצמם שיש ביקוש, כשבפועל יש להם רק כוונה טובה.'],
['def','התביעה מתארת סבים של פעם. הסבים של היום מזמינים תור לרופא באפליקציה ומפחדים שיעבדו עליהם בטלפון. הצורך אמיתי: לא ״ללמוד AI״ אלא להפסיק להרגיש מאחור. נכון, השם ״סדנת AI״ מרתיע. את זה משנים בשורה אחת. הרעיון עצמו עומד.'],
['wit','אני בת 74. הנכדה שלי מראה לי דברים בטלפון במהירות כזאת שאני מהנהנת ולא מבינה כלום. למתנ״ס הייתי באה, אבל רק אם חברה שלי רותי באה גם, ורק אם אף אחד לא ישאל אותי שאלות מול כולם.','עדת תביעה: סבתא ספקנית'],
['pros','שאלה אחת לבעלי הרעיון: כמה סבים וסבתות, בשמות, כבר אמרו לכם שהם יבואו?'],
['you','שלושה. אמא שלי ושתי שכנות שלה.'],
['dir','— השופטת פרשה לשקול —'],
['verdict',{verdict:'זכאי בתנאים',headline:'הרעיון יוצא לדרך, אבל לא בשם הזה ולא לפני מפגש ניסיון אחד.',reasoning:'הצורך אמיתי, והעדה אישרה אותו בעצמה: היא רוצה להבין, ומפחדת להתבייש. התביעה צודקת שאין עדיין ביקוש מוכח, ושלוש נרשמות הן התחלה ולא שוק. מה שיכריע הוא אם אנשים חוזרים למפגש שני.',strongest:'הפחד ״להישאר מאחור״ הוא מניע חזק יותר מסקרנות.',weakest:'אין אף ראיה שמישהו חוזר פעם שנייה.',conditions:['לקיים מפגש ניסיון אחד עם שלוש הנרשמות, ולבקש מכל אחת להביא חברה.','להחליף את השם ״סדנת AI״ במשהו על ביטחון בטלפון.','לספור כמה מגיעות למפגש השני. זה המספר היחיד שקובע.'],dissent:'התביעה: שלוש שכנות של אמא הן משפחה, לא לקוחות.'}]];
async function demo(){const g=gen;lock(true);quick.textContent='';record=[];C={idea:'סדנת AI שבועית לסבים ולסבתות במתנ״ס',title:'סבתא לומדת AI',charge:'רעיון שהנכדים רוצים, ולא מי שאמור להגיע.'};
  $('ctitle').textContent=C.title;$('charge').textContent='כתב האישום: '+C.charge;$('case').hidden=false;phase(0);curVal=gematria(C.title);showWord(C.title);gavel();
  await wait(2200);if(g!==gen)return;openWorld(curVal);
  for(const[r,t,l]of DEMO){await wait(r==='dir'?900:2600);if(g!==gen)return;
    if(r==='dir'){dir(t);gavel();phase(Math.min(3,[...log.querySelectorAll('.dir')].length-1))}
    else if(r==='verdict'){verdict(t);lock(true);ph('שיחה עם השופטת זמינה דרך Claude');chips([['תיק חדש','n']],()=>reset())}
    else{setHue(ROLE[r][1]);line(r,t,l)}}
}
function noJudge(){dir('כאן אין הרכב זמין: את התביעה, ההגנה והשופטת מגלם Claude, והדף צריך להיפתח דרכו ולקבל אישור. אפשר לצפות במשפט לדוגמה.','m note');
  chips([['לצפות במשפט לדוגמה','d']],()=>demo())}

async function onIdea(t){if(t.length<8){line('clerk','צריך קצת יותר מזה. מה בדיוק הרעיון?');return}
  line('you',t);C.idea=t.slice(0,600);step='wait';quick.textContent='';await wait(600);
  line('clerk','נרשם. ולמי זה מיועד, ומה מונח אצלכם על הכף? אפשר גם לדלג.');step='stakes';ph('למי, ומה על הכף');chips([['לדלג','']],()=>onStakes(''))}
async function onStakes(t){quick.textContent='';if(t)line('you',t);C.stakes=t.slice(0,400);step='trial';
  await Promise.race([capsReady,new Promise(r=>setTimeout(r,4000))]);
  if(!sample){noJudge();return}
  trial()}
$('f').addEventListener('submit',e=>{e.preventDefault();const t=msg.value.trim();if(!t||msg.disabled||step==='wait'||step==='trial')return;
  audio();if(AC&&AC.state==='suspended')AC.resume();msg.value='';
  if(step==='idea')onIdea(t);else if(step==='stakes')onStakes(t);
  else if(step==='answer'&&answer){line('you',t);record.push({who:'בעלי הרעיון',text:t});const a=answer;answer=null;step='trial';a(t)}
  else if(step==='appeal'&&sample)appeal(t)});
$('bReset').addEventListener('click',reset);
$('bVoice').addEventListener('click',()=>{voiceOn=!voiceOn;$('bVoice').setAttribute('aria-pressed',String(voiceOn));if(!voiceOn&&tts){try{tts.stop()}catch(e){}}});

const kb=()=>{const v=window.visualViewport;if(!v)return;document.documentElement.style.setProperty('--kb',Math.max(0,innerHeight-v.height-v.offsetTop)+'px')};
if(window.visualViewport){visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb)}
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{resize();rasterWord(curWord)},120)});

  resize();showWord('');
  const tick=()=>{document.documentElement.style.setProperty('--accent',css(colT.u1));document.documentElement.style.setProperty('--accent2',css(colT.u2))};
  tick();setInterval(tick,300);requestAnimationFrame(loop);
}

Promise.race([fonts,new Promise(r=>setTimeout(r,2500))]).then(start,start);
