<title>Shelly on Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=Fredoka:wght@600;700&family=VT323&display=swap">
<style>
/* Layout: full-bleed WebGL stage, retro HUD pinned to corners, control drawer bottom */
:root{
  --ink:#fff6fb; --dim:#f7d3ea; --pink:#ff5fc8; --banana:#fae67a; --glass:rgba(24,10,30,.62); --edge:rgba(255,95,200,.45);
  --ui:"Heebo",system-ui,sans-serif; --px:"Fredoka","Heebo",sans-serif; --mono:"VT323",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:radial-gradient(120% 80% at 50% 30%,#3a2140,#120c18);color:var(--ink);font-family:var(--ui);overflow:hidden}
#frame{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100vh * 9 / 16));height:min(100vh,calc(100vw * 16 / 9));overflow:hidden;box-shadow:0 0 0 2px var(--edge),0 30px 80px rgba(0,0,0,.5)}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.hud{position:absolute;pointer-events:none;font-family:var(--mono);letter-spacing:.06em;text-shadow:2px 2px 0 rgba(0,0,0,.55)}
.tl{top:14px;left:16px}
.tr{top:14px;right:16px;text-align:right}
.brand{font-family:var(--px);font-weight:700;font-size:22px;line-height:1.1;color:#fff;letter-spacing:.02em;text-shadow:0 2px 0 #c2185b,0 4px 10px rgba(0,0,0,.25)}
.sub{font-size:20px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.rec{display:inline-flex;gap:8px;align-items:center;font-size:22px}
.rec i{width:10px;height:10px;background:#ff3b5c;display:inline-block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bpm{font-size:22px;color:var(--banana)}
.panel{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);
  width:min(420px,calc(100% - 32px));background:var(--glass);border:2px solid var(--edge);backdrop-filter:blur(8px);
  padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;direction:rtl}
.panel label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--dim)}
.panel input[type=color]{width:30px;height:24px;border:2px solid var(--edge);background:none;padding:0;cursor:pointer}
.panel input[type=range]{width:90px;accent-color:var(--pink)}
.btn{font-family:var(--ui);font-weight:900;font-size:15px;border:0;padding:9px 16px;cursor:pointer;color:#2a0f22;
  background:linear-gradient(180deg,var(--banana),#ffc94d);box-shadow:3px 3px 0 var(--pink)}
.btn:focus-visible,.panel input:focus-visible{outline:2px solid var(--banana);outline-offset:2px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--edge);box-shadow:none;font-weight:700}
@media (max-width:520px){.brand{font-size:19px}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}}
</style>

<div id="frame"><canvas id="stage" aria-label="שלי כדמות לבנים מבריקה מתקלטת על סיפון יאכטה, פורמט לאורך"></canvas>
<div class="hud tl"><div class="brand">SHELLY // ON DECK</div><div class="sub">BRICK SESSION · 2026</div></div>
<div class="hud tr"><div class="rec"><i></i>LIVE</div><div class="bpm" id="bpm">122 BPM</div></div>
</div>

<div class="panel" role="group" aria-label="התאמת הדמות">
  <button class="btn" id="play" type="button">הפעילי ביט</button>
  <button class="btn alt" id="shot" type="button">שוט הבא</button>
  <label for="cSkin">עור <input id="cSkin" type="color" value="#eab08f"></label>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const T = THREE, V = (x,y,z)=>new T.Vector3(x,y,z);
const canvas = document.getElementById('stage'), frameEl=document.getElementById('frame');
const renderer = new T.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
renderer.outputColorSpace = T.SRGBColorSpace;
const scene = new T.Scene();
scene.fog = new T.Fog(0xdff0ff, 14, 70);
const cam = new T.PerspectiveCamera(38, 1, 0.05, 200);

/* ---------- tiny canvas textures (nearest-filtered, PS2 grit) ---------- */
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.anisotropy=4;t.colorSpace=T.SRGBColorSpace;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const noise=(g,w,h,a)=>{for(let i=0;i<w*h/3;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},${a*Math.random()})`;g.fillRect(Math.random()*w|0,Math.random()*h|0,1,1);}};
const fabricTex = tex(32,32,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);for(let i=0;i<w*h;i++){const v=200+Math.random()*55|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i%w,i/w|0,1,1);}},[2,2]);
const skinTex = tex(16,16,(g,w,h)=>{for(let i=0;i<w*h;i++){const v=228+Math.random()*27|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i%w,i/w|0,1,1);}});
const deckTex = tex(64,64,(g,w,h)=>{for(let y=0;y<h;y+=8){const v=150+Math.random()*40|0;g.fillStyle=`rgb(${v+40},${v+10},${v-30})`;g.fillRect(0,y,w,8);g.fillStyle='rgba(60,40,20,.7)';g.fillRect(0,y+7,w,1);g.fillRect((Math.random()*w)|0,y,1,7);}},[10,10]);
const seaTex = tex(64,64,(g,w,h)=>{g.fillStyle='#4f7fa8';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.fillStyle=Math.random()<.5?'#6f9cc2':'#9cc0dc';g.fillRect(Math.random()*w|0,Math.random()*h|0,3+Math.random()*4|0,1);}},[60,60]);
const mixerTex = tex(128,96,(g,w,h)=>{
  g.fillStyle='#1d1d22';g.fillRect(0,0,w,h);
  for(let c=0;c<4;c++){const x=14+c*30;
    for(let k=0;k<3;k++){g.fillStyle='#0c0c0f';g.fillRect(x,6+k*12,10,8);}
    g.fillStyle='#000';g.fillRect(x+4,52,2,34);
    for(let s=0;s<6;s++){g.fillStyle='#55555c';g.fillRect(x+8,54+s*6,4,1);}
    g.fillStyle=['#ff5a3c','#3c8cff','#ff5a3c','#ffa23c'][c];g.fillRect(x,44,10,3);}
  g.fillStyle='#9a9aa2';g.font='8px monospace';g.fillText('MIX-4',w-34,h-4);});
const jogTex = tex(64,64,(g,w,h)=>{g.fillStyle='#16161a';g.fillRect(0,0,w,h);g.strokeStyle='#3a3a42';for(let r=8;r<32;r+=5){g.beginPath();g.arc(32,32,r,0,7);g.stroke();}
  g.fillStyle='#c8c8d0';g.fillRect(30,2,4,14);g.fillStyle='#ff5fc8';g.beginPath();g.arc(32,32,6,0,7);g.fill();});
const skyTex = tex(4,256,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#3f9cff');gr.addColorStop(.42,'#a9dbff');gr.addColorStop(.5,'#eef8ff');gr.addColorStop(1,'#dff0ff');g.fillStyle=gr;g.fillRect(0,0,w,h);});

/* ---------- materials: glossy toy plastic ---------- */
const plastic=(color,o={})=>new T.MeshPhysicalMaterial(Object.assign({color,roughness:.35,metalness:0,clearcoat:.8,clearcoatRoughness:.04,envMapIntensity:.35},o));
const lam=(color,opt={})=>plastic(color,opt);
const M = {
  skin: plastic(0xeab08f), hair: plastic(0x5c3a20), top: plastic(0xe3246d),
  silver: plastic(0xdfe3ea,{metalness:.95,roughness:.16,clearcoat:0,envMapIntensity:1}),
  dark: plastic(0x2b2b33), black: plastic(0x18181d), lips: plastic(0xb5303e), nail: plastic(0xffffff),
  glass: plastic(0x0e0e12,{roughness:.04}), white: plastic(0xf7f4ef), brow: plastic(0x241612)
};
/* rounded-edge bricks, cached per size */
function rboxGeo(w,h,d,r,seg){const sh=new T.Shape(),e=1e-5,rr=r-e;
  sh.absarc(e,e,e,-Math.PI/2,-Math.PI,true);sh.absarc(e,h-rr*2,e,Math.PI,Math.PI/2,true);sh.absarc(w-rr*2,h-rr*2,e,Math.PI/2,0,true);sh.absarc(w-rr*2,e,e,0,-Math.PI/2,true);
  const g=new T.ExtrudeGeometry(sh,{depth:Math.max(1e-4,d-r*2),bevelEnabled:true,bevelSegments:seg,steps:1,bevelSize:rr,bevelThickness:r,curveSegments:seg});g.center();return g;}
const RBC={};
function RB(w,h,d){const k=w+'_'+h+'_'+d;if(!RBC[k]){const r=Math.min(.022,Math.min(w,h,d)*.2);RBC[k]=r<.002?new T.BoxGeometry(w,h,d):rboxGeo(w,h,d,r,3);}return RBC[k];}
const STUD=new T.CylinderGeometry(.04,.04,.028,20);
function studs(mat,x0,x1,z0,z1,y,step){const pts=[];for(let x=x0;x<=x1+1e-6;x+=step)for(let z=z0;z<=z1+1e-6;z+=step)pts.push([x,z]);
  const m=new T.InstancedMesh(STUD,mat,pts.length),o=new T.Object3D();pts.forEach((p,i)=>{o.position.set(p[0],y+.014,p[1]);o.updateMatrix();m.setMatrixAt(i,o.matrix);});
  m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
/* studio environment for reflections */
{const pm=new T.PMREMGenerator(renderer),env=new T.Scene();
 env.add(new T.Mesh(new T.SphereGeometry(10,32,16),new T.MeshBasicMaterial({map:skyTex,side:T.BackSide})));
 const lite=new T.MeshBasicMaterial({color:0xffffff});
 [[0,8,0,6,6],[-7,3,4,3,5],[7,4,-3,3,4],[0,2,8,8,2]].forEach(([x,y,z,w,h])=>{const q=new T.Mesh(new T.PlaneGeometry(w,h),lite);q.position.set(x,y,z);q.lookAt(0,0,0);env.add(q);});
 scene.environment=pm.fromScene(env,.03).texture;}

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(0xeaf4ff,0x8a6a50,.45));
const sun = new T.DirectionalLight(0xfff1dc,2.8); sun.position.set(-3,6,4); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:1,far:20}); sun.shadow.bias=-.0004; sun.shadow.radius=4; scene.add(sun);
const rim = new T.DirectionalLight(0xffc0e8,.7); rim.position.set(3,2,-3); scene.add(rim);


/* ---------- yacht set ---------- */
const sky = new T.Mesh(new T.SphereGeometry(80,12,8),new T.MeshBasicMaterial({map:skyTex,side:T.BackSide,fog:false})); scene.add(sky);
const sea = new T.Mesh(new T.PlaneGeometry(400,400),plastic(0x2a8fe0,{roughness:.12})); sea.rotation.x=-Math.PI/2; sea.position.y=-1.4; scene.add(sea);
const deckMat=plastic(0xe0a860);const deck = new T.Mesh(new T.BoxGeometry(14,.2,10),deckMat); deck.position.set(0,-.1,-1); scene.add(deck);
studs(deckMat,-3.2,3.2,-3.2,2.4,0,.2);
const box=(w,h,d,m,x,y,z,p=scene)=>{const o=new T.Mesh(RB(w,h,d),m);o.position.set(x,y,z);p.add(o);return o;};
// railing
for(let x=-6.5;x<=6.5;x+=0.9) box(.04,1,.04,M.silver,x,.5,-5.8);
box(13.2,.05,.05,M.silver,0,1,-5.8); box(13.2,.03,.03,M.silver,0,.6,-5.8);
for(const s of[-1,1]){for(let z=-5.5;z<=2;z+=0.9) box(.04,1,.04,M.silver,s*6.6,.5,z); box(.05,.05,7.6,M.silver,s*6.6,1,-1.8);}
// lounge cushions + canopy
box(4.2,.45,1,M.white,-1.4,.22,-4.6); box(4.2,.5,.25,M.white,-1.4,.6,-5.05);
box(2.4,.45,1,M.white,3.6,.22,-4.6);
// open sky: no canopy, keeps the vertical frame clean
M.white2=plastic(0xffffff);[[-1.6,.25],[1.9,.25]].forEach(([x,y])=>{box(.8,.32,.4,M.white2,x,y+.16,-4.3);});

/* ---------- DJ booth ---------- */
box(2.1,.06,.66,M.black,0,.97,.4);studs(M.black,-1.0,1.0,.12,.12,1.0,.2);studs(M.black,-1.0,1.0,.66,.66,1.0,.2);for(const x of[-1,1])for(const z of[.12,.68])box(.05,.94,.05,M.silver,x,.47,z);box(1.9,.03,.03,M.silver,0,.3,.68);
const mixer = box(.62,.08,.44,M.dark,0,1.04,.36);
const mixTop = new T.Mesh(new T.PlaneGeometry(.6,.42),lam(0xffffff,{map:mixerTex})); mixTop.rotation.x=-Math.PI/2; mixTop.position.set(0,1.081,.36); scene.add(mixTop);
const CH = [-.21,-.07,.07,.21].map(x=>x*.95);
const knobs=[], faders=[];
CH.forEach(x=>{for(let k=0;k<3;k++){const kn=new T.Mesh(new T.CylinderGeometry(.016,.018,.03,6),M.black);kn.position.set(x,1.1,.19+k*.055);scene.add(kn);
  const tick=box(.004,.032,.012,M.white,0,0,.012,kn);knobs.push(kn);}
  const f=box(.03,.022,.016,M.white,x+.006,1.096,.48);faders.push(f);});
const decks=[];
for(const s of[-1,1]){const b=box(.46,.06,.46,M.dark,s*.62,1.03,.38);
  const p=new T.Mesh(new T.CylinderGeometry(.15,.15,.02,16),[M.silver,new T.MeshLambertMaterial({map:jogTex}),M.silver]);p.position.set(s*.62,1.07,.4);scene.add(p);decks.push(p);
  for(let i=0;i<3;i++) box(.05,.012,.03,lam(i?0x2a2a30:0xff5a3c),s*.62+s*-.14+i*.06*s*-0,1.065,.2+i*.0,scene).position.x=s*.62-.14+i*.07;}

/* ---------- character: Shelly (from SHOTCALLER CITY makeShelly, DJ-rigged) ---------- */
const holoMat=plastic(0x9f7dff,{iridescence:1,iridescenceIOR:1.7,iridescenceThicknessRange:[200,900],roughness:.2});
const _oldHolo=({uniforms:{time:{value:0},sunDir:{value:V(-0.6,0.6,0.5).normalize()}},
  vertexShader:`varying vec3 vN;varying vec3 vV;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);vP=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vN;varying vec3 vV;varying vec3 vP;uniform float time;uniform vec3 sunDir;
    vec3 hsl2rgb(float h){vec3 p=abs(fract(vec3(h)+vec3(0.,.333,.667))*6.-3.);return clamp(p-1.,0.,1.);}
    void main(){float fr=pow(1.-abs(dot(vN,vV)),1.4);float hue=fract(fr*.9+vP.y*.55+time*.05);
    vec3 rainbow=mix(vec3(1.),hsl2rgb(hue),.95);vec3 base=mix(vec3(.7,.6,.95),rainbow,.9);
    float li=.55+.45*max(dot(vN,sunDir),0.);gl_FragColor=vec4(base*li*vec3(1.05,.95,1.)+vec3(.3,.18,.25)*fr,1.);}`});
M.gold=plastic(0xe7b83f,{metalness:1,roughness:.2,clearcoat:0,envMapIntensity:1});
M.shoe=plastic(0xffffff);
const body=new T.Group(); scene.add(body);
const add=(geo,m,x,y,z,p)=>{const o=new T.Mesh(geo,m);o.position.set(x,y,z);p.add(o);return o;};
const B=(w,h,d)=>RB(w,h,d);
const hipY=.95, legs=[];
for(const s of[1,-1]){const L=new T.Group();L.position.set(.12*s,hipY,0);body.add(L);
  add(B(.24,.5,.26),holoMat,0,-.25,0,L);add(B(.28,.5,.3),holoMat,0,-.72,0,L);add(B(.2,.13,.34),M.shoe,0,-.99,.05,L);legs.push(L);}
add(B(.4,.22,.3),holoMat,0,hipY+.05,0,body);
const chest=new T.Group();chest.position.set(0,1.1,0);body.add(chest);
add(B(.34,.14,.24),M.skin,0,.08,0,chest);              // midriff
add(B(.38,.42,.26),M.top,0,.36,0,chest);               // pink top
for(const s of[-1,1])add(B(.07,.06,.24),M.top,s*.15,.6,0,chest); // straps
add(B(.14,.06,.2),M.skin,0,.6,0,chest);                // neckline skin
add(B(.1,.1,.1),M.skin,0,.66,0,chest);                 // neck
const necklace=new T.Group();chest.add(necklace);
for(let i=0;i<=10;i++){const t=i/10,a=Math.PI*(.12+.76*t);add(B(.018,.018,.012),M.gold,Math.cos(a)*.085,.6-Math.sin(a)*.07,.135,necklace);}
add(B(.07,.05,.02),M.gold,0,.5,.14,necklace);
const shoulders=[];
for(const s of[-1,1]){add(B(.13,.13,.13),M.skin,s*.25,.53,0,chest);const a=new T.Object3D();a.position.set(s*.26,.53,0);chest.add(a);shoulders.push(a);}
// head: her blocky head + DJ kit from the reference (shades, cans)
const head=new T.Group();head.position.set(0,.85,0);chest.add(head);
add(B(.24,.28,.24),M.skin,0,0,0,head);
const hair=new T.Group();head.add(hair);
add(B(.27,.14,.27),M.hair,0,.12,0,hair);
add(B(.26,.62,.1),M.hair,0,-.18,-.15,hair);
for(const s of[-1,1])add(B(.05,.4,.18),M.hair,s*.14,-.08,-.04,hair);
add(B(.22,.05,.03),M.hair,0,.115,.12,hair);            // fringe line
add(B(.035,.06,.05),M.skin,0,.0,.14,head);             // nose
add(B(.07,.018,.02),M.lips,0,-.06,.125,head);
add(B(.055,.014,.02),M.lips,0,-.077,.124,head);
for(const s of[-1,1]){add(B(.1,.055,.02),M.glass,s*.058,.045,.13,head);add(B(.03,.012,.14),M.silver,s*.122,.05,.06,head);}
add(B(.03,.012,.02),M.silver,0,.06,.13,head);
const band=add(new T.TorusGeometry(.165,.016,4,10,Math.PI),M.silver,0,.04,0,head);band.scale.set(1,1.1,1);
for(const s of[-1,1]){const c=add(new T.CylinderGeometry(.06,.06,.05,8),M.silver,s*.16,.02,0,head);c.rotation.z=Math.PI/2;
  add(new T.CylinderGeometry(.045,.045,.052,8),M.dark,s*.163,.02,0,head).rotation.z=Math.PI/2;}

// arms: her box limbs, world-space two-bone IK
const limbGeo=(w)=>{const g=rboxGeo(w,1,w,.02,3);g.translate(0,.5,0);return g;};
const UP=V(0,1,0), LA=.33, LB=.31;
function makeArm(){const u=new T.Mesh(limbGeo(.11),M.skin),f=new T.Mesh(limbGeo(.1),M.skin),el=new T.Mesh(B(.105,.105,.105),M.skin);
  scene.add(u,f,el);const hand=new T.Group();scene.add(hand);
  add(B(.08,.03,.09),M.skin,0,0,.045,hand);
  for(let i=0;i<3;i++){const b=add(new T.TorusGeometry(.06,.007,3,8),i==1?M.gold:M.silver,0,0,-.03-i*.016,hand);}
  const fingers=[];[-.03,-.01,.01,.03].forEach((x,i)=>{const fg=new T.Group();fg.position.set(x,0,.09);hand.add(fg);
    add(B(.017,.017,.065),M.skin,0,0,.032,fg);add(new T.ConeGeometry(.008,.04,3),M.nail,0,-.002,.08,fg).rotation.x=Math.PI/2;
    fg.rotation.x=.55+i*.04;fingers.push(fg);});
  const th=new T.Group();hand.add(th);add(B(.018,.018,.055),M.skin,0,0,.027,th);add(new T.ConeGeometry(.008,.035,3),M.nail,0,0,.065,th).rotation.x=Math.PI/2;
  return {u,f,el,hand,fingers,th};}
const arms=[makeArm(),makeArm()];
const place=(m,a,b)=>{const d=b.clone().sub(a),L=d.length();m.position.copy(a);m.quaternion.setFromUnitVectors(UP,d.normalize());m.scale.set(1,L,1);};
function solve(arm,side,S,Tg,pole){
  const d=Tg.clone().sub(S);let L=Math.min(Math.max(d.length(),.08),LA+LB-.002);const dir=d.normalize();
  const cosA=(LA*LA+L*L-LB*LB)/(2*LA*L),sinA=Math.sqrt(Math.max(0,1-cosA*cosA));
  const perp=pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const E=S.clone().addScaledVector(dir,LA*cosA).addScaledVector(perp,LA*sinA), W=S.clone().addScaledVector(dir,L);
  place(arm.u,S,E);place(arm.f,E,W);arm.el.position.copy(E);arm.el.quaternion.copy(arm.u.quaternion);
  const fw=W.clone().sub(E);fw.y*=.25;fw.normalize();
  arm.hand.position.copy(W);arm.hand.lookAt(W.clone().add(fw));arm.hand.rotateX(.28);arm.hand.rotateZ(-side*.12);
  arm.th.position.set(-side*.045,-.006,.03);arm.th.rotation.set(.5,-side*.6,0);
}

scene.traverse(o=>{if(o.isMesh&&o!==sky&&o!==sea){o.castShadow=true;o.receiveShadow=true;}});

/* ---------- choreography ---------- */
const BPM=122, BEAT=60/BPM;
const knobPos=i=>knobs[i].position;
const sm=t=>t*t*(3-2*t);
// left hand: hops between knobs (channels 0/1), right hand: rides fader on channel 2 and taps channel 3 knobs
const LSEQ=[0,4,1,3,7,4], RSEQ=['f','f',11,'f',10,'f'];
function seqTarget(seq,t,side){
  const per=BEAT*2, n=seq.length, k=Math.floor(t/per), ph=(t%per)/per;
  const at=i=>{const s=seq[((i%n)+n)%n];if(s==='f'){const f=faders[2];return {p:V(f.position.x,1.135,f.position.z-.085),fader:true};}
    const p=knobPos(s);return {p:V(p.x,1.14,p.z-.085),knob:s};};
  const a=at(k),b=at(k+1);const m=sm(Math.min(1,Math.max(0,(ph-.6)/.4)));
  const p=a.p.clone().lerp(b.p,m);p.y+=Math.sin(m*Math.PI)*.06;
  return {p,cur:m<.5?a:b,ph,m};
}

/* ---------- camera shots ---------- */
const SHOTS=[{p:V(.1,1.15,3.3),l:V(0,.92,.1)},{p:V(-.3,1.86,1.05),l:V(0,1.78,0)},{p:V(.5,1.5,1.25),l:V(.05,1.12,.3)},{p:V(-1.2,.55,2.6),l:V(0,1.15,0)}];
let shot=0, shotT=0, camP=SHOTS[0].p.clone(), camL=SHOTS[0].l.clone(), drag=null, yawOff=0, pitchOff=0, lastDrag=-99;
document.getElementById('shot').onclick=()=>{shot=(shot+1)%SHOTS.length;shotT=0;};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yo:yawOff,po:pitchOff};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yawOff=drag.yo-(e.clientX-drag.x)*.006;pitchOff=Math.max(-.4,Math.min(.5,drag.po+(e.clientY-drag.y)*.004));lastDrag=clock.elapsedTime;});
canvas.addEventListener('pointerup',()=>drag=null);

/* ---------- audio: a small synth house loop ---------- */
let ac=null, master, playing=false, nextT=0, step=0, kickPulse=0;
const playBtn=document.getElementById('play');
function startAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);nextT=ac.currentTime+.05;}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(master);o.start(t);o.stop(t+.32);}
let nb=null;function hat(t,v){if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f).connect(g).connect(master);s.start(t);}
function tone(t,freq,dur,type,v,cut){const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;f.Q.value=6;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.02);}
const BASS=[45,0,45,57,0,45,0,52, 43,0,43,55,0,43,0,50], CH_=[[57,60,64],[55,59,62]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function schedule(){const s16=BEAT/4;while(nextT<ac.currentTime+.12){const i=step%16,bar=Math.floor(step/16)%2;
  if(i%4===0)kick(nextT); if(i%4===2)hat(nextT,.35); else if(i%2)hat(nextT,.08);
  const b=BASS[(bar*8+(i>>1))%16]; if(i%2===1&&b)tone(nextT,hz(b),.18,'sawtooth',.22,600+Math.sin(step*.05)*400);
  if(i===6||i===14)CH_[bar].forEach(n=>tone(nextT,hz(n),.22,'square',.05,1800));
  nextT+=s16;step++;}}
playBtn.onclick=()=>{if(!ac)startAudio();if(playing){ac.suspend();playing=false;playBtn.textContent='הפעילי ביט';}else{ac.resume();playing=true;playBtn.textContent='עצרי ביט';}};

/* ---------- controls ---------- */
const bind=(id,m)=>document.getElementById(id).addEventListener('input',e=>m.color.set(e.target.value));
bind('cSkin',M.skin);bind('cHair',M.hair);bind('cTop',M.top);
function resize(){const r=frameEl.getBoundingClientRect();renderer.setSize(Math.max(1,Math.round(r.width)),Math.max(1,Math.round(r.height)),false);cam.aspect=9/16;cam.fov=50;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new T.Clock();
const tmp=V(0,0,0);
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(playing&&ac)schedule();
  const beatPh=(t%BEAT)/BEAT, groove=playing?1:.45;
  // body groove
  const bob=Math.pow(Math.max(0,Math.cos(beatPh*Math.PI*2)),3)*.018*groove;
  body.position.y=-bob; body.rotation.y=Math.sin(t*Math.PI/BEAT/2)*.05*groove;
  chest.rotation.x=.18+bob*1.4;legs.forEach((l,i)=>l.rotation.x=-bob*(i?2:3)); chest.rotation.z=Math.sin(t*Math.PI/BEAT/2)*.025*groove;
  head.rotation.x=-.12+bob*5; head.rotation.y=Math.sin(t*.37)*.25; head.rotation.z=Math.sin(t*Math.PI/BEAT/2)*.05;
  hair.rotation.x=-bob*2;
  // hands
  const L=seqTarget(LSEQ,t,-1), R=seqTarget(RSEQ,t+BEAT,1);
  // fader rides with right hand
  if(R.cur.fader&&R.m<.15){faders[2].position.z=.44+Math.sin(R.ph*Math.PI*2)*.035;R.p.z=faders[2].position.z-.085;}
  [L,R].forEach((h,i)=>{if(h.cur.knob!==undefined&&h.m<.2){knobs[h.cur.knob].rotation.y+=dt*(i?-2:2.4);}});
  shoulders.forEach((s,i)=>{s.getWorldPosition(tmp);const side=i?1:-1;const tgt=(i?R:L).p.clone();tgt.x+=side*.02;
    solve(arms[i],side,tmp.clone(),tgt,V(side*1,-.5,-.5));
    arms[i].fingers.forEach((f,j)=>f.rotation.x=.55+j*.05+Math.max(0,Math.sin(t*9+j*1.3+i))*.18*(1-(i?R:L).m));});
  decks.forEach((d,i)=>d.rotation.y-=dt*(i?3.6:3.2));
  // camera: cut-free slow drift between shots
  if(!reduce){shotT+=dt;if(shotT>7&&t-lastDrag>6){shot=(shot+1)%SHOTS.length;shotT=0;}}
  const S=SHOTS[shot];const k=1-Math.pow(.25,dt);
  camP.lerp(S.p,k*.6);camL.lerp(S.l,k*.6);
  const off=camP.clone().sub(camL),r=off.length(),yaw=Math.atan2(off.x,off.z)+yawOff+(reduce?0:Math.sin(t*.21)*.06),pit=Math.asin(off.y/r)+pitchOff;
  cam.position.set(camL.x+Math.sin(yaw)*Math.cos(pit)*r,camL.y+Math.sin(pit)*r+(reduce?0:Math.sin(t*1.3)*.006),camL.z+Math.cos(yaw)*Math.cos(pit)*r);
  cam.lookAt(camL);
  if(t-lastDrag>6&&!drag){yawOff*=.985;pitchOff*=.985;}
  document.getElementById('bpm').style.opacity=playing?(beatPh<.15?1:.55):.55;
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
frame();
})();
</script>
