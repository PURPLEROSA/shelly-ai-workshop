<title>Shelly on Deck</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&family=VT323&display=swap">
<style>
/* Layout: full-bleed WebGL stage, retro HUD pinned to corners, control drawer bottom */
:root{
  --ink:#fff6fb; --dim:#f7d3ea; --pink:#ff5fc8; --banana:#fae67a; --glass:rgba(24,10,30,.62); --edge:rgba(255,95,200,.45);
  --ui:"Heebo",system-ui,sans-serif; --mono:"VT323",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#1b1424;color:var(--ink);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;cursor:grab}
#stage:active{cursor:grabbing}
.hud{position:fixed;pointer-events:none;font-family:var(--mono);letter-spacing:.06em;text-shadow:2px 2px 0 rgba(0,0,0,.55)}
.tl{top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px))}
.tr{top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));text-align:right}
.brand{font-size:30px;line-height:1;color:var(--banana)}
.sub{font-size:20px;color:var(--dim)}
.rec{display:inline-flex;gap:8px;align-items:center;font-size:22px}
.rec i{width:10px;height:10px;background:#ff3b5c;display:inline-block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.bpm{font-size:22px;color:var(--banana)}
.panel{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);
  width:min(720px,calc(100% - 32px));background:var(--glass);border:2px solid var(--edge);backdrop-filter:blur(8px);
  padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:center;direction:rtl}
.panel label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--dim)}
.panel input[type=color]{width:30px;height:24px;border:2px solid var(--edge);background:none;padding:0;cursor:pointer}
.panel input[type=range]{width:90px;accent-color:var(--pink)}
.btn{font-family:var(--ui);font-weight:900;font-size:15px;border:0;padding:9px 16px;cursor:pointer;color:#2a0f22;
  background:linear-gradient(180deg,var(--banana),#ffc94d);box-shadow:3px 3px 0 var(--pink)}
.btn:focus-visible,.panel input:focus-visible{outline:2px solid var(--banana);outline-offset:2px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--edge);box-shadow:none;font-weight:700}
@media (max-width:520px){.panel input[type=range]{width:64px}.brand{font-size:24px}}
@media (prefers-reduced-motion:reduce){.rec i{animation:none}}
</style>

<canvas id="stage" aria-label="דמות תלת מימד בסגנון רטרו לואו-פולי מתקלטת על סיפון יאכטה"></canvas>
<div class="hud tl"><div class="brand">SHELLY // ON DECK</div><div class="sub">LOW-POLY SESSION · 2026</div></div>
<div class="hud tr"><div class="rec"><i></i>LIVE</div><div class="bpm" id="bpm">122 BPM</div></div>

<div class="panel" role="group" aria-label="התאמת הדמות">
  <button class="btn" id="play" type="button">הפעילי ביט</button>
  <button class="btn alt" id="shot" type="button">שוט הבא</button>
  <label for="cSkin">עור <input id="cSkin" type="color" value="#c98a5e"></label>
  <label for="cHair">שיער <input id="cHair" type="color" value="#1c1412"></label>
  <label for="cTop">טופ <input id="cTop" type="color" value="#e0609e"></label>
  <label for="pix">פיקסלים <input id="pix" type="range" min="1" max="5" step="0.5" value="2.5"></label>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const T = THREE, V = (x,y,z)=>new T.Vector3(x,y,z);
const canvas = document.getElementById('stage');
const renderer = new T.WebGLRenderer({canvas, antialias:false});
renderer.setPixelRatio(1);
renderer.outputColorSpace = T.SRGBColorSpace;
const scene = new T.Scene();
scene.fog = new T.Fog(0xcfd9e4, 8, 40);
const cam = new T.PerspectiveCamera(38, 1, 0.05, 200);
let pixel = 2.5;

/* ---------- tiny canvas textures (nearest-filtered, PS2 grit) ---------- */
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);
  const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;t.minFilter=T.NearestFilter;t.colorSpace=T.SRGBColorSpace;
  if(rep){t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}return t;}
const noise=(g,w,h,a)=>{for(let i=0;i<w*h/3;i++){g.fillStyle=`rgba(${Math.random()<.5?0:255},${Math.random()<.5?0:255},${Math.random()<.5?0:255},${a*Math.random()})`;g.fillRect(Math.random()*w|0,Math.random()*h|0,1,1);}};
const fabricTex = tex(32,32,(g,w,h)=>{g.fillStyle='#fff';g.fillRect(0,0,w,h);for(let i=0;i<w*h;i++){const v=200+Math.random()*55|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i%w,i/w|0,1,1);}},[2,2]);
const skinTex = tex(16,16,(g,w,h)=>{for(let i=0;i<w*h;i++){const v=228+Math.random()*27|0;g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i%w,i/w|0,1,1);}});
const deckTex = tex(64,64,(g,w,h)=>{for(let y=0;y<h;y+=8){const v=150+Math.random()*40|0;g.fillStyle=`rgb(${v+40},${v+10},${v-30})`;g.fillRect(0,y,w,8);g.fillStyle='rgba(60,40,20,.7)';g.fillRect(0,y+7,w,1);g.fillRect((Math.random()*w)|0,y,1,7);}noise(g,w,h,.15);},[10,10]);
const seaTex = tex(64,64,(g,w,h)=>{g.fillStyle='#4f7fa8';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.fillStyle=Math.random()<.5?'#6f9cc2':'#9cc0dc';g.fillRect(Math.random()*w|0,Math.random()*h|0,3+Math.random()*4|0,1);}},[60,60]);
const mixerTex = tex(128,96,(g,w,h)=>{
  g.fillStyle='#1d1d22';g.fillRect(0,0,w,h);
  for(let c=0;c<4;c++){const x=14+c*30;
    for(let k=0;k<3;k++){g.fillStyle='#0c0c0f';g.fillRect(x,6+k*12,10,8);}
    g.fillStyle='#000';g.fillRect(x+4,52,2,34);
    for(let s=0;s<6;s++){g.fillStyle='#55555c';g.fillRect(x+8,54+s*6,4,1);}
    g.fillStyle=['#ff5a3c','#3c8cff','#ff5a3c','#ffa23c'][c];g.fillRect(x,44,10,3);}
  g.fillStyle='#9a9aa2';g.font='8px monospace';g.fillText('MIX-4',w-34,h-4);
  noise(g,w,h,.12);});
const jogTex = tex(64,64,(g,w,h)=>{g.fillStyle='#16161a';g.fillRect(0,0,w,h);g.strokeStyle='#3a3a42';for(let r=8;r<32;r+=5){g.beginPath();g.arc(32,32,r,0,7);g.stroke();}
  g.fillStyle='#c8c8d0';g.fillRect(30,2,4,14);g.fillStyle='#ff5fc8';g.beginPath();g.arc(32,32,6,0,7);g.fill();});
const skyTex = tex(4,128,(g,w,h)=>{const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#7fa7cf');gr.addColorStop(.45,'#c9dcec');gr.addColorStop(.55,'#f2e2d0');gr.addColorStop(1,'#e8d6c4');g.fillStyle=gr;g.fillRect(0,0,w,h);});

/* ---------- materials ---------- */
const lam = (color,opt={})=>new T.MeshLambertMaterial(Object.assign({color,flatShading:true},opt));
const M = {
  skin: lam(0xc98a5e,{map:skinTex}), hair: lam(0x1c1412), top: lam(0xe0609e,{map:fabricTex}),
  silver: new T.MeshPhongMaterial({color:0xd8dbe2,flatShading:true,shininess:90,specular:0xffffff}),
  dark: lam(0x222228), black: lam(0x0e0e12), lips: lam(0x8a2f2c), nail: lam(0xf3f0f2),
  glass: new T.MeshPhongMaterial({color:0x1a1622,flatShading:true,shininess:120,specular:0xb08fff,transparent:true,opacity:.88}),
  white: lam(0xf1ede6), brow: lam(0x241612)
};

/* ---------- lights ---------- */
scene.add(new T.HemisphereLight(0xdfe9ff,0x8a6a4a,1.15));
const sun = new T.DirectionalLight(0xffe2bf,2.1); sun.position.set(-3,5,4); scene.add(sun);
const rim = new T.DirectionalLight(0xff9ad8,.9); rim.position.set(3,2,-3); scene.add(rim);

/* ---------- yacht set ---------- */
const sky = new T.Mesh(new T.SphereGeometry(80,12,8),new T.MeshBasicMaterial({map:skyTex,side:T.BackSide,fog:false})); scene.add(sky);
const sea = new T.Mesh(new T.PlaneGeometry(400,400),new T.MeshBasicMaterial({map:seaTex})); sea.rotation.x=-Math.PI/2; sea.position.y=-1.4; scene.add(sea);
const deck = new T.Mesh(new T.BoxGeometry(14,.2,10),lam(0xffffff,{map:deckTex})); deck.position.set(0,-.1,-1); scene.add(deck);
const box=(w,h,d,m,x,y,z,p=scene)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o;};
// railing
for(let x=-6.5;x<=6.5;x+=0.9) box(.04,1,.04,M.silver,x,.5,-5.8);
box(13.2,.05,.05,M.silver,0,1,-5.8); box(13.2,.03,.03,M.silver,0,.6,-5.8);
for(const s of[-1,1]){for(let z=-5.5;z<=2;z+=0.9) box(.04,1,.04,M.silver,s*6.6,.5,z); box(.05,.05,7.6,M.silver,s*6.6,1,-1.8);}
// lounge cushions + canopy
box(4.2,.45,1,M.white,-1.4,.22,-4.6); box(4.2,.5,.25,M.white,-1.4,.6,-5.05);
box(2.4,.45,1,M.white,3.6,.22,-4.6);
const roof = box(12,.15,6,lam(0xe9e4dc),0,3.1,-2.8);
for(const x of[-4,-1.3,1.3,4]){const d=new T.Mesh(new T.CircleGeometry(.16,8),new T.MeshBasicMaterial({color:0xfff8e8}));d.rotation.x=Math.PI/2;d.position.set(x,3.02,-1.8);scene.add(d);}
for(const x of[-5.6,5.6]){const p=box(.5,3.1,.3,lam(0xe9e4dc),x,1.55,.2);p.rotation.z=x>0?-.12:.12;}

/* ---------- DJ booth ---------- */
box(2.1,1.0,.62,M.black,0,.5,.4);
const mixer = box(.62,.08,.44,M.dark,0,1.04,.36);
const mixTop = new T.Mesh(new T.PlaneGeometry(.6,.42),lam(0xffffff,{map:mixerTex})); mixTop.rotation.x=-Math.PI/2; mixTop.position.set(0,1.081,.36); scene.add(mixTop);
const CH = [-.21,-.07,.07,.21].map(x=>x*.95);
const knobs=[], faders=[];
CH.forEach(x=>{for(let k=0;k<3;k++){const kn=new T.Mesh(new T.CylinderGeometry(.016,.018,.03,6),M.black);kn.position.set(x,1.1,.19+k*.055);scene.add(kn);
  const tick=box(.004,.032,.012,M.white,0,0,.012,kn);knobs.push(kn);}
  const f=box(.03,.022,.016,M.white,x+.006,1.096,.48);faders.push(f);});
const decks=[];
for(const s of[-1,1]){const b=box(.46,.06,.46,M.dark,s*.62,1.03,.38);
  const p=new T.Mesh(new T.CylinderGeometry(.15,.15,.02,16),[M.silver,new T.MeshLambertMaterial({map:jogTex}),M.silver]);p.position.set(s*.62,1.07,.4);scene.add(p);decks.push(p);
  for(let i=0;i<3;i++) box(.05,.012,.03,lam(i?0x2a2a30:0xff5a3c),s*.62+s*-.14+i*.06*s*-0,1.065,.2+i*.0,scene).position.x=s*.62-.14+i*.07;}

/* ---------- character ---------- */
const body = new T.Group(); scene.add(body);
const chest = new T.Group(); chest.position.set(0,1.0,0); body.add(chest);
const add=(geo,m,x,y,z,p,s)=>{const o=new T.Mesh(geo,m);o.position.set(x,y,z);if(s)o.scale.set(...s);p.add(o);return o;};
// torso: pink tank + skin upper chest
add(new T.CylinderGeometry(.165,.14,.36,7),M.top,0,.16,0,chest,[1,1,.68]);
add(new T.CylinderGeometry(.15,.165,.1,7),M.skin,0,.39,0,chest,[1,1,.66]);
add(new T.CylinderGeometry(.168,.15,.06,7),M.top,0,.31,.0,chest,[1.02,1,.72]);
for(const s of[-1,1]){const st=box(.025,.12,.02,M.top,s*.1,.4,.06,chest);st.rotation.z=s*.12;}
add(new T.CylinderGeometry(.13,.12,.25,7),M.top,0,-.12,0,chest,[1,1,.75]);
const neck = add(new T.CylinderGeometry(.045,.055,.1,6),M.skin,0,.48,0,chest);
const shoulders=[];
for(const s of[-1,1]){add(new T.IcosahedronGeometry(.062,0),M.skin,s*.19,.4,0,chest);const a=new T.Object3D();a.position.set(s*.2,.4,.01);chest.add(a);shoulders.push(a);}
// necklace
const necklace=new T.Group();chest.add(necklace);
for(let i=0;i<=12;i++){const t=i/12,a=Math.PI*(.15+.7*t);const b=new T.Mesh(new T.OctahedronGeometry(.011,0),M.silver);b.position.set(Math.cos(a)*.085,.42-Math.sin(a)*.07,.1+Math.sin(a)*.012);necklace.add(b);}
const pend=new T.Mesh(new T.OctahedronGeometry(.024,0),M.silver);pend.scale.set(1,1.5,.6);pend.position.set(0,.33,.115);necklace.add(pend);
for(let i=0;i<4;i++){const d=new T.Mesh(new T.OctahedronGeometry(.009,0),M.silver);d.position.set(0,.36-i*.012,.112);necklace.add(d);}
// head
const head = new T.Group(); head.position.set(0,.56,0); head.scale.setScalar(.93); chest.add(head);
add(new T.IcosahedronGeometry(.1,1),M.skin,0,.09,0,head,[.86,1.16,.96]);
add(new T.ConeGeometry(.045,.07,4),M.skin,0,.005,.035,head,[1.1,1,.9]).rotation.x=Math.PI; // jaw
const nose=add(new T.ConeGeometry(.014,.045,3),M.skin,0,.075,.098,head);nose.rotation.x=-.35;
add(new T.BoxGeometry(.045,.013,.012),M.lips,0,.025,.085,head);
add(new T.BoxGeometry(.04,.008,.012),M.lips,0,.014,.083,head);
for(const s of[-1,1]){const lens=add(new T.BoxGeometry(.068,.04,.012),M.glass,s*.04,.11,.094,head);lens.rotation.y=s*.22;
  add(new T.BoxGeometry(.06,.006,.01),M.silver,s*.04,.132,.096,head).rotation.y=s*.22;
  add(new T.BoxGeometry(.008,.008,.08),M.silver,s*.078,.122,.05,head);}
add(new T.BoxGeometry(.02,.008,.01),M.silver,0,.118,.1,head);
// hair: cap, back curtain, front strands
const hair=new T.Group();head.add(hair);
add(new T.IcosahedronGeometry(.106,1),M.hair,0,.1,-.032,hair,[.95,1.14,.98]);
add(new T.SphereGeometry(.104,8,4,0,Math.PI*2,0,Math.PI*.3),M.hair,0,.115,.004,hair,[.9,1.15,1]);
const back=add(new T.BoxGeometry(.24,.5,.05),M.hair,0,-.17,-.075,hair);back.rotation.x=.12;
for(const s of[-1,1]){const st=add(new T.BoxGeometry(.04,.36,.035),M.hair,s*.105,-.1,.02,hair);st.rotation.z=s*.06;st.rotation.x=-.1;}
// headphones
const band=add(new T.TorusGeometry(.12,.012,4,10,Math.PI),M.silver,0,.1,0,head);band.scale.set(1,1.15,1);
for(const s of[-1,1]){const cup=add(new T.CylinderGeometry(.048,.048,.035,8),M.silver,s*.115,.08,0,head);cup.rotation.z=Math.PI/2;
  add(new T.CylinderGeometry(.034,.034,.037,8),M.dark,s*.118,.08,0,head).rotation.z=Math.PI/2;}
const cable=add(new T.CylinderGeometry(.004,.004,.55,3),M.black,.12,-.25,.02,head);cable.rotation.z=-.05;

// arms (world-space two-bone IK)
const limbGeo=(r1,r2)=>{const g=new T.CylinderGeometry(r2,r1,1,6);g.translate(0,.5,0);return g;};
const UP=V(0,1,0), LA=.27, LB=.27;
function makeArm(){const u=new T.Mesh(limbGeo(.042,.034),M.skin),f=new T.Mesh(limbGeo(.034,.026),M.skin),el=new T.Mesh(new T.IcosahedronGeometry(.034,0),M.skin);
  scene.add(u,f,el);const hand=new T.Group();scene.add(hand);
  add(new T.BoxGeometry(.07,.024,.08),M.skin,0,0,.04,hand);
  const bl=[];for(let i=0;i<3;i++){const b=add(new T.TorusGeometry(.033,.005,3,8),M.silver,0,0,-.012-i*.012,hand);bl.push(b);}
  const fingers=[];[-.027,-.009,.009,.027].forEach((x,i)=>{const fg=new T.Group();fg.position.set(x,0,.08);hand.add(fg);
    add(new T.BoxGeometry(.015,.015,.06),M.skin,0,0,.03,fg);add(new T.ConeGeometry(.007,.035,3),M.nail,0,-.002,.075,fg).rotation.x=Math.PI/2;
    fg.rotation.x=.55+i*.04;fingers.push(fg);});
  const th=new T.Group();hand.add(th);add(new T.BoxGeometry(.016,.016,.05),M.skin,0,0,.025,th);add(new T.ConeGeometry(.007,.03,3),M.nail,0,0,.06,th).rotation.x=Math.PI/2;
  return {u,f,el,hand,fingers,th};}
const arms=[makeArm(),makeArm()];
const place=(m,a,b)=>{const d=b.clone().sub(a),L=d.length();m.position.copy(a);m.quaternion.setFromUnitVectors(UP,d.normalize());m.scale.set(1,L,1);};
function solve(arm,side,S,Tg,pole){
  const d=Tg.clone().sub(S);let L=Math.min(Math.max(d.length(),.08),LA+LB-.002);const dir=d.normalize();
  const cosA=(LA*LA+L*L-LB*LB)/(2*LA*L),sinA=Math.sqrt(Math.max(0,1-cosA*cosA));
  const perp=pole.clone().sub(dir.clone().multiplyScalar(pole.dot(dir))).normalize();
  const E=S.clone().addScaledVector(dir,LA*cosA).addScaledVector(perp,LA*sinA), W=S.clone().addScaledVector(dir,L);
  place(arm.u,S,E);place(arm.f,E,W);arm.el.position.copy(E);
  const fw=W.clone().sub(E);fw.y*=.25;fw.normalize();
  arm.hand.position.copy(W);arm.hand.lookAt(W.clone().add(fw));arm.hand.rotateX(.28);arm.hand.rotateZ(-side*.12);
  arm.th.position.set(-side*.04,-.006,.03);arm.th.rotation.set(.5,-side*.6,0);
}

/* ---------- choreography ---------- */
const BPM=122, BEAT=60/BPM;
const knobPos=i=>knobs[i].position;
const sm=t=>t*t*(3-2*t);
// left hand: hops between knobs (channels 0/1), right hand: rides fader on channel 2 and taps channel 3 knobs
const LSEQ=[0,4,1,3,7,4], RSEQ=['f','f',11,'f',10,'f'];
function seqTarget(seq,t,side){
  const per=BEAT*2, n=seq.length, k=Math.floor(t/per), ph=(t%per)/per;
  const at=i=>{const s=seq[((i%n)+n)%n];if(s==='f'){const f=faders[2];return {p:V(f.position.x,1.135,f.position.z-.085),fader:true};}
    const p=knobPos(s);return {p:V(p.x,1.14,p.z-.085),knob:s};};
  const a=at(k),b=at(k+1);const m=sm(Math.min(1,Math.max(0,(ph-.6)/.4)));
  const p=a.p.clone().lerp(b.p,m);p.y+=Math.sin(m*Math.PI)*.06;
  return {p,cur:m<.5?a:b,ph,m};
}

/* ---------- camera shots ---------- */
const SHOTS=[{p:V(.15,1.45,1.9),l:V(0,1.32,.15)},{p:V(-.35,1.62,.95),l:V(0,1.56,0)},{p:V(.55,1.36,1.15),l:V(.1,1.12,.3)},{p:V(-1.1,1.5,1.6),l:V(0,1.3,.1)}];
let shot=0, shotT=0, camP=SHOTS[0].p.clone(), camL=SHOTS[0].l.clone(), drag=null, yawOff=0, pitchOff=0, lastDrag=-99;
document.getElementById('shot').onclick=()=>{shot=(shot+1)%SHOTS.length;shotT=0;};
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yo:yawOff,po:pitchOff};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yawOff=drag.yo-(e.clientX-drag.x)*.006;pitchOff=Math.max(-.4,Math.min(.5,drag.po+(e.clientY-drag.y)*.004));lastDrag=clock.elapsedTime;});
canvas.addEventListener('pointerup',()=>drag=null);

/* ---------- audio: a small synth house loop ---------- */
let ac=null, master, playing=false, nextT=0, step=0, kickPulse=0;
const playBtn=document.getElementById('play');
function startAudio(){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);nextT=ac.currentTime+.05;}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(master);o.start(t);o.stop(t+.32);}
let nb=null;function hat(t,v){if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.1,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(f).connect(g).connect(master);s.start(t);}
function tone(t,freq,dur,type,v,cut){const o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;f.Q.value=6;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+dur+.02);}
const BASS=[45,0,45,57,0,45,0,52, 43,0,43,55,0,43,0,50], CH_=[[57,60,64],[55,59,62]];
const hz=m=>440*Math.pow(2,(m-69)/12);
function schedule(){const s16=BEAT/4;while(nextT<ac.currentTime+.12){const i=step%16,bar=Math.floor(step/16)%2;
  if(i%4===0)kick(nextT); if(i%4===2)hat(nextT,.35); else if(i%2)hat(nextT,.08);
  const b=BASS[(bar*8+(i>>1))%16]; if(i%2===1&&b)tone(nextT,hz(b),.18,'sawtooth',.22,600+Math.sin(step*.05)*400);
  if(i===6||i===14)CH_[bar].forEach(n=>tone(nextT,hz(n),.22,'square',.05,1800));
  nextT+=s16;step++;}}
playBtn.onclick=()=>{if(!ac)startAudio();if(playing){ac.suspend();playing=false;playBtn.textContent='הפעילי ביט';}else{ac.resume();playing=true;playBtn.textContent='עצרי ביט';}};

/* ---------- controls ---------- */
const bind=(id,m)=>document.getElementById(id).addEventListener('input',e=>m.color.set(e.target.value));
bind('cSkin',M.skin);bind('cHair',M.hair);bind('cTop',M.top);
document.getElementById('pix').addEventListener('input',e=>{pixel=+e.target.value;resize();});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(Math.max(1,Math.round(w/pixel)),Math.max(1,Math.round(h/pixel)),false);cam.aspect=w/h;cam.fov=w/h<.8?52:38;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

/* ---------- loop ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock=new T.Clock();
const tmp=V(0,0,0);
function frame(){
  const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime;
  if(playing&&ac)schedule();
  const beatPh=(t%BEAT)/BEAT, groove=playing?1:.45;
  // body groove
  const bob=Math.pow(Math.max(0,Math.cos(beatPh*Math.PI*2)),3)*.018*groove;
  body.position.y=-bob; body.rotation.y=Math.sin(t*Math.PI/BEAT/2)*.05*groove;
  chest.rotation.x=.16+bob*1.4; chest.rotation.z=Math.sin(t*Math.PI/BEAT/2)*.025*groove;
  head.rotation.x=-.1+bob*5; head.rotation.y=Math.sin(t*.37)*.25; head.rotation.z=Math.sin(t*Math.PI/BEAT/2)*.05;
  hair.rotation.x=-bob*3;
  // hands
  const L=seqTarget(LSEQ,t,-1), R=seqTarget(RSEQ,t+BEAT,1);
  // fader rides with right hand
  if(R.cur.fader&&R.m<.15){faders[2].position.z=.44+Math.sin(R.ph*Math.PI*2)*.035;R.p.z=faders[2].position.z-.085;}
  [L,R].forEach((h,i)=>{if(h.cur.knob!==undefined&&h.m<.2){knobs[h.cur.knob].rotation.y+=dt*(i?-2:2.4);}});
  shoulders.forEach((s,i)=>{s.getWorldPosition(tmp);const side=i?1:-1;const tgt=(i?R:L).p.clone();tgt.x+=side*.02;
    solve(arms[i],side,tmp.clone(),tgt,V(side*1,-.35,-.7));
    arms[i].fingers.forEach((f,j)=>f.rotation.x=.55+j*.05+Math.max(0,Math.sin(t*9+j*1.3+i))*.18*(1-(i?R:L).m));});
  decks.forEach((d,i)=>d.rotation.y-=dt*(i?3.6:3.2));
  // camera: cut-free slow drift between shots
  if(!reduce){shotT+=dt;if(shotT>7&&t-lastDrag>6){shot=(shot+1)%SHOTS.length;shotT=0;}}
  const S=SHOTS[shot];const k=1-Math.pow(.25,dt);
  camP.lerp(S.p,k*.6);camL.lerp(S.l,k*.6);
  const off=camP.clone().sub(camL),r=off.length(),yaw=Math.atan2(off.x,off.z)+yawOff+(reduce?0:Math.sin(t*.21)*.06),pit=Math.asin(off.y/r)+pitchOff;
  cam.position.set(camL.x+Math.sin(yaw)*Math.cos(pit)*r,camL.y+Math.sin(pit)*r+(reduce?0:Math.sin(t*1.3)*.006),camL.z+Math.cos(yaw)*Math.cos(pit)*r);
  cam.lookAt(camL);
  if(t-lastDrag>6&&!drag){yawOff*=.985;pitchOff*=.985;}
  document.getElementById('bpm').style.opacity=playing?(beatPh<.15?1:.55):.55;
  renderer.render(scene,cam);requestAnimationFrame(frame);
}
frame();
})();
</script>
