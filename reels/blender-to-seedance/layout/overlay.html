<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#fff}
  #c{position:relative;width:1080px;height:1920px;background:#fff;overflow:hidden;font-family:'Inter',sans-serif;font-weight:500;color:#000;-webkit-font-smoothing:antialiased}
  .lbl{position:absolute;font-size:27.6px;line-height:1;letter-spacing:-0.35px;white-space:nowrap}
  .thumb{position:absolute;top:114px;width:100px;height:184px;border-radius:8px;background:#b1b6b2 center/cover no-repeat;overflow:hidden}
  .ph{position:absolute;left:0;width:1080px;background:#f1f1ef;display:flex;align-items:center;justify-content:center;font-size:22px;color:#9a9a96;letter-spacing:.2px}
  .logo{position:absolute}
</style></head><body><div id="c">
  <div class="lbl" id="ref" style="left:368px;top:75px">Ref.</div>
  <div id="thumbs"></div>
  <div class="lbl" id="l1" style="left:46px;top:331px"></div>
  <div class="lbl" id="l2" style="left:46px;top:1638px">Blender</div>
  <div id="ph"></div>
  <!-- tool marks: ElevenLabs (where Seedance 2.5 runs), Blender, Claude -->
  <div class="logo" style="left:728px;top:1641px;width:86px;height:86px;border-radius:15px;background:#000">
    <svg viewBox="0 0 24 24" width="40" height="40" style="position:absolute;left:23px;top:23px"><path fill="#fff" d="M4.6035 0v24h4.9317V0zm9.8613 0v24h4.9317V0z"/></svg>
  </div>
  <div class="logo" id="blender" style="left:848px;top:1649px;width:70px;height:70px"></div>
  <div class="logo" id="claude" style="left:962px;top:1651px;width:66px;height:66px"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const cfg = JSON.parse(q.get('cfg') || '{}');
  document.getElementById('l1').textContent = cfg.label || 'seedance 2.5';
  const T = document.getElementById('thumbs');
  for (let i = 0; i < 6; i++) {
    const d = document.createElement('div'); d.className = 'thumb'; d.style.left = (367 + 116 * i) + 'px';
    if (cfg.thumbs && cfg.thumbs[i]) d.style.backgroundImage = `url("${cfg.thumbs[i]}")`;
    T.appendChild(d);
  }
  if (cfg.placeholder) {
    const p = document.createElement('div'); p.className = 'ph'; p.style.top = '376px'; p.style.height = '615px'; p.textContent = cfg.placeholder;
    document.getElementById('ph').appendChild(p);
  }
  const svg = (id, path, color, extra = '') => fetch(path).then(r => r.text()).then(t => {
    const d = t.match(/ d="([^"]+)"/)[1];
    document.getElementById(id).innerHTML = `<svg viewBox="0 0 24 24" width="100%" height="100%">${extra}<path fill="${color}" d="${d}"/></svg>`;
  });
  Promise.all([
    svg('blender', 'logos/blender.svg', '#EA7600', '<circle cx="15.75" cy="13.4" r="4.6" fill="#fff"/>'),
    svg('claude', 'logos/claude.svg', '#D97757'),
    document.fonts.ready
  ]).then(() => {
    // the simple-icons Blender mark draws the pupil in the body colour; tint it blue like the real logo
    document.querySelector('#blender svg').insertAdjacentHTML('beforeend', '<circle cx="15.75" cy="13.4" r="2.55" fill="#265787"/>');
    document.body.setAttribute('data-ready', '1');
  });
</script></body></html>
