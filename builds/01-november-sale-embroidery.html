<title>November Sale Embroidery</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
/* Layout: a fixed 16:9 film frame, centred. Everything in it is a macro shot of black cloth in a wooden hoop; controls float over the bottom edge and fade away. */
:root{
  color-scheme:dark;
  --void:#040405;
  --thread-yellow:#ffd60a;
  --thread-red:#ff2a2a;
  --thread-cream:#efe6d2;
  --label:#d6ccb8;
  --display:"AntonLocal","Anton",Impact,"Arial Narrow",sans-serif;
  --utility:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@font-face{font-family:"AntonLocal";src:url("../assets/anton.ttf") format("truetype");font-display:swap}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--label);overflow:hidden;font-family:var(--utility)}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--void)}
#stage{position:relative;overflow:hidden;background:var(--void);cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none}
#stage.quiet{cursor:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));color:var(--thread-cream)}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;align-items:center;justify-content:flex-end;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;transition:opacity .45s}
.bar.off{opacity:0}
.bar button{pointer-events:auto}
.bar.off button{pointer-events:none}
button{font:400 13px/1 var(--display);letter-spacing:.14em;color:var(--void);background:var(--thread-yellow);border:0;border-radius:3px;
  padding:9px 13px 8px;cursor:pointer;box-shadow:0 2px 0 #000,0 0 0 1px #0009}
button.alt{background:#0b0b0dcc;color:var(--thread-cream);box-shadow:0 0 0 1px #efe6d299}
button:hover{filter:brightness(1.15)}
button:focus-visible{outline:2px solid var(--thread-red);outline-offset:3px}
#hint,#credit{position:absolute;pointer-events:none;opacity:0;transition:opacity .9s;text-shadow:0 1px 3px #000,0 0 12px #000}
#hint{left:50%;top:13.5%;transform:translateX(-50%);font:400 clamp(11px,1.5vw,19px)/1 var(--display);letter-spacing:.24em;color:var(--thread-cream);white-space:nowrap}
#credit{left:50%;transform:translateX(-50%);bottom:12.5%;white-space:nowrap;font-size:clamp(9px,.85vw,11px);letter-spacing:.1em;text-transform:uppercase}
#credit b{color:var(--thread-yellow);font-weight:600}
#hint.on{opacity:.8}
#credit.on{opacity:.75}
</style>

<div id="wrap">
  <div id="stage" aria-label="A macro film of embroidery on black cloth: November Sale, they're playing us. Click the cloth to stitch a price finding.">
    <canvas id="gl"></canvas>
    <div id="msg" hidden></div>
    <div id="hint">CLICK THE CLOTH TO STITCH A FINDING</div>
    <div id="credit"><b>Shelly Or Gisser</b> · Israeli sale index · prices as of 12 Nov 2026</div>
    <div class="bar off" id="bar">
      <button id="bFilm" type="button">PLAY FILM</button>
      <button id="bReset" type="button" class="alt">RESTART</button>
      <button id="bSpeed" type="button" class="alt">SPEED 1X</button>
      <button id="bFull" type="button" class="alt">FULL SCREEN</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id), wrap=$("wrap"), stage=$("stage"), canvas=$("gl");
function fail(t){ const m=$("msg"); m.textContent=t; m.hidden=false; }
if(!window.THREE){ fail("The 3D engine did not load. Check the connection and reload."); return; }
const T=THREE; let renderer;
try{ renderer=new T.WebGLRenderer({canvas,antialias:false,alpha:false,powerPreference:"high-performance"}); }
catch(e){ fail("This piece needs WebGL, and this browser has it switched off."); return; }
if(!renderer.capabilities.isWebGL2){ fail("This piece needs WebGL 2. Try a current Chrome, Edge, Safari or Firefox."); return; }
const gl=renderer.getContext();
const HDR=!!(gl.getExtension("EXT_color_buffer_float")||gl.getExtension("EXT_color_buffer_half_float"));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- the design, in millimetres (x right, y down, origin at the centre of the hoop) ---------- */
const FONT='"AntonLocal","Anton",Impact,"Arial Narrow",sans-serif';
const D={W:420,H:250}, HOOP={hx:184,hy:99.5,r:60}, PITCH=0.85, ASPECT=16/9, WIDE=2*(HOOP.hx+9.5)+14;
const PAL=[[1.0,0.60,0.012],[0.82,0.016,0.02],[0.84,0.76,0.60]];           // yellow, red, cream (linear)
const FINDINGS=[
  ["96%","OF PRICES DIDN'T","MOVE ON 11.11"],
  ["7 IN 10","CROSSED-OUT PRICES","ARE INFLATED"],
  ["10 OF 107","STORES CUT PRICES","ON 11.11"],
  ["30% NOT 58%","THE REAL DISCOUNT","VS THE ONE ON THE TAG"],
  ["98.91","SALE INDEX TODAY","BEFORE THE SALES: 100"],
  ["48","STORES RAISED","A PRICE"]
];
const SPOTS=[[-130,-55],[130,-55],[-130,0],[130,0],[-130,55],[130,55]];
let seed=11; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;

/* ---------- letters become rows of fill stitches ---------- */
const mc=document.createElement("canvas"), mx=mc.getContext("2d",{willReadFrequently:true});
let CAPR=0.72; const cw={};
function initFont(){ mc.width=mc.height=8; mx.font=`200px ${FONT}`; const m=mx.measureText("H"); CAPR=(m.actualBoundingBoxAscent||144)/200; for(const k in cw) delete cw[k]; }
function charW(ch){ if(cw[ch]==null){ mx.font=`200px ${FONT}`; cw[ch]=mx.measureText(ch).width/200; } return cw[ch]; }
function textW(str,cap,tk){ const em=cap/CAPR; let w=0; for(const c of str) w+=charW(c)*em; return w+tk*em*(str.length-1); }
function eachGlyph(str,cx,cy,cap,o,fn){
  const tkK=o.track==null?0.035:o.track, em=cap/CAPR, tk=tkK*em, rot=o.rot||0, cr=Math.cos(rot), sr=Math.sin(rot);
  let x=-textW(str,cap,tkK)/2;
  for(const ch of str){ const w=charW(ch)*em; if(ch!==" "){ const lx=x+w/2; fn(ch,cx+lx*cr,cy+lx*sr,em,rot); } x+=w+tk; }
}
function glyphStitches(out,ch,gx,gy,em,cap,rot,o,ci){
  const ppm=clamp(3.3/o.gap,5,44), size=em*ppm, M=Math.ceil(size*1.55)+12;
  mc.width=M; mc.height=M;
  mx.translate(M/2,M/2); mx.rotate(-o.th); mx.font=`${size}px ${FONT}`; mx.textAlign="center"; mx.textBaseline="alphabetic"; mx.fillStyle="#fff";
  mx.fillText(ch,0,cap*ppm/2);
  const d=mx.getImageData(0,0,M,M).data, ct=Math.cos(o.th), st=Math.sin(o.th), cr=Math.cos(rot), sr=Math.sin(rot);
  const gp=o.gap*ppm, mL=o.maxLen*ppm, minRun=0.45*ppm, ov=0.45*ppm; let row=0;
  for(let yf=gp/2; yf<M; yf+=gp, row++){
    const y=Math.min(M-1,Math.round(yf)), base=y*M*4+3, segs=[]; let x=0;
    while(x<M){
      while(x<M && d[base+x*4]<110) x++;
      if(x>=M) break;
      const a=x; while(x<M && d[base+x*4]>=110) x++;
      const b=x-1; if(b-a<minRun) continue;
      const cuts=[a]; let s=a, first=mL*(0.45+0.55*rnd());
      while(b-s>first+mL*0.3){ s+=first; cuts.push(s); first=mL; }
      cuts.push(b);
      for(let k=0;k<cuts.length-1;k++) segs.push([cuts[k]-(k?ov:0), cuts[k+1]+(k<cuts.length-2?ov:0)]);
    }
    if(row%2) segs.reverse();
    for(const sg of segs){
      const X1=((row%2?sg[1]:sg[0])-M/2)/ppm, X2=((row%2?sg[0]:sg[1])-M/2)/ppm, Y=(yf-M/2)/ppm, j=()=>(rnd()-.5)*0.2;
      const x1=X1*ct-Y*st+j(), y1=X1*st+Y*ct+j(), x2=X2*ct-Y*st+j(), y2=X2*st+Y*ct+j();
      out.push([gx+x1*cr-y1*sr, gy+x1*sr+y1*cr, gx+x2*cr-y2*sr, gy+x2*sr+y2*cr, o.w, ci]);
    }
  }
}
function textStitches(out,str,cx,cy,cap,ci,o){ eachGlyph(str,cx,cy,cap,o,(ch,gx,gy,em,rot)=>glyphStitches(out,ch,gx,gy,em,cap,rot,o,ci)); }
function lineStitches(out,pts,L,cover,w,ci){
  let carry=0;
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], len=Math.hypot(b[0]-a[0],b[1]-a[1]); if(len<0.01) continue;
    const ux=(b[0]-a[0])/len, uy=(b[1]-a[1])/len; let t=carry;
    while(t<len){ const e=Math.min(len,t+L*cover); if(e-t>w*0.9) out.push([a[0]+ux*t,a[1]+uy*t,a[0]+ux*e,a[1]+uy*e,w,ci]); t+=L; }
    carry=t-len;
  }
}

/* ---------- chalk transfer lines on the cloth ---------- */
const CK=7, chalk=document.createElement("canvas"); chalk.width=D.W*CK; chalk.height=D.H*CK; const cx2=chalk.getContext("2d");
const cpx=(x,y)=>[(x+D.W/2)*CK,(y+D.H/2)*CK];
function chalkText(str,cx,cy,cap,o){
  eachGlyph(str,cx,cy,cap,o,(ch,gx,gy,em,rot)=>{
    const p=cpx(gx,gy); cx2.save(); cx2.translate(p[0],p[1]); cx2.rotate(rot); cx2.font=`${em*CK}px ${FONT}`; cx2.textAlign="center"; cx2.textBaseline="alphabetic";
    cx2.lineJoin="round"; cx2.strokeStyle="rgba(255,255,255,.6)"; cx2.lineWidth=0.2*CK; cx2.strokeText(ch,0,cap*CK/2); cx2.restore();
  });
}
function chalkLine(pts,a,w){ cx2.strokeStyle=`rgba(255,255,255,${a})`; cx2.lineWidth=(w||0.16)*CK; cx2.lineCap="round"; cx2.beginPath();
  pts.forEach((p,i)=>{ const q=cpx(p[0],p[1]); i?cx2.lineTo(q[0],q[1]):cx2.moveTo(q[0],q[1]); }); cx2.stroke(); }

/* ---------- shaders ---------- */
const COMMON=`
uniform vec3 uCam; uniform vec3 uFwd; uniform vec3 uL; uniform vec3 uLCol; uniform vec3 uSky; uniform vec3 uGnd;
uniform sampler2D tShadow; uniform mat4 uShadowMat; uniform float uPen; uniform float uSBias; uniform vec4 uFoc;
float h11(float p){ p=fract(p*0.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*0.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),f.x), mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),f.x), f.y); }
float ign(vec2 p){ return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715)))); }
float shadowAt(vec3 W){
  vec4 sc=uShadowMat*vec4(W,1.); vec3 p=sc.xyz/sc.w*0.5+0.5;
  if(p.x<0.||p.x>1.||p.y<0.||p.y>1.||p.z>1.) return 1.;
  float rot=ign(gl_FragCoord.xy)*6.2832, acc=0.;
  for(int i=0;i<10;i++){ float fi=float(i); float r=sqrt((fi+0.5)/10.); float a=fi*2.39996+rot;
    acc+=step(p.z-uSBias, texture2D(tShadow,p.xy+vec2(cos(a),sin(a))*r*uPen).r); }
  return acc/10.;
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.,1.); }
vec4 finish(vec3 lin, vec3 W){
  float z=max(dot(W-uCam,uFwd),0.5); float coc=uFoc.y*(1./uFoc.x-1./z);
  float a=clamp(coc/uFoc.z,-1.,1.)*0.5+0.5;
  if(uFoc.w>0.5) lin=pow(aces(lin),vec3(1./2.2));
  return vec4(lin,a);
}`;
const STITCH_VS=`
attribute vec4 iA; attribute vec4 iB; attribute vec3 iC; uniform float uProg;
varying vec3 vW; varying vec3 vN; varying vec3 vT; varying vec3 vCol; varying vec3 vUV; varying float vSeed;
float zAt(float s,float L,float zone,float w,float open){
  float e=clamp(min(s,L-s)/zone,0.,1.); if(open>0.5&&s>L*0.5) e=1.;
  float ee=e*e*(3.-2.*e); float rh=0.34*w*(0.45+0.55*ee);
  return rh*(-2.3+3.3*ee)+0.012*L*sin(3.14159*clamp(s/L,0.,1.));
}
void main(){
  vec2 a=iA.xy, b=iA.zw; float w=iB.x; float grow=clamp(uProg-iB.z,0.,1.);
  vec2 d=b-a; float len=max(length(d),0.001); vec2 t=d/len; vec2 n=vec2(-t.y,t.x);
  float L=max(len*grow,0.05); float open=step(grow,0.999);
  float zone=min(0.9*w,0.45*L); float px=position.x; float s;
  if(px<1.) s=px*zone; else if(px<2.) s=zone+(px-1.)*(L-2.*zone); else s=L-(3.-px)*zone;
  float e=clamp(min(s,L-s)/zone,0.,1.); if(open>0.5&&s>L*0.5) e=1.;
  float ee=e*e*(3.-2.*e);
  float rw=0.5*w*(0.72+0.28*ee), rh=0.34*w*(0.45+0.55*ee);
  float zc=iB.w+zAt(s,L,zone,w,open);
  float dz=(zAt(s+0.02,L,zone,w,open)-zAt(s-0.02,L,zone,w,open))/0.04;
  vec3 T3=normalize(vec3(t,dz)); vec3 S3=vec3(n,0.); vec3 U3=cross(T3,S3);
  float c=position.y, sn=position.z;
  vec3 P=vec3(a+t*s+n*(c*rw), zc+sn*rh);
  vW=P; vN=normalize(S3*c*rh+U3*sn*rw); vT=T3; vCol=iC; vUV=vec3(s,uv.x,ee); vSeed=iB.y;
  gl_Position=projectionMatrix*viewMatrix*vec4(P,1.);
}`;
const WORK_VS=`
uniform vec3 uP0; uniform vec3 uP1; uniform vec3 uP2; uniform vec3 uP3; uniform float uLen; uniform float uRad; uniform vec3 uTCol;
varying vec3 vW; varying vec3 vN; varying vec3 vT; varying vec3 vCol; varying vec3 vUV; varying float vSeed;
void main(){
  float t=position.x*uLen, m=1.-t;
  vec3 C=m*m*m*uP0+3.*m*m*t*uP1+3.*m*t*t*uP2+t*t*t*uP3;
  vec3 Tn=normalize(3.*m*m*(uP1-uP0)+6.*m*t*(uP2-uP1)+3.*t*t*(uP3-uP2));
  vec3 S=normalize(cross(vec3(0.,0.,1.),Tn)); vec3 U=cross(Tn,S);
  vec3 R=S*position.y+U*position.z; vec3 P=C+R*uRad*step(0.002,uLen);
  vW=P; vN=R; vT=Tn; vCol=uTCol; vUV=vec3(t*420.,uv.x,1.); vSeed=0.37;
  gl_Position=projectionMatrix*viewMatrix*vec4(P,1.);
}`;
const THREAD_FS=COMMON+`
varying vec3 vW; varying vec3 vN; varying vec3 vT; varying vec3 vCol; varying vec3 vUV; varying float vSeed;
void main(){
  vec3 N=normalize(vN), Tn=normalize(vT); vec3 B=normalize(cross(N,Tn)); vec3 Lc=uLCol*0.46;
  float s=vUV.x, ee=vUV.z;
  float mini=smoothstep(0.3,1.3,fwidth(vUV.y));
  float ph=vUV.y/6.2832*5.+s*0.5+vSeed*9.;
  float fd=(1.-smoothstep(0.12,0.55,fwidth(ph)))*(1.-mini);
  float cph=cos(6.2832*ph), sph=sin(6.2832*ph);
  float fib=vn(vec2(ph*11.,s*2.6+vSeed*40.));
  vec3 Nb=normalize(mix(N,vec3(0.,0.,1.),mini*0.75));
  vec3 N2=normalize(Nb+B*sph*0.5*fd+B*(fib-0.5)*0.3*fd);
  vec3 alb=vCol*(0.88+0.12*cph*fd)*(0.88+0.24*fib*fd);
  vec3 Tf=normalize(Tn+B*0.3);
  vec3 V=normalize(uCam-vW), H=normalize(uL+V);
  float sh=shadowAt(vW+N*0.07);
  float ndl=dot(N2,uL); float wrap=clamp((ndl+0.18)/1.18,0.,1.);
  float t1=dot(normalize(Tf+N2*0.10),H), t2=dot(normalize(Tf-N2*0.22),H);
  float sp1=pow(sqrt(max(0.,1.-t1*t1)),48.), sp2=pow(sqrt(max(0.,1.-t2*t2)),12.);
  float sm=smoothstep(-0.05,0.4,ndl);
  float ao=mix(0.35,1.,ee)*mix(mix(0.42,1.,smoothstep(0.,0.8,N.z)),0.9,mini);
  vec3 amb=mix(uGnd,uSky,N2.z*0.5+0.5)*1.6;
  vec3 col=alb*(Lc*wrap*sh+amb)*ao;
  col+=Lc*sh*sm*ao*(sp1*0.16*(1.-mini)+sp2*alb*0.7);
  col+=alb*Lc*pow(1.-max(dot(N2,V),0.),3.)*0.3*sh*ao;
  gl_FragColor=finish(col,vW);
}`;
const CLOTH_VS=`varying vec3 vW; void main(){ vW=position; gl_Position=projectionMatrix*viewMatrix*vec4(position,1.); }`;
const CLOTH_FS=COMMON+`
varying vec3 vW; uniform sampler2D tChalk; uniform vec2 uD; uniform vec3 uHoop; uniform float uPitch;
float weave(vec2 g, out float dir, out vec2 tc){
  vec2 c=floor(g), f=fract(g)-0.5; float s=mod(c.x+c.y,2.)*2.-1.;
  float nx=vn(vec2(c.x*7.31,g.y*0.33)), ny=vn(vec2(c.y*5.17+17.,g.x*0.33));
  float wx=f.x+(nx-0.5)*0.15, wy=f.y+(ny-0.5)*0.15;
  float ax=0.41+(fract(nx*7.)-0.5)*0.07, ay=0.41+(fract(ny*7.)-0.5)*0.07;
  float pw=sqrt(max(0.,1.-(wx/ax)*(wx/ax))), pf=sqrt(max(0.,1.-(wy/ay)*(wy/ay)));
  float hw=pw>0.?(0.5-0.5*s*cos(3.14159*f.y))*0.6+pw*0.4:0.;
  float hf=pf>0.?(0.5+0.5*s*cos(3.14159*f.x))*0.6+pf*0.4:0.;
  if(hw>hf){ dir=0.; tc=vec2(wx/ax,g.y); return hw; }
  dir=1.; tc=vec2(wy/ay,g.x); return hf;
}
void main(){
  vec2 g=vW.xy/uPitch; vec2 fg=fwidth(g); float det=1.-smoothstep(0.1,0.42,max(fg.x,fg.y));
  float dir,d2; vec2 tc,t2; float h=weave(g,dir,tc);
  float e=0.035; float hx=weave(g+vec2(e,0.),d2,t2), hy=weave(g+vec2(0.,e),d2,t2);
  float sg=dir<0.5?1.:-1.;
  float ridge=0.5+0.5*sin((tc.y*3.4+tc.x*0.55*sg)*6.2832);
  float fuzz=vn(vW.xy*9.)*0.6+vn(vW.xy*27.)*0.4;
  float big=vn(vW.xy*0.045)*0.6+vn(vW.xy*0.011)*0.4;
  vec3 N=normalize(vec3(-(hx-h)/e*0.34*det,-(hy-h)/e*0.34*det,1.));
  vec3 td=dir<0.5?vec3(0.,1.,0.):vec3(1.,0.,0.);
  N=normalize(N+td*(ridge-0.5)*0.35*det+vec3(vn(vW.xy*0.06)-0.5,vn(vW.yx*0.06+9.)-0.5,0.)*0.07);
  float tid=dir<0.5?floor(g.x)*1.7:floor(g.y)*2.3+50.;
  float occl=mix(0.75,smoothstep(0.02,0.55,h),det);
  vec3 alb=vec3(0.0095,0.0095,0.012)*(0.75+0.5*h11(tid))*(0.62+0.5*ridge*det)*(0.72+0.5*fuzz)*(0.8+0.4*big);
  vec2 cuv=(vW.xy+uD*0.5)/uD; float ck=texture2D(tChalk,cuv).r;
  alb+=vec3(0.13,0.13,0.125)*ck*(0.12+0.88*smoothstep(0.35,0.95,mix(0.8,h,det)))*(0.35+0.9*fuzz);
  vec2 q=abs(vW.xy)-(uHoop.xy-uHoop.z); float sd=length(max(q,0.))+min(max(q.x,q.y),0.)-uHoop.z;
  float ring=mix(0.28,1.,smoothstep(-7.,-26.,sd)); if(sd>0.) ring=0.42;
  vec3 V=normalize(uCam-vW), H=normalize(uL+V);
  float sh=shadowAt(vW+vec3(0.,0.,0.05));
  float ndl=max(dot(N,uL),0.);
  vec3 col=alb*(uLCol*ndl*sh+mix(uGnd,uSky,N.z*0.5+0.5)*1.3)*occl*ring;
  col+=uLCol*sh*ring*pow(max(dot(N,H),0.),26.)*0.03*h*det;
  col+=alb*uLCol*sh*ring*pow(1.-max(dot(N,V),0.),3.)*0.6;
  gl_FragColor=finish(col,vW);
}`;
const WOOD_VS=`varying vec3 vW; varying vec3 vN; varying vec2 vUv; void main(){ vW=position; vN=normal; vUv=uv; gl_Position=projectionMatrix*viewMatrix*vec4(position,1.); }`;
const WOOD_FS=COMMON+`
varying vec3 vW; varying vec3 vN; varying vec2 vUv; uniform float uTot;
vec2 grain(float s,float v){ float wv=vn(vec2(s*0.02,v*2.)+7.)*5.; return vec2(vn(vec2(s*0.05,v*10.+wv)),vn(vec2(s*0.7,v*70.+wv*3.))); }
void main(){

  vec3 alb=mix(vec3(0.17,0.085,0.032),vec3(0.40,0.235,0.10),smoothstep(0.2,0.8,gr.x))*(0.8+0.35*gr.y);

  vec3 col=alb*(uLCol*ndl*sh+mix(uGnd,uSky,N.z*0.5+0.5)*1.2);

float ign(vec2 p){ return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715)))); }

function applyCam(){
  const fw=Math.exp(C.lf), t=S.time, hand=fw*0.0025;
  tgt.set(C.tx+Math.sin(t*1.3)*hand+Math.sin(t*0.71)*hand, C.ty+Math.cos(t*1.1)*hand, 0);
  const d=(fw/ASPECT/2)/Math.tan(cam.fov*Math.PI/360), st=Math.sin(C.tilt);
  cam.position.set(tgt.x+st*Math.sin(C.yaw)*d, tgt.y-st*Math.cos(C.yaw)*d, Math.cos(C.tilt)*d);
  cam.up.set(Math.sin(C.roll),Math.cos(C.roll),0); cam.lookAt(tgt);
  cam.near=Math.max(0.6,d*0.08); cam.far=d*3+900; cam.updateProjectionMatrix(); cam.updateMatrixWorld();
  shared.uCam.value.copy(cam.position); cam.getWorldDirection(shared.uFwd.value);
  shared.uFoc.value.x=d; shared.uFoc.value.y=2.6*RH;
  const z0=wp.w*0.34, P0=WU.uP0.value.set(wp.x,wp.y,z0), sw=Math.sin(t*1.7)*1.5, sw2=Math.cos(t*1.1)*2;
  WU.uP1.value.set(P0.x-3.2,P0.y+1.6,z0+1.4); WU.uP2.value.set(P0.x+7+sw,P0.y+27+sw2,10+sw*0.5); WU.uP3.value.set(P0.x-64+sw*5,P0.y+240+sw2*4,72);
  const S2=clamp(fw*1.5,60,480); lightCam.left=-S2/2; lightCam.right=S2/2; lightCam.top=S2/2; lightCam.bottom=-S2/2;
  tmp.set(tgt.x,tgt.y+fw*0.04,0); lightCam.position.copy(tmp).addScaledVector(Lv,420); lightCam.up.set(0,0,1); lightCam.lookAt(tmp);
  lightCam.updateProjectionMatrix(); lightCam.updateMatrixWorld(); lightCam.matrixWorldInverse.copy(lightCam.matrixWorld).invert();
  shared.uShadowMat.value.multiplyMatrices(lightCam.projectionMatrix,lightCam.matrixWorldInverse);
  shared.uPen.value=Math.max(0.24/S2,1.3/SM); shared.uSBias.value=0.22/890;
}
function render(){
  applyCam();
  const all=casters.concat(S.jobs.filter(j=>j.mesh).map(j=>j.mesh));
  for(const m of all){ m.userData.main=m.material; m.material=m.userData.depth; } cloth.visible=false;
  renderer.setRenderTarget(shadowRT); renderer.clear(); renderer.render(scene,lightCam);
  for(const m of all) m.material=m.userData.main; cloth.visible=true;
  renderer.setRenderTarget(sceneRT); renderer.clear(); renderer.render(scene,cam);
  PU.uTime.value=S.time; renderer.setRenderTarget(null); renderer.render(postScene,postCam);
  if(Q.checked<3){ Q.checked++; if(gl.getError()===gl.INVALID_FRAMEBUFFER_OPERATION && Q.level<2){ Q.level++; Q.checked=0; makeRT(); } }
}
let last=0;
function frame(now){
  const raw=(now-last)/1000||0; last=now; const dt=Math.min(0.05,raw);
  if(!S.paused){ const sub=Math.max(1,Math.round(S.speed)); for(let i=0;i<sub;i++) step(dt*S.speed/sub); }
  render(); hud();
  if(!Q.fixed && raw>0 && raw<0.5){ Q.acc+=raw; if(++Q.n>=45){ const avg=Q.acc/Q.n; Q.acc=0; Q.n=0; if(avg>0.03 && scale>0.7){ scale=Math.max(0.7,scale*0.82); makeRT(); } } }
  requestAnimationFrame(frame);
}

/* ---------- controls ---------- */
const bar=$("bar"), hint=$("hint"), credit=$("credit");
function hud(){ const idle=S.cur>=S.jobs.length, wide=Math.exp(C.lf)>WIDE*0.9; hint.classList.toggle("on",idle&&!S.film&&wide); credit.classList.toggle("on",wide); }
function wake(){ bar.classList.remove("off"); stage.classList.remove("quiet"); clearTimeout(hudT); hudT=setTimeout(()=>{ bar.classList.add("off"); stage.classList.add("quiet"); },2600); }
function pick(e){ const r=canvas.getBoundingClientRect(); tmp.set(((e.clientX-r.left)/r.width)*2-1,-(((e.clientY-r.top)/r.height)*2-1),0.5).unproject(cam).sub(cam.position).normalize();
  const t=-cam.position.z/tmp.z; return [cam.position.x+tmp.x*t,-(cam.position.y+tmp.y*t)]; }
stage.addEventListener("pointermove",e=>{ const r=canvas.getBoundingClientRect(); ptr.x=((e.clientX-r.left)/r.width)*2-1; ptr.y=-(((e.clientY-r.top)/r.height)*2-1); wake(); });
stage.addEventListener("pointerdown",e=>{ wake(); if(e.target.closest("button")||(S.film&&S.cur<S.jobs.length)) return; S.film=false; const p=pick(e); addTag(p[0],p[1]); });
$("bFilm").addEventListener("click",film);
$("bReset").addEventListener("click",restart);
$("bSpeed").addEventListener("click",e=>{ S.speed=S.speed===1?2:S.speed===2?4:1; e.currentTarget.textContent="SPEED "+S.speed+"X"; });
$("bFull").addEventListener("click",()=>{ const p=document.fullscreenElement?document.exitFullscreen():wrap.requestFullscreen&&wrap.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); });
addEventListener("keydown",e=>{ if(e.key===" "){ e.preventDefault(); film(); } });
let rz; const refit=()=>{ clearTimeout(rz); rz=setTimeout(fit,160); }; addEventListener("resize",refit); document.addEventListener("fullscreenchange",refit);

window.__emb={ seek(t,asFilm){ asFilm?film():restart(); while(S.time<t) step(1/30); S.paused=true; return {cur:S.cur,jobs:S.jobs.map(j=>j.n),cap:CAPR}; }, quality(s){ Q.fixed=s; fit(); }, play(){ S.paused=false; } };

const boot=()=>{ initFont(); fit(); restart(); if(reduce){ while(S.cur<S.jobs.length) step(1/30); } wake(); requestAnimationFrame(frame); };
const fonts=document.fonts?Promise.race([Promise.allSettled([document.fonts.load('80px "AntonLocal"'),document.fonts.load('80px "Anton"')]),new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fonts.then(boot,boot);
})();
</script>
