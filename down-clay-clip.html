<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Down Clay Clip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500&family=DM+Mono:wght@400&display=swap">
<style>
/* Layout: a darkened screening room. One 16:9 frame, one quiet control strip under it. */
:root{
  --room:#110f17; --panel:#1c1926; --line:#353044; --text:#ece6f0; --muted:#958da3; --clay:#f28db2;
  --font-ui:"Heebo","Segoe UI",system-ui,sans-serif; --font-data:"DM Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--room);color:var(--text);font-family:var(--font-ui);padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:center;align-items:flex-start;box-sizing:border-box}
.wrap{width:100%;max-width:1100px;display:flex;flex-direction:column;gap:12px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#0c0b0e;border-radius:6px;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%}
.fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
.controls,.song{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
.play{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--text);display:grid;place-items:center;cursor:pointer;padding:0}
.play:hover,.btn:hover{border-color:var(--clay)}
.play svg{width:14px;height:14px;fill:currentColor}
.scrub{flex:1 1 220px;min-width:0;accent-color:var(--clay);height:28px;cursor:pointer}
.tc{flex:none;font-family:var(--font-data);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bts{flex:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;user-select:none}
.bts input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:34px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--text);transition:transform .15s}
.bts input:checked + .sw{background:var(--clay)}
.bts input:checked + .sw::after{transform:translateX(14px)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
.song{font-size:13px;color:var(--muted)}
.song label{display:inline-flex;align-items:center;gap:6px}
.song input[type=number]{width:74px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 6px;font-family:var(--font-data);font-size:12px}
.song .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.play:focus-visible,.scrub:focus-visible,.btn:focus-visible,.song input:focus-visible,.bts input:focus-visible + .sw{outline:2px solid var(--clay);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}
</style>

<main class="wrap">
  <div class="stage">
    <canvas id="film" aria-label="Down, a clay stop-motion music clip"></canvas>
    <div class="fallback" id="fallback" hidden>This film is rendered live with WebGL, which this browser has switched off.</div>
  </div>
  <div class="controls" dir="ltr">
    <button class="play" id="play" type="button" aria-label="Play"></button>
    <input class="scrub" id="scrub" type="range" min="0" max="383" step="1" value="0" aria-label="Frame">
    <output class="tc" id="tc" for="scrub">bar 01 · 000</output>
    <label class="bts"><input type="checkbox" id="bts"><span class="sw"></span><span lang="he" dir="rtl">מאחורי הקלעים</span></label>
  </div>
  <div class="song" dir="ltr">
    <button class="btn" id="pick" type="button">Load song</button>
    <input type="file" id="file" accept="audio/*" hidden>
    <label>BPM <input type="number" id="bpm" min="60" max="200" step="0.1" value="120"></label>
    <label>Start at (s) <input type="number" id="start" min="0" step="0.01" value="0"></label>
    <span class="name" id="songname">Playing the built-in beat. Your song stays on your device.</span>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var FPS = 12, BEATS = 64;
var canvas = document.getElementById('film');
var renderer;
try {
  if (!window.THREE) throw new Error('three missing');
  renderer = new THREE.WebGLRenderer({canvas: canvas, antialias: false, powerPreference: 'high-performance'});
} catch (e) {
  document.getElementById('fallback').hidden = false;
  return;
}
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

var V3 = THREE.Vector3;
function lin(hex){ return new THREE.Color(hex).convertSRGBToLinear(); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(t){ return t<0?0:t>1?1:t; }
function hash(n){ var s = Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }
function jit(f,id,k){ return hash(f*13.37+id*71.3+k*5.19)-0.5; }
function tr(f,keys,linear){
  if (f<=keys[0][0]) return keys[0][1];
  for (var i=0;i<keys.length-1;i++){
    var a=keys[i], b=keys[i+1];
    if (f<b[0]){ var t=(f-a[0])/(b[0]-a[0]); if(!linear) t=t*t*(3-2*t); return a[1]+(b[1]-a[1])*t; }
  }
  return keys[keys.length-1][1];
}
function hop(f,a,b,n,h){ if(f<a||f>b) return 0; return Math.abs(Math.sin((f-a)/(b-a)*n*Math.PI))*h; }
function span(f,a,b){ return clamp01((f-a)/(b-a)); }
function mix3(a,b,t){ return new V3(lerp(a.x,b.x,t),lerp(a.y,b.y,t),lerp(a.z,b.z,t)); }
function pop(f,start){ var d=f-start; return d<0?0:d<1?0.6:d<2?1.22:d<3?0.94:1; }

/* ---------- clay material: wobbling geometry, fingerprints in the normals ---------- */
var SEED = {value: new V3()};
var NOISE = [
'float h31(vec3 p){ p=fract(p*vec3(.1031,.1030,.0973)); p+=dot(p,p.yxz+33.33); return fract((p.x+p.y)*p.z); }',
'float vn(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);',
' return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x),f.y),',
'  mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x),f.y),f.z)*2.-1.; }',
'uniform vec3 uSeed; uniform vec3 uOff; uniform float uWob; varying vec3 vClayP;'
].join('\n');
var CLAY_H = [
'float clayH(vec3 p){',
' float h = vn(p*2.6)*0.040 + vn(p*6.+3.1)*0.016 + vn(p*3.+uSeed)*0.012;',
' h += vn(p*36.)*0.0011;',
' float m = smoothstep(.0,.4, vn(p*1.5+11.+uSeed*0.006));',
' float r = sin((dot(p,vec3(.8,.6,.35)) + vn(p*2.1+5.)*0.6)*105.);',
' h += r*0.0030*m;',
' float d = smoothstep(.55,.9, vn(p*3.4+40.+uSeed*0.004));',
' h -= d*0.020;',
' return h*uWob; }'
].join('\n');
var matCount = 0;
function clay(hex, opt){
  opt = opt||{};
  var m = new THREE.MeshStandardMaterial({color: lin(hex), roughness: opt.rough==null?0.7:opt.rough, metalness: 0});
  var off = new V3(hash(++matCount)*9, hash(matCount+.37)*9, hash(matCount+.71)*9);
  var wob = {value: opt.wob==null?1:opt.wob};
  m.onBeforeCompile = function(s){
    s.uniforms.uSeed = SEED; s.uniforms.uOff = {value: off}; s.uniforms.uWob = wob;
    s.vertexShader = s.vertexShader
      .replace('#include <common>', '#include <common>\n'+NOISE)
      .replace('#include <begin_vertex>', [
        '#include <begin_vertex>',
        'vec3 cp = position + uOff;',
        'vec3 dA = vec3(vn(cp*2.2), vn(cp*2.2+17.), vn(cp*2.2+31.))*0.030;',
        'vec3 dB = vec3(vn(cp*3.+uSeed), vn(cp*3.+uSeed+9.), vn(cp*3.+uSeed+23.))*0.011;',
        'transformed += (dA+dB)*uWob;',
        'vClayP = cp;'].join('\n'));
    s.fragmentShader = s.fragmentShader
      .replace('#include <common>', '#include <common>\n'+NOISE+'\n'+CLAY_H)
      .replace('#include <color_fragment>', '#include <color_fragment>\n diffuseColor.rgb *= 0.92 + 0.12*vn(vClayP*5.) + 0.05*vn(vClayP*19.);')
      .replace('#include <normal_fragment_maps>', [
        '#include <normal_fragment_maps>',
        '{ float ch = clayH(vClayP);',
        '  vec3 q0 = dFdx(-vViewPosition), q1 = dFdy(-vViewPosition);',
        '  float hx = dFdx(ch), hy = dFdy(ch);',
        '  vec3 R1 = cross(q1, normal), R2 = cross(normal, q0);',
        '  float det = dot(q0, R1);',
        '  vec3 grad = sign(det)*(hx*R1 + hy*R2);',
        '  normal = normalize(abs(det)*normal - grad); }'].join('\n'));
  };
  return m;
}
function shadowed(m, receive){ m.castShadow = true; m.receiveShadow = receive!==false; return m; }

/* ---------- palette ---------- */
var C = {back:'#5a45c8', pink:'#f28db2', must:'#f6c445', lilac:'#b094e8', cream:'#f6ead2', coral:'#ee6352', wood:'#8b5d40', cyan:'#39c6d6', green:'#58c27d'};

var scene = new THREE.Scene();
scene.background = lin('#121015');

/* ---------- lights ---------- */
var hemi = new THREE.HemisphereLight(lin('#dcecff'), lin('#f1d6c2'), 0.5); scene.add(hemi);
var key = new THREE.DirectionalLight(lin('#fff3e2'), 0.95);
key.position.set(-4.4, 6.8, 5.6); key.target.position.set(0, 0.6, 0);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -7; key.shadow.camera.right = 7; key.shadow.camera.top = 7; key.shadow.camera.bottom = -5;
key.shadow.camera.near = 1; key.shadow.camera.far = 26; key.shadow.radius = 5; key.shadow.bias = -0.0006; key.shadow.normalBias = 0.03;
scene.add(key); scene.add(key.target);
var fill = new THREE.DirectionalLight(lin('#dfe9ff'), 0.28); fill.position.set(5.5, 3.2, 5); scene.add(fill);
var rim = new THREE.DirectionalLight(lin('#ffffff'), 0.3); rim.position.set(2.5, 5, -2.5); scene.add(rim);

/* ---------- set: paper sweep, table, studio ---------- */
(function(){
  var N = 60, W = 13;
  var g = new THREE.PlaneGeometry(W, 1, 24, N);
  var p = g.attributes.position, R = 1.6, zf = 4.4, zb = -2.2, top = 5.4;
  var Lf = zf-zb, La = Math.PI/2*R, Lw = top-R, L = Lf+La+Lw;
  for (var i=0;i<p.count;i++){
    var s = (p.getY(i)+0.5)*L, y, z;
    if (s<Lf){ y=0; z=zf-s; }
    else if (s<Lf+La){ var a=(s-Lf)/R; y=R-Math.cos(a)*R; z=zb-Math.sin(a)*R; }
    else { y=R+(s-Lf-La); z=zb-R; }
    p.setXYZ(i, p.getX(i), y, z);
  }
  g.computeVertexNormals();
  var paper = new THREE.Mesh(g, clay(C.back, {rough:0.95, wob:0.12}));
  paper.material.side = THREE.DoubleSide; paper.receiveShadow = true; scene.add(paper);

  var dark = new THREE.MeshStandardMaterial({color: lin('#232127'), roughness: 0.6, metalness: 0.3});
  var wood = new THREE.MeshStandardMaterial({color: lin(C.wood), roughness: 0.8});
  var table = new THREE.Mesh(new THREE.BoxGeometry(14.4, 0.3, 8.2), wood); table.position.set(0,-0.17,1.0); table.receiveShadow = true; scene.add(table);
  [[-6.9,-2.8],[6.9,-2.8],[-6.9,4.8],[6.9,4.8]].forEach(function(q){
    var leg = new THREE.Mesh(new THREE.BoxGeometry(0.28,3,0.28), wood); leg.position.set(q[0],-1.8,q[1]); scene.add(leg); });
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(80,80), new THREE.MeshStandardMaterial({color: lin('#1c1a20'), roughness: 0.95}));
  floor.rotation.x = -Math.PI/2; floor.position.y = -3.3; scene.add(floor);
  /* paper roll and its two stands */
  var roll = new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,W+0.3,20), clay(C.back,{rough:0.95,wob:0.1}));
  roll.rotation.z = Math.PI/2; roll.position.set(0, top+0.1, zb-R-0.12); scene.add(roll);
  function pole(x,y0,y1,z,r){ var m = new THREE.Mesh(new THREE.CylinderGeometry(r,r,y1-y0,10), dark); m.position.set(x,(y0+y1)/2,z); scene.add(m); return m; }
  pole(-6.9,-3.3,top+0.3,zb-R-0.12,0.05); pole(6.9,-3.3,top+0.3,zb-R-0.12,0.05);
  /* soft boxes on light stands */
  function softbox(x,y,z,size){
    var grp = new THREE.Group(); grp.position.set(x,y,z);
    var back = new THREE.Mesh(new THREE.BoxGeometry(size,size,0.5), dark);
    var front = new THREE.Mesh(new THREE.PlaneGeometry(size*0.9,size*0.9), new THREE.MeshBasicMaterial({color: new THREE.Color(3.2,3.0,2.7)}));
    front.position.z = 0.26; grp.add(back); grp.add(front); grp.lookAt(0,0.8,0); scene.add(grp);
    pole(x,0,y,z,0.045);
    for (var k=0;k<3;k++){ var a=k*2.094; var l = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.0,8), dark);
      l.position.set(x+Math.cos(a)*0.34,0.36,z+Math.sin(a)*0.34); l.rotation.set(Math.sin(a)*0.75,0,-Math.cos(a)*0.75); scene.add(l); }
  }
  softbox(-5.9, 4.7, 3.4, 1.9); softbox(6.3, 3.3, 2.6, 1.5);
})();

/* the camera that "shot" the film, only shown behind the scenes */
var camProp = new THREE.Group();
(function(){
  var dark = new THREE.MeshStandardMaterial({color: lin('#1b1a1e'), roughness: 0.45, metalness: 0.4});
  var body = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.46,0.5), dark); body.position.set(0,0,0.55);
  var lens = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.19,0.34,20), dark); lens.rotation.x = Math.PI/2; lens.position.set(0,0,0.16);
  var post = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,4.5,8), dark); post.position.set(0,-2.48,0.55);
  camProp.add(body, lens, post);
  for (var k=0;k<3;k++){ var a=k*2.094+0.5; var l = new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,2.2,8), dark);
    l.position.set(Math.cos(a)*0.6,-3.75,0.55+Math.sin(a)*0.6); l.rotation.set(Math.sin(a)*0.6,0,-Math.cos(a)*0.6); camProp.add(l); }
  camProp.position.set(0,1.45,6.3); camProp.lookAt(0,1.15,0); camProp.rotateY(Math.PI); camProp.visible = false; scene.add(camProp);
})();

/* ---------- clay coil letters ---------- */
var FONT = {
  T:[{p:[[0,1],[1,1]]},{p:[[.5,1],[.5,0]]}],
  H:[{p:[[0,0],[0,1]]},{p:[[1,0],[1,1]]},{p:[[0,.5],[1,.5]]}],
  E:[{p:[[1,1],[0,1],[0,0],[1,0]]},{p:[[0,.5],[.8,.5]]}],
  L:[{p:[[0,1],[0,0],[1,0]]}],
  A:[{p:[[0,0],[.5,1],[1,0]]},{p:[[.22,.36],[.78,.36]]}],
  S:[{p:[[.95,.84],[.5,1],[.08,.77],[.5,.5],[.92,.23],[.5,0],[.05,.16]],s:1}],
  O:[{p:[[.5,1],[.86,.86],[1,.5],[.86,.14],[.5,0],[.14,.14],[0,.5],[.14,.86]],s:1,c:1}],
  N:[{p:[[0,0],[0,1],[1,0],[1,1]]}],
  R:[{p:[[0,0],[0,1]]},{p:[[0,1],[.7,.98],[.96,.75],[.7,.52],[0,.5]],s:1},{p:[[.45,.5],[1,0]]}]
};
function makeLetter(ch, h, hex, rad){
  var g = new THREE.Group(), w = h*0.62, mat = clay(hex, {wob:0.55});
  FONT[ch].forEach(function(st){
    var pts = st.p.map(function(q){ return new V3((q[0]-.5)*w,(q[1]-.5)*h,0); });
    var curve = new THREE.CatmullRomCurve3(pts, !!st.c, 'catmullrom', st.s?0.5:0.06);
    g.add(shadowed(new THREE.Mesh(new THREE.TubeGeometry(curve, st.s?48:pts.length*10, rad, 10, !!st.c), mat)));
    if (!st.c) [pts[0], pts[pts.length-1]].forEach(function(e){
      var cap = shadowed(new THREE.Mesh(new THREE.SphereGeometry(rad*1.04,10,8), mat)); cap.position.copy(e); g.add(cap); });
  });
  return g;
}
function makeWord(text, h, rad, gap, colors, x0, y, z, parent){
  var w = h*0.62, total = text.replace(/ /g,'').length*w + (text.length-1)*gap, out = [], x = x0-total/2+w/2, n = 0;
  for (var i=0;i<text.length;i++){
    if (text[i]===' '){ x += gap*1.6; continue; }
    var L = makeLetter(text[i], h, colors[n%colors.length], rad);
    L.position.set(x,y,z); L.userData.base = L.position.clone(); L.userData.id = 200+matCount; parent.add(L); out.push(L);
    x += w+gap; n++;
  }
  return out;
}
/* ---------- camera, depth of field, exposure flicker, lens smudge ---------- */
var camera = new THREE.PerspectiveCamera(30, 16/9, 0.5, 90);
var CAM_A0 = new V3(0,1.45,6.3), LOOK_A = new V3(0,1.15,0), CAM_B0 = new V3(7.2,5.2,19.5), LOOK_B0 = new V3(-0.2,1.7,0.6);
var rt = null, post = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
var postMat = new THREE.ShaderMaterial({
  uniforms: {tC:{value:null}, tD:{value:null}, uNear:{value:0.5}, uFar:{value:90}, uFocus:{value:6.2}, uBlur:{value:0.25},
    uExp:{value:1}, uSeed:{value:0}, uBts:{value:0}, uAspect:{value:16/9}, uWp:{value:-1}, uWs:{value:0}, uWc:{value:new THREE.Color(1,1,1)}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
  fragmentShader: [
  'precision highp float; varying vec2 vUv; uniform sampler2D tC; uniform sampler2D tD;',
  'uniform float uNear,uFar,uFocus,uBlur,uExp,uSeed,uBts,uAspect,uWp,uWs; uniform vec3 uWc;',
  'float h1(float n){ return fract(sin(n*91.345)*47453.5); }',
  'float n1(float x){ float i=floor(x), f=fract(x); f=f*f*(3.-2.*f); return mix(h1(i),h1(i+1.),f); }',
  'float zAt(vec2 uv){ float d=texture2D(tD,uv).x; return (uNear*uFar)/(uFar-(uFar-uNear)*d); }',
  'float coc(float z){ return min(abs(1./uFocus-1./z)*uBlur, 0.034); }',
  'float rnd(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233))+uSeed)*43758.5453); }',
  'vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }',
  'void main(){',
  ' float wd = -1.; vec2 sUv = vUv;',
  ' if(uWp>=0.){ float e1 = n1(vUv.x*4.+uWs)*.55+n1(vUv.x*11.+uWs*2.)*.3+n1(vUv.x*27.+uWs)*.15;',
  '  wd = uWp<1. ? vUv.y-(1.-uWp*1.5+e1*.5) : (1.-(uWp-1.)*1.5+e1*.5)-vUv.y;',
  '  if(wd<0. && wd>-.18) sUv.y = clamp(sUv.y+(uWp<1.?1.:-1.)*(.18+wd)*.6, 0., 1.); }',
  ' float z0 = zAt(sUv); float Rc = coc(z0);',
  ' vec2 q = (vUv-vec2(.76,.34))*vec2(uAspect,1.); q = mat2(.88,-.47,.47,.88)*q;',
  ' float sd = length(q/vec2(.085,.115)); float sm = smoothstep(1.,.5,sd)*uBts;',
  ' float Rr = max(Rc, sm*0.011);',
  ' vec3 acc = vec3(0.); float wsum = 0.; float rot = rnd(vUv)*6.2831;',
  ' for(int i=0;i<36;i++){ float fi=float(i); float r=sqrt((fi+.5)/36.); float a=fi*2.39996+rot;',
  '  vec2 uv = sUv + vec2(cos(a)/uAspect, sin(a))*r*Rr;',
  '  float z = zAt(uv); float c = coc(z);',
  '  float w = max(step(z0-0.35, z), smoothstep(Rr*r*0.7, Rr*r, c)); w = max(w, 0.02);',
  '  acc += texture2D(tC,uv).rgb*w; wsum += w; }',
  ' vec3 col = acc/wsum;',
  ' vec2 w2 = q + 0.006*sin(q.yx*64.);',

  for (i=0;i<n;i++){ var s = 0; for (j=0;j<hopN;j+=4){ var v = ch[i*hopN+j]; s += v*v; } s = Math.sqrt(s); on[i] = Math.max(0, s-prev); prev = s; }
  var best = 120, bs = -1;
  for (var q=70; q<=180; q+=0.5){
    var lag = 200*60/q, sc = 0, m = n-Math.ceil(lag*2)-1;
    for (i=0;i<m;i++) sc += on[i]*(on[Math.round(i+lag)]+0.5*on[Math.round(i+lag*2)]);
    sc = sc/Math.max(m,1)*Math.exp(-Math.pow((q-118)/70,2));
    if (sc > bs){ bs = sc; best = q; }
  }
  var per = 200*60/best, bp = 0, bps = -1;
  for (var ph=0; ph<per; ph++){ var t = 0; for (var k=0; ph+k*per<n; k++) t += on[Math.round(ph+k*per)]; if (t > bps){ bps = t; bp = ph; } }
  return {bpm: Math.round(best*10)/10, start: Math.round(bp/200*100)/100};
}

var playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), btsBox = document.getElementById('bts');
var pick = document.getElementById('pick'), fileIn = document.getElementById('file'), bpmIn = document.getElementById('bpm'), startIn = document.getElementById('start'), songName = document.getElementById('songname');
var ICON_PLAY = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.2v11.6L12.5 7z"/></svg>';
var ICON_PAUSE = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 1.5h3v11h-3zM8.5 1.5h3v11h-3z"/></svg>';
function pad(n,l){ n = String(n); while(n.length<l) n = '0'+n; return n; }
var uiPlaying = null;
function syncUi(){
  if (uiPlaying !== playing){ uiPlaying = playing; playBtn.innerHTML = playing ? ICON_PAUSE : ICON_PLAY; playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
  var t = curTime(), fi = Math.floor(t*FPS+1e-6);
  scrub.value = fi; tc.textContent = 'bar '+pad(Math.floor(t*bpm/60/4)+1,2)+' · '+pad(fi,3);
}
scrub.max = frames()-1;
playBtn.addEventListener('click', function(){ if (playing) pause(); else play(); });
scrub.addEventListener('input', function(){ if (playing) pause(); seek((+scrub.value+0.01)/FPS); syncUi(); });
btsBox.addEventListener('change', function(){ btsTarget = btsBox.checked ? 1 : 0; });
pick.addEventListener('click', function(){ fileIn.click(); });
fileIn.addEventListener('change', function(){
  var file = fileIn.files && fileIn.files[0]; if (!file) return;
  if (!ensureCtx()){ songName.textContent = 'This browser cannot play audio here.'; return; }
  songName.textContent = 'Reading '+file.name+'…';
  var rd = new FileReader();
  rd.onerror = function(){ songName.textContent = 'Could not read that file. Try an MP3 or WAV.'; };
  rd.onload = function(){
    var done = function(buf){
      songBuf = buf; var d = detect(buf);
      bpmIn.value = d.bpm; startIn.value = d.start; retime(d.bpm, d.start);
      songName.textContent = file.name+' · detected '+d.bpm+' BPM. Adjust BPM or the start time if the cuts drift.';
      if (playing) startAudio(); syncUi();
    };
    var fail = function(){ songName.textContent = 'Could not decode that file. Try an MP3 or WAV.'; };
    try { var pr = ctx.decodeAudioData(rd.result, done, fail); if (pr && pr.catch) pr.catch(function(){}); } catch (e) { fail(); }
  };
  rd.readAsArrayBuffer(file);
});
function params(){
  var nb = parseFloat(bpmIn.value), ns = parseFloat(startIn.value);
  if (!(nb >= 60 && nb <= 200)) return; if (!(ns >= 0)) ns = 0;
  retime(nb, ns); syncUi();
}
bpmIn.addEventListener('change', params); startIn.addEventListener('change', params);
document.addEventListener('keydown', function(e){
  var tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'BUTTON') return;
  if (e.code === 'Space'){ e.preventDefault(); playBtn.click(); }
  else if (e.code === 'ArrowRight'){ if (playing) pause(); seek(curTime()+1/FPS); syncUi(); }
  else if (e.code === 'ArrowLeft'){ if (playing) pause(); seek(curTime()-1/FPS); syncUi(); }
});

function draw(){
  var t = curTime(), fi = Math.floor(t*FPS+1e-6), b = ((fi/FPS)*bpm/60)%BEATS;
  lastFi = fi;
  update(b, fi);
  var S = shotAt(b), e = btsT*btsT*(3-2*btsT);
  camera.position.lerpVectors(S.pos, CAM_B, e);
  camera.position.x += jit(fi,90,1)*0.006; camera.position.y += jit(fi,90,2)*0.006;
  camera.lookAt(new V3().lerpVectors(S.look, LOOK_B, e));
  camProp.visible = e > 0.3;
  var D = S.pos.distanceTo(S.look), u = postMat.uniforms;
  counter.visible = e < 0.25;
  var sc = D/5.2*(1+0.14*(counter.userData.bump||0));
  counter.position.set(-0.476*D*0.7, -0.268*D*0.74, -D); counter.scale.setScalar(sc); counter.rotation.z = jit(fi,92,1)*0.03;
  var wp = -1;
  WIPES.forEach(function(wb, i){ var df = fi-Math.round(wb*60/bpm*FPS);
    if (df >= -2 && df < 2){ wp = [0.5,0.9,1.25,1.65][df+2]; u.uWs.value = (i%8)*7.3; u.uWc.value.copy(lin(WCOL[i%8])); } });
  u.uWp.value = wp;
  u.uFocus.value = lerp(D, 20.5, e); u.uBlur.value = lerp(0.3, 0.2, e);
  u.uExp.value = 1 + jit(fi,91,1)*0.09; u.uSeed.value = hash(fi+.5)*10; u.uBts.value = e;
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(post, postCam);
}
function tick(now){
  var dt = Math.min((now-lastNow)/1000, 0.25); lastNow = now;
  if (btsT !== btsTarget){
    btsClock += dt;
    if (btsClock >= 1/FPS){ btsClock = 0; btsT = btsTarget>btsT ? Math.min(1,btsT+0.1) : Math.max(0,btsT-0.1); dirty = true; }
  }
  if (playing && Math.floor(curTime()*FPS+1e-6) !== lastFi) dirty = true;
  if (dirty){ dirty = false; draw(); syncUi(); }
  requestAnimationFrame(tick);
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas); else window.addEventListener('resize', resize);
resize(); syncUi();
window.__film = {setBeat: function(b){ if (playing) pause(); tPause = b*60/bpm; dirty = false; draw(); syncUi(); },
  setBts: function(v){ btsT = btsTarget = v; btsBox.checked = v>0.5; dirty = true; }};
requestAnimationFrame(function(t){ lastNow = t; tick(t); });
})();
</script>
</body>
