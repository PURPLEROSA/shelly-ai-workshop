<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shelly's AI Crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a wide stage on the left, and on the right the agent's name, what it says and what it did for you. */
/* One committed look: a dark studio, with pink kept for the names, the ticks and the selection. */
:root{
  --bg:#141217; --panel:#1d1a21; --raised:#27232c; --line:#37313e;
  --ink:#eeeaf1; --muted:#a59eae; --dim:#746d7e;
  --accent:#ff5c9d; --on-accent:#1b0b13; --sel:#3a2231; --seg:#4a4353;
  --stage:#19171c; --shade:rgba(8,6,10,.5); --hud:rgba(20,18,23,.7);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --mark:Anton,"IBM Plex Sans",Impact,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;max-width:1680px;margin-inline:auto;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.mark{display:flex;align-items:center;gap:10px;margin:0;font:400 24px/1 var(--mark);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.mark i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,var(--on-accent) 0 27%,var(--accent) 30%)}
.by{margin:0;font:400 11.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tagline{order:3;flex:1 1 100%;min-width:0;margin:0;color:var(--muted);max-width:62ch}
.seg{margin-left:auto;display:flex;gap:2px;padding:2px;background:var(--raised);border:1px solid var(--line);border-radius:8px}
.seg button{border:0;background:none;border-radius:6px;min-height:32px;padding:0 13px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--seg);color:var(--ink)}

/* bench */
.bench{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "who"}
.panel,.stageblock{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.stageblock{grid-area:stage;display:flex;flex-direction:column;overflow:hidden}
.who{grid-area:who}

/* stage: always wider than tall */
.stage{position:relative;width:100%;aspect-ratio:4/3;max-height:640px;overflow:hidden;background:var(--stage)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 42%,transparent 52%,var(--shade))}
.stage.lens::after{display:none}
.wire{position:absolute;z-index:1;top:12px;right:12px;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--hud);font:500 11px var(--mono);letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.wire[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.fail,.load{position:absolute;z-index:2;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--stage);font-weight:500}
.load{font:500 12px var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}

/* the crew, as a row of chips under the stage */
#cast{list-style:none;margin:0;padding:8px;display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line)}
#cast button{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 13px 0 10px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--muted);font-weight:500;font-size:13.5px}
#cast button:hover{background:var(--raised);color:var(--ink)}
#cast button[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);color:var(--ink)}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--dim)}

/* who is this, and what it did */
.who{display:flex;flex-direction:column;padding:22px 22px 20px;overflow:hidden}
.kick{margin:0;font:500 11.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.name{margin:8px 0 0;overflow:hidden;font:400 clamp(56px,9vw,92px)/1.02 var(--mark);letter-spacing:1px;text-transform:uppercase}
.name span{display:block;will-change:transform}
.role{margin:6px 0 0;font:500 14px var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
.line{margin:18px 0 0;min-height:3.1em;font-size:19px;font-weight:500;line-height:1.4;text-wrap:pretty}
.didh{margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line);font:500 11.5px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.did{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:11px}
.did li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;align-items:start}
.did i{width:22px;height:22px;border-radius:50%;background:var(--accent);position:relative;margin-top:1px}
.did i::after{content:"";position:absolute;left:7px;top:4px;width:6px;height:10px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.did b{display:block;font:500 11.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.did span{display:block;font-size:15.5px;line-height:1.38;color:var(--ink)}
.hint{margin:auto 0 0;padding-top:18px;font:400 11px var(--mono);color:var(--dim)}

@media (min-width:760px){.tagline{order:0;flex:1 1 auto}}
@media (min-width:1000px){
  .app{height:100%}
  .bench{grid-template-columns:minmax(0,1fr) clamp(340px,31vw,470px);grid-template-areas:"stage who"}
  .stage{flex:1;aspect-ratio:auto;max-height:none;min-height:400px}
  .name{font-size:clamp(60px,6.4vw,104px)}
}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand"><h1 class="mark"><i aria-hidden="true"></i>AI Crew</h1><p class="by">by Shelly Or Gisser</p></div>
  <p class="tagline">Seven agents that keep working while you sleep. Tap one to see what it did for you.</p>
  <div class="seg" role="group" aria-label="View"><button type="button" id="vsolo" aria-pressed="true">One agent</button><button type="button" id="vteam" aria-pressed="false">Whole crew</button></div>
 </header>
 <main class="bench">
  <section class="stageblock" aria-label="Stage">
   <div class="stage" id="stage">
    <canvas id="gl" aria-label="A 3D stage with seven plush agents; the one in front performs its own move"></canvas>
    <button type="button" class="wire" id="wire" aria-pressed="false">Wireframe</button>
    <div class="load" id="load">Stitching the crew…</div>
    <div class="fail" id="fail" hidden>3D could not start in this browser. Reload the page or try another browser.</div>
   </div>
   <ol id="cast" aria-label="The crew"></ol>
  </section>
  <section class="who panel" aria-label="Who is this and what it did">
   <p class="kick" id="w-kick"></p>
   <h2 class="name"><span id="w-name"></span></h2>
   <p class="role" id="w-role"></p>
   <p class="line" id="w-line"></p>
   <h3 class="didh" id="w-didh"></h3>
   <ul class="did" id="w-did"></ul>
   <p class="hint">Drag the stage to look around · Tap an agent to meet it</p>
  </section>
 </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
'use strict';
var FALLBACK='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
function fail(){var f=document.getElementById('fail');if(f)f.hidden=false}
function boot(){
  if(window.THREE)return go();
  var s=document.createElement('script');s.src=FALLBACK;s.onload=go;s.onerror=fail;document.head.appendChild(s);
}
function go(){setTimeout(function(){try{start();document.getElementById('load').hidden=true}catch(e){console.error(e);fail()}},60)} /* let the page paint first: drawing the cloth takes a moment */

function start(){
var T=window.THREE,$=function(s){return document.querySelector(s)};
var stage=$('#stage'),canvas=$('#gl');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var small=Math.min(window.innerWidth,window.innerHeight)<700;
var Z=new T.Vector3(0,0,1);

/* ---------- small maths ---------- */
function rng(seed){var s=seed>>>0;return function(){s=(s+0x6D2B79F5)|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v))},lerp=function(a,b,t){return a+(b-a)*t},smooth=function(t){return t*t*(3-2*t)};

/* ---------- renderer ---------- */

var sc=key.shadow.camera;sc.left=-7.5;sc.right=7.5;sc.top=9;sc.bottom=-8;sc.near=1;sc.far=40;key.shadow.bias=-.0005;key.shadow.normalBias=.035;key.shadow.radius=6;

var post=null;
(function(){
  if(!renderer.capabilities.isWebGL2)return;

    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
    fragmentShader:[

      'varying vec2 vUv;',
      'float zAt(vec2 uv){float d=texture2D(tDepth,uv).x;return uNear*uFar/(uFar-d*(uFar-uNear));}',
      'float coc(float z){return clamp(abs(z-uFocus)/z*uAperture,0.,1.)*uMaxBlur;}',
      'float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',
      'void main(){',
      '  float cz=zAt(vUv),cs=coc(cz);vec3 col=texture2D(tColor,vUv).rgb;float tot=1.;',
      '  float rot=hash(vUv*uRes)*6.2831853;',
      '  for(int i=0;i<44;i++){',
      '    float fi=float(i)+.5,rad=sqrt(fi/44.)*uMaxBlur,ang=fi*2.39996323+rot;',
      '    vec2 tc=vUv+vec2(cos(ang),sin(ang))*rad/uRes;',

      '  col/=tot;vec2 q=vUv-.5;col*=1.-dot(q,q)*.9;',

  post={rt:rt,mat:mat,scene:ps,cam:pc};

}
var FUZZLEN={fur:.085,felt:.03,velvet:.02,cord:.022,knit:.03,cable:.03,tweed:.028,stripe:.014,stars:.018,kraft:0,airmail:0};

  else if(kind==='kraft'){blot(40,.14,95);for(i=0;i<30;i++){var kx=R()*S,ky=R()*S,ka=R()*6.283,kl=120+R()*300,ex2=kx+Math.cos(ka)*kl,ey2=ky+Math.sin(ka)*kl;x.lineWidth=2;x.strokeStyle=css(D,.2);x.beginPath();x.moveTo(kx,ky);x.lineTo(ex2,ey2);x.stroke();x.lineWidth=1.5;x.strokeStyle=css(L,.26);x.beginPath();x.moveTo(kx+2,ky+2);x.lineTo(ex2+2,ey2+2);x.stroke();
      y.lineWidth=3.5;y.strokeStyle=gray(.1,.8);y.beginPath();y.moveTo(kx,ky);y.lineTo(ex2,ey2);y.stroke();y.lineWidth=3;y.strokeStyle=gray(.92,.6);y.beginPath();y.moveTo(kx+3,ky+3);y.lineTo(ex2+3,ey2+3);y.stroke()}fibers(3200,9,.18,.14)}
  else if(kind==='tweed'){var fl=[L,D].concat((o.fleck||['#f4b8ca','#e8e0f2','#9fd4ee']).map(h2r));for(i=0;i<11000;i++){var fx=R()*S,fy=R()*S;x.fillStyle=css(fl[(R()*fl.length)|0],.6);x.fillRect(fx,fy,2.4,2.4);y.fillStyle=gray(R(),.55);y.fillRect(fx,fy,3,3)}

  if(solo&&act.i===i&&!calm)ACT[p.def.act](t-act.t0,o);else if(solo)o.smile=1;
  /* the one on the spot looks at you; the others turn to listen */
  var yaw=0;if(S.view==='solo')yaw=solo?clamp(az*.45,-.55,.55):clamp(Math.atan2(SPOT.x-p.root.position.x,SPOT.z-p.root.position.z)*.6,-.7,.7);
  p.yaw=lerp(p.yaw,yaw,1-Math.exp(-dt*2.6));
  p.spin.rotation.y=o.ry;p.spin.position.y=o.jump+o.hop-o.sink;
  p.body.rotation.set(o.bow,s3*.03,s2*.018+o.lean);p.body.scale.set(1+o.squash*.5,(1+b*.008)*(1-o.squash),1+o.squash*.5);
  p.headPivot.rotation.set(-.03+b*.012+o.nod,p.yaw+s3*.06+o.hy,s2*.03+o.tilt);
  var up=o.armUp*2.6,out=.12+o.armOut+b*.01;
  p.arms[0].rotation.set(0,0,-(out+up));p.arms[1].rotation.set(-o.armR*.5,0,out+up+o.armR*2.5+o.waveR);
  for(var k=0;k<p.eyes.length;k++){var e=p.eyes[k];if(e.button)continue;
    e.pg.position.x=e.px+(solo?clamp((az-p.yaw)*.5,-.5,.5)*e.r*.3:s3*e.r*.05);e.pg.position.y=e.py;
    var tb=t*.29+.45+i*.37+k*.02,bf=tb-Math.floor(tb),blk=bf<.04?Math.sin(bf/.04*Math.PI):0,cl=clamp(e.rest+o.lids+blk*(1-e.rest)+o.smile*.1,0,1);
    if(k===1)cl=Math.max(cl,o.wink);e.lid.rotation.x=-1.25+cl*2.5;
    var sq=1-clamp((cl-.6)/.34,0,1);e.pg.scale.y=Math.max(.04,sq);e.pg.visible=sq>.06} /* a closing lid squeezes the pupil shut */
  if(p.smileG){p.smileG.scale.set(1+o.smile*.3,1+o.smile*.55,1);for(k=0;k<p.blush.length;k++)p.blush[k].scale.setScalar(1+o.smile*.18)}
  var A={beat:t*.33+ph,hit:o.hit,flap:o.flap,t:t};for(k=0;k<p.anim.length;k++)p.anim[k](A);
  p.root.position.x=lerp(p.root.position.x,tg.x,kk);p.root.position.z=lerp(p.root.position.z,tg.z,kk);p.gy=lerp(p.gy==null?tg.y:p.gy,tg.y,kk);p.root.position.y=p.gy;
  p.root.rotation.y=lerp(p.root.rotation.y,solo?0:-tg.x*.07,kk);
}
function camGoal(){ /* where the camera sits, where the lens focuses (fz) and how wide it is open (ap) */
  var a=cam.aspect,th=Math.tan(cam.fov*Math.PI/360),d;
  if(S.view==='solo'){d=Math.max(2.3/th,1.5/(th*a))*S.zoom;return{tx:0,ty:2.05+S.lift,tz:SPOT.z,d:d,el:.05,f:40,fz:d-.4,ap:1}}
  d=Math.max(3.1/th,4.45/(th*a));return{tx:0,ty:2.6,tz:-.1,d:d,el:.09,f:32,fz:d-1.05,ap:.4};
}
function draw(t){
  if(!post)return renderer.render(scene,cam);
  var u=post.mat.uniforms;u.uFocus.value=cs.fz;u.uAperture.value=S.shade==='wire'?0:cs.ap;u.uTime.value=t%61;
  renderer.setRenderTarget(post.rt);renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(post.scene,post.cam);
}
function update(t,dt,skip){
  dt=clamp(dt,0,.1);NOW=t;
  var calm=reduce&&!manual,az=orb.az+(calm?0:Math.sin(t*.42)*.16),i;
  for(i=0;i<puppets.length;i++)animate(puppets[i],i,t,dt,az);
  for(i=0;i<FURMATS.length;i++)if(FURMATS[i].userData.uT)FURMATS[i].userData.uT.value=calm?0:t;
  var g=camGoal();if(!cs)cs=g;var k=1-Math.exp(-dt*3.6);for(var q in g)cs[q]=lerp(cs[q],g[q],k);
  var el=clamp(cs.el+orb.el+(calm?0:Math.sin(t*.31)*.02),-.1,.75),ty=cs.ty+(S.view==='solo'?puppets[S.sel].spin.position.y*.45:0);
  cam.position.set(cs.tx+Math.sin(az)*Math.cos(el)*cs.d,ty+Math.sin(el)*cs.d,cs.tz+Math.cos(az)*Math.cos(el)*cs.d);cam.lookAt(cs.tx,ty,cs.tz);
  scene.fog.near=cs.d+1.6;scene.fog.far=cs.d+cs.f;
  if(!skip)draw(t);ui(t);
}
var T0=performance.now()/1000,last=0;
function frame(){
  requestAnimationFrame(frame);if(manual)return;
  var w=performance.now()/1000-T0,dt=w-last;last=w;update(w,dt);
}

/* ---------- interface ---------- */
var castEl=$('#cast'),nameEl=$('#w-name'),roleEl=$('#w-role'),lineEl=$('#w-line'),didhEl=$('#w-didh'),didEl=$('#w-did'),kickEl=$('#w-kick'),castBtns=[],rows=[];
var card={t0:0,text:'',typed:-1},CPS=30;
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function press(id,on){$(id).setAttribute('aria-pressed',on?'true':'false')}
DEFS.forEach(function(d,i){var li=el('li'),b=el('button'),sw=el('i','sw');b.type='button';sw.style.background=d.hex;b.appendChild(sw);b.appendChild(document.createTextNode(d.name));
  b.addEventListener('click',function(){select(i,true)});li.appendChild(b);castEl.appendChild(li);castBtns.push(b)});
function tell(kick,name,role,line,head,list){ /* the text on the right; ui() then brings it in piece by piece */
  kickEl.textContent=kick;nameEl.textContent=name;roleEl.textContent=role;didhEl.textContent=head;card.text=line;card.typed=-1;card.t0=NOW;
  lineEl.setAttribute('aria-label',line);didEl.textContent='';rows=list.map(function(r){var li=el('li'),box=el('div');li.appendChild(el('i'));box.appendChild(el('b','',r[0]));box.appendChild(el('span','',r[1]));li.appendChild(box);didEl.appendChild(li);return li});
}
function paint(){
  press('#vsolo',S.view==='solo');press('#vteam',S.view==='team');castBtns.forEach(function(b,k){b.setAttribute('aria-pressed',S.view==='solo'&&k===S.sel?'true':'false')});
  if(S.view==='solo'){var d=DEFS[S.sel];tell(d.cloth+' · agent '+(S.sel+1)+' of '+DEFS.length,d.name,d.role,'“'+d.say+'”','What I did for you',d.did);perform(S.sel)}
  else{tell('Seven agents','The crew','by Shelly Or Gisser','One for every job you would rather not do.','Who does what',DEFS.map(function(d){return[d.role,d.name]}));act.i=-1}
  lod();
}
function select(i,goSolo){S.sel=i;if(goSolo)S.view='solo';paint()}
function setView(v){S.view=v;paint()}
var wireMat=new T.MeshBasicMaterial({color:new T.Color(cssVar('--accent')||'#ff5c9d'),wireframe:true,toneMapped:false,transparent:true,opacity:.42,depthWrite:false});
function setShade(m){S.shade=m;scene.overrideMaterial=m==='wire'?wireMat:null;press('#wire',m==='wire');lod()}
function ui(t){ /* the name rises, the line types itself, then the done-list ticks in */
  var still=reduce&&!manual,u=still?99:t-card.t0,e=1-ease(u/.6),k,n=card.text.length,c=clamp(Math.floor((u-.75)*CPS),0,n);
  nameEl.style.transform='translateY('+(e*108).toFixed(1)+'%)';
  e=ease((u-.4)/.4);roleEl.style.opacity=e.toFixed(3);roleEl.style.transform='translateY('+((1-e)*8).toFixed(1)+'px)';
  if(c!==card.typed){card.typed=c;lineEl.textContent=card.text.slice(0,c)}
  e=ease((u-1.5)/.4);didhEl.style.opacity=e.toFixed(3);
  for(k=0;k<rows.length;k++){e=ease((u-1.7-k*(rows.length>4?.12:.4))/.4);rows[k].style.opacity=e.toFixed(3);rows[k].style.transform='translateY('+((1-e)*10).toFixed(1)+'px)'}
}
$('#vsolo').addEventListener('click',function(){setView('solo')});$('#vteam').addEventListener('click',function(){setView('team')});
$('#wire').addEventListener('click',function(){setShade(S.shade==='wire'?'fabric':'wire')});

/* drag to look around, tap to pick */
var drag=null,ray=new T.Raycaster(),ptr=new T.Vector2();
canvas.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,az:orb.az,el:orb.el,moved:0,touch:e.pointerType==='touch'};try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));orb.az=clamp(drag.az-dx*.007,-1.6,1.6);if(!drag.touch)orb.el=clamp(drag.el+dy*.004,-.12,.6)});
function endDrag(e){if(!drag)return;var tap=drag.moved<7;drag=null;if(!tap)return;
  var r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,cam);
  var hit=ray.intersectObjects(puppets.map(function(p){return p.root}),true)[0];if(!hit)return;var o=hit.object;while(o&&o.userData.pid==null)o=o.parent;if(o)select(o.userData.pid,true)}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',function(){drag=null});

/* size */
renderer.setClearColor(scene.fog.color);if(post)stage.classList.add('lens');
function size(){var r=stage.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();
  if(post){var v=renderer.getDrawingBufferSize(new T.Vector2());post.rt.setSize(v.x,v.y);post.mat.uniforms.uRes.value.copy(v);post.mat.uniforms.uMaxBlur.value=v.y*.017}
  if(cs)draw(NOW)} /* a resize clears the canvas, so paint it again straight away */
size();if(window.ResizeObserver)new ResizeObserver(size).observe(stage);else window.addEventListener('resize',size);

select(0,false);
requestAnimationFrame(frame);

/* hooks for rendering stills and clips frame by frame */
window.aiCrew={
  select:select,setView:setView,setShade:setShade,puppets:puppets,set:function(k,v){S[k]=v},
  renderAt:function(sec,skip){manual=true;var dt=lastManual==null?1/30:sec-lastManual;lastManual=sec;update(sec,dt,skip)},
  snap:function(){cs=camGoal();puppets.forEach(function(p,i){var solo=S.view==='solo'&&i===S.sel,tg=solo?SPOT:SLOTS[i];p.root.position.copy(tg);p.gy=tg.y;p.root.rotation.y=solo?0:-tg.x*.07;p.yaw=0})}
};
}
boot();
})();
</script>
