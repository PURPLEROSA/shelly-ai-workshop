<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shelly's AI Crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a small theatre. One big stage; beside it the crew list and a card that says who the chosen agent is. */
/* One committed look: a dark studio, with pink kept for the names, the selection and a few stitches. */
:root{
  --bg:#141217; --panel:#1d1a21; --raised:#27232c; --line:#37313e;
  --ink:#eeeaf1; --muted:#a59eae; --dim:#746d7e;
  --accent:#ff5c9d; --on-accent:#1b0b13; --sel:#3a2231; --seg:#4a4353;
  --stage:#19171c; --shade:rgba(8,6,10,.5); --hud:rgba(20,18,23,.7);
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --mark:Anton,"IBM Plex Sans",Impact,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column;gap:12px;max-width:1560px;margin-inline:auto;padding-block:12px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.mark{display:flex;align-items:center;gap:10px;margin:0;font:400 24px/1 var(--mark);letter-spacing:.8px;text-transform:uppercase;white-space:nowrap}
.mark i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,var(--on-accent) 0 27%,var(--accent) 30%)}
.by{margin:0;font:400 11.5px var(--mono);letter-spacing:.8px;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tagline{order:3;flex:1 1 100%;min-width:0;margin:0;color:var(--muted);max-width:62ch}
.seg{margin-left:auto;display:flex;gap:2px;padding:2px;background:var(--raised);border:1px solid var(--line);border-radius:8px}
.seg button{border:0;background:none;border-radius:6px;min-height:32px;padding:0 13px;font-weight:500;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--seg);color:var(--ink)}

/* bench */
.bench{flex:1;min-height:0;display:grid;gap:12px;grid-template-columns:minmax(0,1fr);grid-template-areas:"stage" "crew" "brief"}
.panel,.stageblock{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.stageblock{grid-area:stage;display:flex;flex-direction:column;overflow:hidden}
.crew{grid-area:crew}.brief{grid-area:brief}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px;padding:0 12px;border-bottom:1px solid var(--line);font:500 11px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.phead span:first-child{color:var(--ink)}

/* stage */
.stage{position:relative;width:100%;aspect-ratio:4/5;max-height:700px;overflow:hidden;background:var(--stage)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage canvas:active{cursor:grabbing}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(125% 95% at 50% 42%,transparent 52%,var(--shade))}
.stage.lens::after{display:none}
.wire{position:absolute;z-index:1;top:12px;right:12px;min-height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--hud);font:500 11px var(--mono);letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.wire[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.fail{position:absolute;z-index:2;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:var(--stage);font-weight:500}
.vfoot{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:3px 18px;padding:11px 12px;border-top:1px solid var(--line)}
.say{margin:0;min-width:0;min-height:1.5em;font-size:16px;font-weight:500;color:var(--ink)}
.say b{margin-right:10px;font:500 11.5px var(--mono);letter-spacing:.9px;text-transform:uppercase;color:var(--accent)}
.hint{margin:0;font:400 11px var(--mono);color:var(--dim)}

/* the crew */
#cast{list-style:none;margin:0;padding:5px}
#cast button{display:grid;grid-template-columns:12px auto minmax(0,1fr);align-items:center;gap:10px;width:100%;min-height:38px;padding:0 9px;border:0;border-radius:7px;background:none;text-align:left;color:var(--muted)}
#cast button:hover{background:var(--raised)}
#cast button[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
#cast b{font-weight:600;font-size:14px;color:var(--ink)}
#cast em{font-style:normal;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:12px;height:12px;border-radius:50%;border:1px solid var(--dim)}

/* who is this */
.name{margin:0;padding:13px 12px 0;font:400 44px/1 var(--mark);letter-spacing:.8px;text-transform:uppercase}
.role{margin:0;padding:6px 12px 0;font:500 12px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--accent)}
.pitch{margin:0;padding:9px 12px 12px;font-size:15px;color:var(--ink);text-wrap:pretty}
.brief dl{margin:0;padding:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px}
.brief dt{font:500 11.5px/1.85 var(--mono);color:var(--accent);white-space:nowrap}
.brief dd{margin:0;font-size:14px;color:var(--muted)}
.made{margin:0;padding:10px 12px 12px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px;text-wrap:pretty}

@media (min-width:760px){.tagline{order:0;flex:1 1 auto}}
@media (max-width:759px){.say{min-height:3em}}
@media (min-width:1000px){
  .app{height:100%}
  .bench{grid-template-columns:minmax(0,1fr) 350px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"stage crew" "stage brief"}
  .stage{flex:1;aspect-ratio:auto;max-height:none;min-height:420px}
  .brief{overflow-y:auto}
  #cast button{min-height:33px}
}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="brand"><h1 class="mark"><i aria-hidden="true"></i>AI Crew</h1><p class="by">by Shelly Or Gisser</p></div>
  <p class="tagline">Seven agents that keep working while you sleep. Tap one and it tells you who it is.</p>
  <div class="seg" role="group" aria-label="View"><button type="button" id="vsolo" aria-pressed="true">One agent</button><button type="button" id="vteam" aria-pressed="false">Whole crew</button></div>
 </header>
 <main class="bench">
  <section class="stageblock" aria-label="Stage">
   <div class="stage" id="stage">
    <canvas id="gl" aria-label="A 3D stage with seven fabric puppets, each holding a sign with its name"></canvas>
    <button type="button" class="wire" id="wire" aria-pressed="false">Wireframe</button>
    <div class="fail" id="fail" hidden>3D could not start in this browser. Reload the page or try another browser.</div>
   </div>
   <div class="vfoot"><p class="say" id="say"></p><p class="hint">Drag to look around · Tap an agent to meet it</p></div>
  </section>
  <section class="crew panel" aria-label="The crew">
   <div class="phead"><span>The crew</span><span>7 agents</span></div>
   <ol id="cast"></ol>
  </section>
  <section class="brief panel" aria-label="Who is this">
   <div class="phead"><span>Who is this</span><span id="b-cloth"></span></div>
   <h2 class="name" id="b-name"></h2>
   <p class="role" id="b-role"></p>
   <p class="pitch" id="b-pitch"></p>
   <dl id="b-rows"></dl>
   <p class="made" id="b-made"></p>
  </section>
 </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
'use strict';
var FALLBACK='https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js';
function fail(){var f=document.getElementById('fail');if(f)f.hidden=false}
function boot(){
  if(window.THREE)return go();
  var s=document.createElement('script');s.src=FALLBACK;s.onload=go;s.onerror=fail;document.head.appendChild(s);
}
function go(){ /* the name signs are drawn with the page fonts, so give them a moment to arrive */
  var run=function(){try{start()}catch(e){console.error(e);fail()}},done=false,once=function(){if(!done){done=true;run()}};
  if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('100px Anton','S'),document.fonts.load('600 40px "IBM Plex Sans"','A'),document.fonts.load('500 40px "IBM Plex Mono"','A')]).then(once,once);setTimeout(once,1800)}else once();
}

function start(){

var Z=new T.Vector3(0,0,1);

      'float coc(float z){return clamp(abs(z-uFocus)/z*uAperture,0.,1.)*uMaxBlur;}',
      'float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}',

var FUZZLEN={felt:.03,velvet:.02,cord:.022,knit:.03,cable:.03,tweed:.028,stripe:.014,stars:.018,kraft:0,airmail:0};

  else if(kind==='kraft'){blot(40,.14,95);for(i=0;i<30;i++){var kx=R()*S,ky=R()*S,ka=R()*6.283,kl=120+R()*300,ex2=kx+Math.cos(ka)*kl,ey2=ky+Math.sin(ka)*kl;x.lineWidth=2;x.strokeStyle=css(D,.2);x.beginPath();x.moveTo(kx,ky);x.lineTo(ex2,ey2);x.stroke();x.lineWidth=1.5;x.strokeStyle=css(L,.26);x.beginPath();x.moveTo(kx+2,ky+2);x.lineTo(ex2+2,ey2+2);x.stroke();

function draw(t){
  if(!post)return renderer.render(scene,cam);
  var u=post.mat.uniforms;u.uFocus.value=cs.fz;u.uAperture.value=S.shade==='wire'?0:cs.ap;u.uTime.value=t%61;
  renderer.setRenderTarget(post.rt);renderer.render(scene,cam);renderer.setRenderTarget(null);renderer.render(post.scene,post.cam);
}
function update(t,dt,skip){
  dt=clamp(dt,0,.1);NOW=t;
  var calm=reduce&&!manual,az=orb.az+(calm?0:Math.sin(t*.42)*.2);
  for(var i=0;i<puppets.length;i++)animate(puppets[i],i,t,dt,az);
  var g=camGoal();if(!cs)cs=g;var k=1-Math.exp(-dt*3.6);for(var q in g)cs[q]=lerp(cs[q],g[q],k);
  var el=clamp(cs.el+orb.el+(calm?0:Math.sin(t*.31)*.02),-.1,.75);
  cam.position.set(cs.tx+Math.sin(az)*Math.cos(el)*cs.d,cs.ty+Math.sin(el)*cs.d,cs.tz+Math.cos(az)*Math.cos(el)*cs.d);cam.lookAt(cs.tx,cs.ty,cs.tz);
  scene.fog.near=cs.d+1.6;scene.fog.far=cs.d+cs.f;
  if(!skip)draw(t);ui(t);
}
var T0=performance.now()/1000,last=0;
function frame(){
  requestAnimationFrame(frame);if(manual)return;
  var w=performance.now()/1000-T0,dt=w-last;last=w;update(w,dt);
}

/* ---------- interface ---------- */
var castEl=$('#cast'),sayEl=$('#say'),castBtns=[],shown=-1,shownFor=-2;
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function press(id,on){$(id).setAttribute('aria-pressed',on?'true':'false')}
DEFS.forEach(function(d,i){var li=el('li'),b=el('button'),sw=el('i','sw');b.type='button';sw.style.background=d.hex;
  b.appendChild(sw);b.appendChild(el('b','',d.name));b.appendChild(el('em','',d.role));
  b.addEventListener('click',function(){select(i,true)});li.appendChild(b);castEl.appendChild(li);castBtns.push(b)});
function paintView(){press('#vsolo',S.view==='solo');press('#vteam',S.view==='team')}
function select(i,goSolo){
  S.sel=i;if(goSolo)S.view='solo';var p=puppets[i],d=p.def;
  castBtns.forEach(function(b,k){b.setAttribute('aria-pressed',k===i?'true':'false')});
  $('#b-cloth').textContent=d.cloth;$('#b-name').textContent=d.name;$('#b-role').textContent=d.role;$('#b-pitch').textContent=d.pitch;
  var rows=$('#b-rows');rows.textContent='';d.brief.forEach(function(r){rows.appendChild(el('dt','',r[0]));rows.appendChild(el('dd','',r[1]))});
  $('#b-made').textContent='Sewn in code, no model files: '+d.cloth.toLowerCase()+', '+p.stitches+' yarn stitches and '+p.teeth+' teeth.';
  say(S.view==='solo'?i:-1);paintView();
}
function setView(v){S.view=v;say(v==='solo'?S.sel:-1);paintView()}
var wireMat=new T.MeshBasicMaterial({color:new T.Color(cssVar('--accent')||'#ff5c9d'),wireframe:true,toneMapped:false,transparent:true,opacity:.42,depthWrite:false});
function setShade(m){S.shade=m;SHELLS.forEach(function(s){s.visible=m==='fabric'});scene.overrideMaterial=m==='wire'?wireMat:null;press('#wire',m==='wire')}
function ui(t){ /* the caption types in step with the jaw */
  var i=talk.i,n=talk.text.length,c=i<0?0:((reduce&&!manual)?n:clamp(Math.floor((t-talk.t0)*CPS),0,n));
  if(i===shownFor&&c===shown)return;shownFor=i;shown=c;sayEl.textContent='';
  if(i<0){sayEl.removeAttribute('aria-label');sayEl.appendChild(el('b','','The crew'));sayEl.appendChild(document.createTextNode('Seven agents, one for every job you would rather not do.'));return}
  sayEl.setAttribute('aria-label',puppets[i].def.name+' says: '+talk.text);
  sayEl.appendChild(el('b','',puppets[i].def.name));sayEl.appendChild(document.createTextNode('“'+talk.text.slice(0,c)+(c<n?'':'”')));
}
$('#vsolo').addEventListener('click',function(){setView('solo')});$('#vteam').addEventListener('click',function(){setView('team')});
$('#wire').addEventListener('click',function(){setShade(S.shade==='wire'?'fabric':'wire')});

/* drag to look around, tap to pick */
var drag=null,ray=new T.Raycaster(),ptr=new T.Vector2();
canvas.addEventListener('pointerdown',function(e){drag={x:e.clientX,y:e.clientY,az:orb.az,el:orb.el,moved:0,touch:e.pointerType==='touch'};try{canvas.setPointerCapture(e.pointerId)}catch(_){}});
canvas.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));orb.az=clamp(drag.az-dx*.007,-1.6,1.6);if(!drag.touch)orb.el=clamp(drag.el+dy*.004,-.12,.6)});
function endDrag(e){if(!drag)return;var tap=drag.moved<7;drag=null;if(!tap)return;
  var r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(ptr,cam);
  var hit=ray.intersectObjects(puppets.map(function(p){return p.root}),true)[0];if(!hit)return;var o=hit.object;while(o&&o.userData.pid==null)o=o.parent;if(o)select(o.userData.pid,true)}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',function(){drag=null});

/* size */
renderer.setClearColor(scene.fog.color);if(post)stage.classList.add('lens');
function size(){var r=stage.getBoundingClientRect();if(!r.width||!r.height)return;renderer.setSize(r.width,r.height,false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();
  if(post){var v=renderer.getDrawingBufferSize(new T.Vector2());post.rt.setSize(v.x,v.y);post.mat.uniforms.uRes.value.copy(v);post.mat.uniforms.uMaxBlur.value=v.y*.017}
  if(cs)draw(NOW)} /* a resize clears the canvas, so paint it again straight away */
size();if(window.ResizeObserver)new ResizeObserver(size).observe(stage);else window.addEventListener('resize',size);

select(0,false);
requestAnimationFrame(frame);

/* hooks for rendering stills and clips frame by frame */
window.aiCrew={
  select:select,setView:setView,setShade:setShade,puppets:puppets,set:function(k,v){S[k]=v},
  renderAt:function(sec,skip){manual=true;var dt=lastManual==null?1/30:sec-lastManual;lastManual=sec;update(sec,dt,skip)},
  snap:function(){cs=camGoal();puppets.forEach(function(p,i){var solo=S.view==='solo'&&i===S.sel,tg=solo?SPOT:SLOTS[i];p.root.position.copy(tg);p.gy=tg.y;p.root.rotation.y=solo?0:-tg.x*.07;p.yaw=0;p.open=0})}
};
}
boot();
})();
</script>
</body>
