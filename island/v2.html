  const acc=new THREE.Group();head.add(acc);
  switch(a.acc){
    case 'headphones':add(acc,new THREE.TorusGeometry(.3,.03,8,24,Math.PI),PH(ac,.4),[0,.02,0]);[-1,1].forEach(s=>add(acc,new THREE.CylinderGeometry(.09,.09,.07,20),PH(ac,.4),[s*.3,0,0],[0,0,Math.PI/2]));break;
    case 'beret':add(acc,new THREE.SphereGeometry(.22,24,12),PH(ac,.7),[.04,.25,0],[0,0,-.25],[1.2,.35,1.15]);add(acc,new THREE.SphereGeometry(.025,8,6),PH(ac,.7),[.06,.33,0]);break;
    case 'glasses':[-1,1].forEach(s=>add(acc,new THREE.TorusGeometry(.065,.012,8,24),PH(ac,.35),[s*.08,.02,.3]));add(acc,box(.05,.012,.012),PH(ac,.35),[0,.03,.3]);break;

   7. WALKERS — the researcher carries an envelope to the writer;
   they meet on the plaza (like the reference) and walk back.
   ========================================================= */
const toWorld=(id,v)=>{const g=ST[id].g;return new THREE.Vector3(g.position.x+v.x,v.y+TOP+.2,g.position.z+v.z)};
function ringArc(s,a0,a1,n=10){const c=lobeC(s),pts=[];for(let i=0;i<=n;i++){const a=lerp(a0,a1,i/n);pts.push(new THREE.Vector3(c.x+Math.cos(a)*3.72,TOP+.26,c.y+Math.sin(a)*3.72))}return pts}
function routeFor(id,meet){const st=STATIONS[id],a=byId[id],ph=a.phi*Math.PI/180,start=toWorld(id,ST[id].home);start.y=TOP+.26;
  const s=a.lobe,toward=Math.PI;let a1=s>0?Math.PI:0;let a0=ph;if(s>0&&a0<0)a0+=Math.PI*2;
  const pts=[start,...ringArc(s,a0,s>0?Math.PI*(a0>Math.PI?1:1):0),new THREE.Vector3(meet.x,TOP+.26,meet.y)];return pts}
function polyAt(pts,u){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+pts[i].distanceTo(pts[i-1]));const d=u*L[L.length-1];let k=1;while(k<pts.length-1&&L[k]<d)k++;
  const s=(d-L[k-1])/Math.max(1e-6,L[k]-L[k-1]);return{p:pts[k-1].clone().lerp(pts[k],clamp(s)),dir:pts[k].clone().sub(pts[k-1])}}
const routes={research:routeFor('research',new THREE.Vector2(.3,.9)),write:routeFor('write',new THREE.Vector2(.85,.9))};

function idle(B,t,ph,k){B.g.position.y+=Math.abs(Math.sin(t*f(12)+ph))*.012;B.head.rotation.z=Math.sin(t*f(6)+ph)*.05;B.plumb.rotation.y=t*f(8);B.plumb.position.y=1.32+Math.sin(t*f(5)+ph)*.03;B.plumb.material.emissiveIntensity=1.4+k*1.6;
  B.arms[0].rotation.set(Math.sin(t*f(7)+ph)*.12,0,.1);B.arms[1].rotation.set(-Math.sin(t*f(7)+ph)*.12,0,-.1);B.legs.forEach(l=>l.rotation.x=0)}
const typing=(B,t,sp=34)=>{B.arms[0].rotation.x=-1.0+Math.sin(t*f(sp))*.12;B.arms[1].rotation.x=-1.0-Math.sin(t*f(sp))*.12}
function applyRig(S,t){
  world.position.y=Math.sin(t*f(2))*.15;
  shards.forEach((s,i)=>s.rotation.y=i+t*f(1)*(i%2?1:-1));
  gems.forEach((g,i)=>{g.m.position.y=g.base.y+Math.sin(t*f(3)+g.ph)*.35;g.m.rotation.y=t*f(4)+i});
  sparks.forEach((s,i)=>{const k=Math.max(0,Math.sin(t*f(11+i%5)+s.userData.ph));s.material.opacity=k*k;s.scale.setScalar(.25+k*.55)});
  clouds.forEach(c=>{const a=c.userData.a+t*f(1)*.15*Math.sign(c.userData.sp||1);c.position.x=Math.cos(a)*c.userData.r;c.position.z=Math.sin(a)*c.userData.r*.8});
  lampCore.material.emissiveIntensity=1.2+Math.sin(t*f(6))*.3+S.act.you*1.5;topGem.rotation.y=t*f(4);
  for(const id in ST){const s=ST[id],B=s.bot,P=s.P,k=Math.max(S.act[id]||0,S.sel===id?1:0),ph=(byId[id].phi||0)*.05;
    if(id!=='you'){B.g.position.copy(s.home);B.g.rotation.y=s.face}
    idle(B,t,ph,k);
    switch(id){
      case 'ig':B.arms[1].rotation.x=-1.2+Math.sin(t*f(14))*.35;B.arms[0].rotation.x=-.3+Math.sin(t*f(10))*.25;P.rec.material.emissiveIntensity=Math.sin(t*f(25))>0?3:.3;break;
      case 'fb':B.arms[0].rotation.z=.7+Math.sin(t*f(9))*.25;B.arms[1].rotation.z=-.7-Math.sin(t*f(9))*.25;P.bubbles.forEach((bb,i)=>{const u=((t*.3+i/3)%1);bb.position.set(-.45+i*.45,.9+u*.6,.1);bb.scale.setScalar(Math.sin(u*Math.PI)*.9)});break;
      case 'li':case 'x':typing(B,t);if(P.posts)P.posts.forEach((p,i)=>p.scale.setScalar(1+.15*Math.max(0,Math.sin(t*f(6)-i))));break;
      case 'video':{typing(B,t,20);const u=(t*f(2)/(Math.PI*2))%1;P.head.position.x=-.4+u*.36;P.clapTop.rotation.z=Math.max(0,Math.sin(t*f(5)))*.5;break;}
      case 'skills':{B.arms[1].rotation.x=-1.3+Math.abs(Math.sin(t*f(10)))*.9;const n=Math.floor(((t*f(2)/(Math.PI*2))%1)*5);P.blocks.forEach((bl,i)=>{const on=i<n;bl.position.set(on?.0:-.3+i*.14,.5+(on?i*.095:0),on?.12:.2);bl.rotation.y=on?0:i});break;}
      case 'hub':B.arms[1].rotation.x=-1.5+Math.sin(t*f(8))*.2;P.cards.forEach((c,i)=>{const u=((t*.1+i*.13)%1);c.position.x=-.27+(i%4)*.18+(u>.88?(u-.88)/.12*.18:0)});break;
      case 'edit':B.head.rotation.x=.3;typing(B,t,8);P.pen.position.set(.05+Math.sin(t*f(16))*.06,.5,.08+Math.cos(t*f(8))*.04);P.pen.rotation.set(.5,0,-.4);break;
      case 'write':typing(B,t);P.carriage.position.x=-.07+((t*f(3)/(Math.PI*2))%1)*.14;break;
      case 'research':B.head.rotation.x=.35;B.arms[0].rotation.x=-1.1;B.arms[1].rotation.x=-1.1;P.book.position.set(s.home.x,.62,s.home.z+.2);P.book.rotation.set(-.5,s.face,0);break;
      case 'you':B.head.rotation.y=Math.sin(t*f(2))*.6;B.arms[0].rotation.x=-1.6;B.arms[1].rotation.x=-1.6;break;
    }
  }
  // walkers
  envelope.visible=false;
  if(S.walk){for(const id of ['research','write']){const w=walkState(id,t);if(w.u<=0)continue;const s=ST[id],B=s.bot;const r=polyAt(routes[id],w.u);
    const local=r.p.clone().sub(new THREE.Vector3(s.g.position.x,s.g.position.y,s.g.position.z));B.g.position.copy(local);
    const dir=r.dir.multiplyScalar(t<13.4?1:-1);if(w.moving){B.g.rotation.y=Math.atan2(dir.x,dir.z);const sw=Math.sin(t*f(40));B.legs[0].rotation.x=sw*.6;B.legs[1].rotation.x=-sw*.6;B.arms[0].rotation.x=-sw*.5;B.arms[1].rotation.x=sw*.5;B.g.position.y+=Math.abs(sw)*.03}
    else{B.g.rotation.y=id==='research'?Math.PI/2:-Math.PI/2;B.arms[id==='research'?1:0].rotation.x=-1.1}
    P_ENV(id,t,B)}
  }
}
function P_ENV(id,t,B){// envelope travels with the researcher, then changes hands to the writer at 13.2
  const holder=t<13.2?'research':'write';if(id!==holder)return;if(t<9.6||t>17)return;
  const hand=B.arms[holder==='research'?1:0];hand.updateWorldMatrix(true,false);const p=new THREE.Vector3(0,-.24,.06).applyMatrix4(hand.matrixWorld);world.worldToLocal(p);envelope.position.copy(p);envelope.rotation.y=B.g.rotation.y;envelope.visible=true;
  if(t>12.9&&t<13.5){const u=ss(12.9,13.5,t);const a=ST.research.bot.g,b=ST.write.bot.g;}
}

const HERO={az:0,el:.6,R:25.5,lx:0,ly:-1.2,lz:.4};
function focusCam(id){
  if(id==='plaza')return{az:.15,el:.42,R:9,lx:.5,ly:.6,lz:.9};
  if(id==='you')return{az:.5,el:.25,R:9.5,lx:0,ly:2.8,lz:-1.7};
  const p=STATIONS[id];return{az:p.x<0?-.18:.18,el:.6,R:7.4,lx:p.x,ly:.45,lz:p.y};
}
function tourCam(t){const c={...HERO};c.az=Math.sin(t*f(1))*.16;
  for(const F of FOCUS){const w=env(t,F.t,F.d,1.0,1.0);if(w<=0)continue;const g=focusCam(F.id);for(const k in c)c[k]=lerp(c[k],g[k],w)}return c}
function actOf(id,t){let a=0;for(const F of FOCUS){if(F.id===id)a=Math.max(a,env(t,F.t,F.d,.6,.6))}
  if(id==='research'||id==='write')a=Math.max(a,env(t,10.2,4.8,.6,.6));if(id==='you')a=Math.max(a,env(t,13.6,1.6,.3,.5));return a}
function tourState(t){const act={};AG.forEach(a=>act[a.id]=actOf(a.id,t));return{act,sel:null,walk:true}}
function tourFocusId(t){for(const F of FOCUS)if(t>=F.t&&t<F.t+F.d)return F.id==='plaza'?(t<13.2?'research':'write'):F.id;return null}

/* =========================================================
   10. POST + HUD
   ========================================================= */
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.28,.4,1.15));composer.addPass(new OutputPass());
let tier=0;
function resize(){const w=innerWidth,h=innerHeight;renderer.setPixelRatio(tier?1:Math.min(devicePixelRatio,2));renderer.setSize(w,h,false);composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(w,h);camera.aspect=w/h;camera.fov=w/h<1?50:30;camera.updateProjectionMatrix();layoutCursor()}
const $=id=>document.getElementById(id);const hex=c=>'#'+c.toString(16).padStart(6,'0');
const BTNS=[];AG.forEach(a=>{const b=document.createElement('button');b.className='bt';b.dataset.id=a.id;b.innerHTML=`<i style="background:${hex(a.col)}"></i>${a.name}`;b.onclick=()=>select(a.id);$('bots').appendChild(b);BTNS.push(b)});
$('track').addEventListener('pointerdown',e=>{const r=$('track').getBoundingClientRect();simT=clamp((e.clientX-r.left)/r.width)*LOOP*.999;toTour()});
let shown=null;function showCard(id){const card=$('card');if(!id){card.classList.add('off');return}card.classList.remove('off');if(id===shown)return;shown=id;const a=byId[id];
  card.style.setProperty('--zone',hex(a.col===0xC9F07A?0x7fae2a:a.col));$('cEn').textContent=a.en;$('cName').textContent=a.name;$('cTasks').innerHTML=a.tasks.map(x=>`<li><span>${x}</span></li>`).join('');
  $('cTrig').textContent=a.trig;$('cYou').textContent=a.you;$('cRule').textContent=a.rule;$('cSrc').textContent=a.src}
// Sims bubbles
const BUB={};AG.forEach(a=>{const el=document.createElement('div');el.className='bub';el.innerHTML=`<b><i style="background:${hex(a.col)}"></i><span class="n">${a.name}</span></b><span class="d"></span><div class="pr"><i style="background:${hex(a.col)}"></i></div>`;$('bubbles').appendChild(el);
  BUB[a.id]={el,d:el.querySelector('.d'),pr:el.querySelector('.pr i'),last:''}});
function doingNow(id,t){const a=byId[id];
  if(id==='research'&&t>9.6&&t<17)return t<12?'הולך לכותב עם המחקר':t<13.2?'מוסר את המעטפה':'חוזר לספרייה';
  if(id==='write'&&t>9.6&&t<17)return t<12?'יוצא לקבל מחקר':t<13.2?'מקבל את המעטפה':'חוזר לכתוב טיוטה';
  if(id==='you'&&t>13.6&&t<15.4)return 'מאשרת גרסה 1';
  const ph=(a.phi||0)/90;const i=Math.floor(((t+ph*2+20)/LOOP*3))%a.doing.length;return a.doing[(i+a.doing.length)%a.doing.length]}
function updateBubbles(S,t){const W=innerWidth,H=innerHeight,hide=document.body.classList.contains('nohud');
  for(const id in ST){const B=ST[id].bot,b=BUB[id];B.plumb.getWorldPosition(wp);wp.y+=.18;const d=wp.distanceTo(camera.position);wp.project(camera);
    const vis=wp.z<1&&!hide?1:0;const x=(wp.x*.5+.5)*W,y=(-wp.y*.5+.5)*H;const k=Math.max(S.act[id]||0,S.sel===id?1:0);
    const big=k>.4;b.el.classList.toggle('big',big);const sc=clamp(17/d,.8,1.2);b.el.style.opacity=vis*(big?1:.92);b.el.style.left=x+'px';b.el.style.top=y+'px';b.el.style.transform=`translate(-50%,-100%) scale(${sc})`;
    const txt=doingNow(id,t);if(txt!==b.last){b.d.textContent=txt;b.last=txt}const pr=((t*.33+(byId[id].phi||0)/360)%1);b.pr.style.width=(pr*100)+'%'}}

/* =========================================================
   11. TOUR ↔ LIVE
   ========================================================= */
const IDLE=25;let mode='tour',blend=1,lastInput=0,playing=true,simT=0,runT=0,film=false;const live={sel:null,cam:null,camT:null};let curCam=tourCam(0);
const orbit={yaw:0,pitch:0,zoom:0,ty:0,tp:0,tz:0,drag:false,lx:0,ly:0};
function takeControl(){lastInput=performance.now();$('invite').classList.add('gone');if(mode==='live')return;mode='live';live.cam={...curCam};live.camT={...curCam};document.body.classList.add('live')}
function toTour(){if(mode==='tour')return;mode='tour';orbit.ty=orbit.tp=orbit.tz=0;live.sel=null;document.body.classList.remove('live')}
function select(id){takeControl();live.sel=id;live.camT=focusCam(id);orbit.ty=orbit.tp=orbit.tz=0;showCard(id)}
$('tourBtn').onclick=toTour;$('playBtn').onclick=()=>{playing=!playing;$('playBtn').textContent=playing?'Pause':'Play'};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('playBtn').click();return}if(e.key==='h'||e.key==='H'){document.body.classList.toggle('nohud');return}if(e.key==='Escape'){toTour();return}takeControl()});
const cv=renderer.domElement;let downXY=null;
cv.addEventListener('pointerdown',e=>{takeControl();downXY=[e.clientX,e.clientY];orbit.drag=true;orbit.lx=e.clientX;orbit.ly=e.clientY;cv.setPointerCapture(e.pointerId);$('tip').style.opacity=0});
cv.addEventListener('pointermove',e=>{if(orbit.drag){lastInput=performance.now();orbit.ty-=(e.clientX-orbit.lx)*.005;orbit.tp=clamp(orbit.tp+(e.clientY-orbit.ly)*.003,-.4,.7);orbit.lx=e.clientX;orbit.ly=e.clientY;return}hover(e)});
cv.addEventListener('pointerup',e=>{orbit.drag=false;if(!downXY)return;const mv=Math.hypot(e.clientX-downXY[0],e.clientY-downXY[1]);downXY=null;if(mv>6)return;const id=pick(e.clientX,e.clientY);if(id)select(id)});
cv.addEventListener('wheel',e=>{takeControl();orbit.tz=clamp(orbit.tz+e.deltaY*.008,-5,14)},{passive:true});
cv.addEventListener('pointerleave',()=>{$('tip').style.opacity=0});
const pickables=[];world.traverse(o=>{if(o.isMesh&&o.userData.bot)pickables.push(o)});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function pick(x,y){ndc.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(pickables,false);return h.length?h[0].object.userData.bot:null}
let lh=0;function hover(e){if(e.pointerType==='touch')return;const now=performance.now();if(now-lh<70)return;lh=now;const id=pick(e.clientX,e.clientY);cv.classList.toggle('hot',!!id);const tip=$('tip');
  if(!id){tip.style.opacity=0;return}tip.textContent=`${byId[id].name} · לחצו להכיר`;tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.style.opacity=1}
setTimeout(()=>{if(!$('invite').classList.contains('gone'))$('invite').classList.add('show')},1800);
const cur=$('cursor');let CK=[];
function layoutCursor(){CK=[];FOCUS.forEach(F=>{const id=F.id==='plaza'?'research':F.id;const el=BTNS.find(b=>b.dataset.id===id);if(!el)return;const r=el.getBoundingClientRect();if(!r.width)return;CK.push({t:F.t,id,x:r.left+r.width*.45,y:r.top+r.height*.6})})}
function cursorAt(t){if(!CK.length)return null;const rest={x:innerWidth*.55,y:innerHeight*.5};let a=null,b=null;for(const k of CK){if(k.t<=t)a=k;else{b=k;break}}
  const pa=a?{x:a.x,y:a.y}:rest;if(!b){const u=ss(a?a.t+.4:0,a?a.t+1.3:1,t);return{x:lerp(pa.x,rest.x,u),y:lerp(pa.y,rest.y,u)}}
  const st=Math.max(a?a.t+.35:b.t-1,b.t-1);const u=easeIO(clamp((t-st)/(b.t-.1-st)));return{x:lerp(pa.x,b.x,u),y:lerp(pa.y,b.y,u)}}
function poseCursor(t,vis){const p=cursorAt(t);if(!p||vis<.01||document.body.classList.contains('nohud')){cur.style.opacity=0;return}
  let press=0,pid=null;for(const k of CK)if(t>=k.t&&t<k.t+.3){press=1-(t-k.t)/.3;pid=k.id}
  cur.style.opacity=vis;cur.style.transform=`translate(${p.x}px,${p.y}px) scale(${1-press*.15})`;const ring=cur.querySelector('.ring');ring.style.opacity=press;ring.style.transform=`translate(-50%,-50%) scale(${1+(1-press)*1.6})`;BTNS.forEach(b=>b.classList.toggle('tap',b.dataset.id===pid))}

/* =========================================================
   12. FRAME
   ========================================================= */
const damp=(a,b,dt,k)=>a+(b-a)*(1-Math.exp(-dt*k));const CAMK=['az','el','R','lx','ly','lz'];const lookV=new THREE.Vector3();
function stateNow(t,dt){const T=tourState(t);if(blend>=1)return T;CAMK.forEach(k=>live.cam[k]=damp(live.cam[k],live.camT[k],dt,2.4));
  const act={};AG.forEach(a=>act[a.id]=lerp(live.sel===a.id?1:0,T.act[a.id],blend));return{act,sel:blend<.5?live.sel:null,walk:true}}
function drawFrame(t,dt){const S=stateNow(t,dt);applyRig(S,t);
  const T=tourCam(t);const c={};CAMK.forEach(k=>c[k]=blend>=1||!live.cam?T[k]:lerp(live.cam[k],T[k],blend));curCam=c;
  if(!film){orbit.yaw=damp(orbit.yaw,orbit.ty,dt,5);orbit.pitch=damp(orbit.pitch,orbit.tp,dt,5);orbit.zoom=damp(orbit.zoom,orbit.tz,dt,5)}
  const az=c.az+orbit.yaw,el=clamp(c.el+orbit.pitch,.05,1.35),R=Math.max(3,c.R+orbit.zoom);
  lookV.set(c.lx,c.ly+world.position.y,c.lz);camera.position.set(lookV.x+Math.sin(az)*Math.cos(el)*R,lookV.y+Math.sin(el)*R,lookV.z+Math.cos(az)*Math.cos(el)*R);camera.lookAt(lookV);
  if(tier<2)composer.render();else renderer.render(scene,camera);return S}
function updateHUD(t,S){const isLive=blend<.5;showCard(isLive?live.sel:tourFocusId(t));const aid=isLive?live.sel:tourFocusId(t);BTNS.forEach(b=>b.classList.toggle('on',b.dataset.id===aid));
  $('fill').style.width=(t/LOOP*100)+'%';$('head').style.left=(t/LOOP*100)+'%';
  $('modeTxt').textContent=isLive?`You're driving · tour in ${Math.max(0,Math.ceil(IDLE-(performance.now()-lastInput)/1000))} s`:'Auto tour · tap anything to drive'}
let last=0,fps=60,fa=0,fn=0,hudAcc=0,tc=0,low=0;
function frame(now){requestAnimationFrame(frame);if(film)return;const dt=Math.min(.05,(now-last)/1000||0);last=now;
  fa+=dt;fn++;if(fa>.5){fps=fn/fa;fa=0;fn=0;tc+=.5;if(tc>3){low=fps<38?low+.5:0;if(low>=2&&tier<2){tier++;low=0;if(tier>1)sun.castShadow=false;resize()}}}
  if(playing){simT=(simT+dt)%LOOP;runT+=dt}if(mode==='live'&&performance.now()-lastInput>IDLE*1000)toTour();blend=clamp(blend+(mode==='tour'?dt:-dt)/.7);
  const S=drawFrame(simT,dt);hudAcc+=dt;if(hudAcc>1/15){updateHUD(simT,S);hudAcc=0}updateBubbles(S,simT);poseCursor(simT,blend)}
window.__oc8={render(t){film=true;mode='tour';blend=1;orbit.yaw=orbit.pitch=orbit.zoom=0;$('invite').classList.add('gone');$('loader').style.display='none';simT=((t%LOOP)+LOOP)%LOOP;runT=t;const S=drawFrame(simT,1/60);updateHUD(simT,S);updateBubbles(S,simT);poseCursor(simT,1)},resume(){film=false},LOOP};
addEventListener('resize',resize);resize();
(async()=>{applyRig(tourState(0),0);try{await renderer.compileAsync(scene,camera)}catch(e){}composer.render();layoutCursor();
  requestAnimationFrame(t=>{last=t;frame(t);setTimeout(()=>$('loader').classList.add('out'),200)});window.__oc8.ready=true})();
</script>
</body>
